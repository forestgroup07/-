<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0a120e" />
  <title>百家乐 · 竖屏壳 v0.3.1</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #f2f2f2;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    .app {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 100dvh;
      margin: 0 auto;
      background: #0a120e;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.55rem;
      position: absolute;
      left: 0; right: 0; top: 0;
      z-index: 3;
      pointer-events: none;
    }
    .topbar button { pointer-events: auto; }
    .btn-back {
      width: 28px; height: 28px; border-radius: 50%;
      border: 0; background: rgba(0,0,0,.45); color: #fff;
      font-size: 1.1rem; line-height: 1;
      display: grid; place-items: center;
    }
    .table-name {
      font-size: 0.88rem; font-weight: 700;
      text-shadow: 0 1px 3px #000;
    }
    .btn-menu {
      width: 30px; height: 30px; border-radius: 50%;
      border: 0; background: rgba(0,0,0,.42);
      display: grid; place-items: center; color: #fff;
    }
    .shell {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .shell-block {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #0a120e;
    }
    .shell-block img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center top;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    /* 顶屏：蓝红底图模版（步骤1加大，对标另两款视频屏占比） */
    .shell-cards {
      flex: 0 0 clamp(240px, 42vh, 380px);
      min-height: 240px;
      background: #193565;
    }
    .shell-cards img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }
    /* 下面：整块绿台（下注+筹码+路纸） */
    .shell-green {
      flex: 1 1 auto;
      min-height: 0;
    }
    .shell-green img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center top;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="topbar">
      <button type="button" class="btn-back" id="btnBack" aria-label="返回">‹</button>
      <div class="table-name">百家乐 · 壳 v0.3.1</div>
      <button type="button" class="btn-menu" id="btnMenu" aria-label="菜单" disabled>☰</button>
    </div>
    <div class="shell" aria-label="百家乐首页壳">
      <section class="shell-block shell-cards" aria-label="顶屏蓝红亮牌">
        <img src="assets/baccarat/shell-top-blue-red.png?v=0.3.1" alt="闲庄顶屏底图" width="750" height="420" decoding="async" />
      </section>
      <section class="shell-block shell-green" aria-label="绿台整块">
        <img src="assets/baccarat/shell-green-full.png?v=0.3.1" alt="绿台下注筹码路纸" width="624" height="672" decoding="async" />
      </section>
    </div>
  </div>
  <script>
    (function () {
      const V = '0.3.1';
      const btnBack = document.getElementById('btnBack');
      if (btnBack) {
        btnBack.addEventListener('click', function () {
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'fg-embed-close' }, '*');
              return;
            }
          } catch (_) {}
          location.href = 'lobby.html?v=' + encodeURIComponent(V);
        });
      }
    })();
  </script>
</body>
</html>
