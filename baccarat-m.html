<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0a120e" />
  <title>百家乐 · 竖屏壳 v1.0.0</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #f2f2f2;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    .app {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 100dvh;
      margin: 0 auto;
      background: #0a120e;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .topbar {
      position: absolute;
      left: 0; right: 0; top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.55rem;
      pointer-events: none;
    }
    .topbar button { pointer-events: auto; }
    .btn-back {
      width: 28px; height: 28px; border-radius: 50%;
      border: 0; background: rgba(0,0,0,.45); color: #fff;
      font-size: 1.1rem; line-height: 1;
      display: grid; place-items: center;
    }
    .btn-menu {
      width: 30px; height: 30px; border-radius: 50%;
      border: 0; background: rgba(0,0,0,.42);
      display: grid; place-items: center; color: #fff;
    }
    .shell {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    /* 顶屏：高度对齐骰宝 .stage */
    .shell-cards {
      flex: 0 0 auto;
      height: clamp(220px, 36vh, 300px);
      position: relative;
      overflow: hidden;
      background: #193565;
    }
    .shell-cards img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    /* 下面：你给的绿台整图 */
    .shell-green {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: #0a120e;
    }
    .shell-green img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center top;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="topbar">
      <button type="button" class="btn-back" id="btnBack" aria-label="返回">‹</button>
      <button type="button" class="btn-menu" id="btnMenu" aria-label="菜单" disabled>☰</button>
    </div>
    <div class="shell" aria-label="百家乐首页">
      <section class="shell-cards" aria-label="顶屏蓝红">
        <img src="assets/baccarat/src-top-blue-red.png?v=1.0.0" alt="蓝红顶屏" width="834" height="462" decoding="async" />
      </section>
      <section class="shell-green" aria-label="绿台">
        <img src="assets/baccarat/src-green-full.png?v=1.0.0" alt="绿台整图" width="868" height="862" decoding="async" />
      </section>
    </div>
  </div>
  <script>
    (function () {
      const V = '1.0.0';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'fg-embed-ready' }, '*');
        }
      } catch (_) {}
      const btnBack = document.getElementById('btnBack');
      if (btnBack) {
        btnBack.addEventListener('click', function () {
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'fg-embed-close' }, '*');
              return;
            }
          } catch (_) {}
          location.href = 'lobby.html?v=' + encodeURIComponent(V);
        });
      }
    })();
  </script>
</body>
</html>
