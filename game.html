    .board-outcome {

      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%) scale(.9);

      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-weight: 900;
      letter-spacing: 0.2em;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, transform .25s ease, visibility .25s;
      text-shadow: 0 4px 18px rgba(0,0,0,.75);
    }
    .board-outcome.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
    .board-outcome.win {
      color: #7dff9f;
      font-size: calc(min(100vw, 100vh * 2188 / 1393) * 96 / 2188);
    }

    .board-outcome.lose {
      color: #ffffff;
      font-size: calc(min(100vw, 100vh * 2188 / 1393) * 36 / 2188);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-shadow: 0 1px 4px rgba(0,0,0,.85);
      top: 62%;
    }

    /* 未点：平贴可见。一点：升起 + 光柱 */
    .chip-btn {
      position: absolute;
      z-index: 32;
      padding: 0; margin: 0; border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 50%;
      line-height: 0;
      overflow: visible;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform var(--chip-slide);
      will-change: transform;
    }
    .chip-btn:focus,
    .chip-btn:focus-visible { outline: none !important; }
    .chip-btn::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 112%;
      height: 32%;
      transform: translateX(-50%) scale(0.55);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at center,
          rgba(255,255,255,1) 0%,
          rgba(255,236,170,.95) 28%,
          rgba(255,255,255,.45) 52%,
          rgba(255,255,255,0) 72%);
      box-shadow:
        0 0 10px 3px rgba(255,255,255,.55),
        0 0 22px 6px rgba(255,230,140,.35);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      transition: opacity .16s ease, transform .2s cubic-bezier(.2,.8,.2,1);
    }
    .chip-btn::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 10%;
      width: 86%;
      height: 140%;
      transform: translateX(-50%) scaleY(0.35);
      transform-origin: 50% 100%;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 9%,
          rgba(255,255,255,.34) 9%,
          rgba(255,255,255,.34) 13%,
          transparent 13%,
          transparent 22%
        ),
        linear-gradient(
          to top,
          rgba(255,255,255,.55) 0%,
          rgba(255,245,200,.28) 38%,
          rgba(255,255,255,0) 78%
        );
      -webkit-mask-image: linear-gradient(to top, #000 0%, #000 35%, transparent 100%);
      mask-image: linear-gradient(to top, #000 0%, #000 35%, transparent 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      filter: blur(0.4px);
      transition: opacity .16s ease, transform .2s cubic-bezier(.2,.8,.2,1);
    }
    .chip-btn img {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
      display: block;
      border-radius: 50%;
      pointer-events: none;
      opacity: 1;
      transform: translateY(0);
      transition: transform .2s cubic-bezier(.2,.8,.2,1);
      filter: none;
      will-change: transform;
    }
    .chip-btn.on { z-index: 99; }
    .chip-btn.on img {
      filter:
        drop-shadow(0 8px 6px rgba(0,0,0,.45))
        drop-shadow(0 0 4px rgba(255,255,255,.5));
    }
    .chip-btn.on::before {
      opacity: 1;
      transform: translateX(-50%) scaleY(1);
    }
    .chip-btn.on::after {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    .chip-btn.on.up img {
      transform: translateY(-22%);
    }

    /* 盖住底图烤死的 10/20/50/100，避免滑动后露出底圈 */
    .chip-cover {
      position: absolute;
      z-index: 30;
      border-radius: 50%;
      background: #000;
      pointer-events: none;
    }
    #cover-a { left: 68.95%; top: 84.15%; width: 4.35%; aspect-ratio: 1; }

    #cover-d { left: 85.13%; top: 84.15%; width: 4.35%; aspect-ratio: 1; }

    /* 整台面定位筹码外形；仅左右裁切，上下不切，避免扁底 */
    .chip-viewport {
      position: absolute;
      inset: 0;
      z-index: 32;
      pointer-events: none;
      overflow: visible;
      clip-path: inset(81.5% 10.65% 8.2% 69.05%);
    }
    .chip-viewport .chip-btn {
      pointer-events: auto;
    }
    #chip-a  { left: 69.104%; top: 84.32%; width: 4.022%; aspect-ratio: 1; }
    #chip-b  { left: 74.543%; top: 84.32%; width: 4.022%; aspect-ratio: 1; }
    #chip-c  { left: 79.982%; top: 84.32%; width: 4.022%; aspect-ratio: 1; }
    #chip-d  { left: 85.283%; top: 84.32%; width: 4.022%; aspect-ratio: 1; }

    /* 左箭头：与底图右侧 > 同款同尺寸；右箭头：只保留透明热区（底图已有 >） */
    .chip-arrow {
      position: absolute;
      z-index: 80;
      padding: 0; margin: 0; border: 0;
      background: transparent;
      cursor: pointer;
      line-height: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity .15s ease;
      pointer-events: auto;
    }
    .chip-arrow:focus,
    .chip-arrow:focus-visible { outline: none !important; }
    .chip-arrow img {
      width: 100%;
      height: auto;
      pointer-events: none;
      display: block;
    }
    .chip-arrow.is-dim {
      opacity: .34;
      cursor: default;
    }
    /* 左 < ：镜像底图右侧 >，同款同尺寸；热区略大于图形 */
    #arrow-l {
      left: 67.55%;
      top: 84.85%;
      width: 1.55%;
      height: 3.35%;
    }
    #arrow-l img {
      width: 55%;
      image-rendering: auto;
    }
    /* 底图 > 在最右侧 ≈98.2%：热区必须盖住这里（以前错盖在 MAX 上所以点不到） */
    #arrow-r {
      left: 97.55%;
      top: 84.55%;
      width: 2.20%;
      height: 4.30%;
    }
    #arrow-r img { display: none; }

    /* 滑入临时筹码 */
    .chip-btn.chip-ghost {

      pointer-events: none;
    }

      function cellRect(key) {
        const c = BET_CELLS[key];
        if (!c) return null;
        const xs = GRID[c.xKey];
        const ys = GRID[c.yKey || 'y'];
        const isPair = c.yKey && /^(yPair|ySing|yTrip)/.test(String(c.yKey));
        const inset = isPair ? (GRID.pairInset ?? 0) : GRID.inset;
        const L = xs[c.x0] + inset;
        const R = xs[c.x1] - inset;
        const T = ys[c.y0] + inset;
        const B = ys[c.y1] - inset;
        return { x: L, y: T, w: R - L, h: B - T };
      }
      function emptyBets() {
        const o = { small: 0, big: 0, odd: 0, even: 0, wrap: 0 };
        for (const k of PAIR_KEYS) o[k] = 0;
        return o;

      function emptyDenom() {
        const o = { small: null, big: null, odd: null, even: null, wrap: null };
        for (const k of PAIR_KEYS) o[k] = null;

      }

      const bg = document.getElementById('bgImg');

      const resultDice = document.getElementById('resultDice');
      const resultSum = document.getElementById('resultSum');
      const resultPay = document.getElementById('resultPay');
      const betZones = [...document.querySelectorAll('.bet-zone')];
      const btnRepeat = document.getElementById('btnRepeat');
      const btnConfirm = document.getElementById('btnConfirm');
      const btnCancel = document.getElementById('btnCancel');
      const toastMsg = document.getElementById('toastMsg');
      const boardOutcome = document.getElementById('boardOutcome');

      function syncBetZones() {
        const nw = bg.naturalWidth || 2188;
        const nh = bg.naturalHeight || 1393;
        if (!nw || !nh) return;
        const ir = bg.getBoundingClientRect();
        const sr = stage.getBoundingClientRect();
        if (ir.width < 2 || ir.height < 2 || sr.width < 2) return;
        const sx = ir.width / nw;
        const sy = ir.height / nh;
        const ox = ir.left - sr.left;
        const oy = ir.top - sr.top;
        for (const z of betZones) {
          const b = cellRect(z.dataset.bet);
          if (!b) continue;
          z.style.left = (ox + b.x * sx) + 'px';
          z.style.top = (oy + b.y * sy) + 'px';
          z.style.width = (b.w * sx) + 'px';
          z.style.height = (b.h * sy) + 'px';
        }
      }
      function syncBetZonesSoon() {
        syncBetZones();
        requestAnimationFrame(() => {
          syncBetZones();
          requestAnimationFrame(syncBetZones);
        });
      }
      syncBetZonesSoon();
      window.addEventListener('resize', syncBetZonesSoon);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(syncBetZonesSoon).observe(stage);
      }
      if (bg.complete) syncBetZonesSoon();
      else bg.addEventListener('load', syncBetZonesSoon);

      let start = 0;
      let selected = null; // 已选筹码面额
      let pendingMarket = null; // 已选盘口
      let pendingStake = 0; // 待确认金额（可被重复下注加倍）
      let busy = false;
      let bettingOpen = true;
      let roundStarted = false;
      let balance = START_BAL;
      let bets = emptyBets();
      let betDenom = emptyDenom();
      let toastTimer = null;

      function fmtBal(n) {
        return Math.round(n).toLocaleString('en-US');
      }
      function setBalance(n, flash) {
        const prev = balance;
        balance = Math.max(0, Math.round(n));
        balEl.textContent = fmtBal(balance);
        if (flash && balance !== prev) {
          balEl.classList.remove('flash-up', 'flash-down');
          void balEl.offsetWidth;
          balEl.classList.add(balance > prev ? 'flash-up' : 'flash-down');
          setTimeout(() => balEl.classList.remove('flash-up', 'flash-down'), 500);
        }
      }
      function paintBets() {
        betZones.forEach((zone) => {
          const key = zone.dataset.bet;
          const stake = bets[key] || 0;
          zone.classList.toggle('has-bet', stake > 0);
          let chip = zone.querySelector('.bet-chip');
          let amt = zone.querySelector('.bet-stake');
          if (stake <= 0) {
            if (chip) chip.remove();
            if (amt) amt.remove();
            return;
          }
          const denom = betDenom[key] || stake;
          if (!chip) {
            chip = document.createElement('img');
            chip.className = 'bet-chip';
            chip.alt = '';
            chip.draggable = false;
            zone.appendChild(chip);
          }
          const src = srcFor(denom);
          if (chip.getAttribute('src') !== src) chip.src = src;
          if (!amt) {
            amt = document.createElement('span');
            amt.className = 'bet-stake';
            zone.appendChild(amt);
          }
          amt.textContent = String(stake);
        });
      }
      function clearPending(silent) {
        pendingMarket = null;
        pendingStake = 0;
        paintPending();
        if (!silent) showToast('已取消', 1000);
      }
      function resetBets() {
        bets = emptyBets();
        betDenom = emptyDenom();
        pendingMarket = null;
        pendingStake = 0;
        paintBets();
        paintPending();
      }
      function paintPending() {
        betZones.forEach((z) => {
          const on = z.dataset.bet === pendingMarket && pendingStake > 0;
          z.classList.toggle('is-key-on', on);
          let pend = z.querySelector('.bet-pend');
          if (!on) {
            if (pend) pend.remove();
            return;
          }
          if (!pend) {
            pend = document.createElement('span');
            pend.className = 'bet-stake bet-pend';
            z.appendChild(pend);
          }
          pend.textContent = String(pendingStake);
        });
      }
      /** 确定时：所有浅绿按键闪一下 */
      function flashGreenKeys() {
        const keys = betZones.filter(
          (z) => z.classList.contains('is-key-on') || z.classList.contains('has-bet')

        keys.forEach((z) => {
          z.classList.remove('key-flash');
          void z.offsetWidth;
          z.classList.add('key-flash');

        return keys.length ? 520 : 0;
      }
      function showToast(text, ms = 1600, kind) {
        toastMsg.textContent = text;
        toastMsg.classList.toggle('is-success', kind === 'success');

      function showBoardOutcome(kind) {
        boardOutcome.classList.remove('show', 'win', 'lose');
        if (!kind) return;
        boardOutcome.textContent = kind === 'win' ? '赢' : '输';
        boardOutcome.classList.add(kind, 'show');

      function hideBoardOutcome() {
        boardOutcome.classList.remove('show', 'win', 'lose');
        boardOutcome.textContent = '';
      }
      function rollDice() {
        const one = () => 1 + Math.floor(Math.random() * 6);
        return [one(), one(), one()];
      }
      function classify(dice) {
        const sum = dice[0] + dice[1] + dice[2];
        return {
          dice,
          sum,
          size: sum >= 11 ? 'big' : 'small',
          parity: sum % 2 === 0 ? 'even' : 'odd',
          triple: dice[0] === dice[1] && dice[1] === dice[2],
        };
      }
      /** 大小单双 1 赔 1；全圍 1 赔 24；组合 1 赔 5；指定对子 1 赔 8 */
      function settle(info) {
        let staked = 0;
        let returned = 0;
        const hits = [];
        const dice = info.dice;
        const counts = [0, 0, 0, 0, 0, 0, 0];
        for (const n of dice) counts[n] += 1;
        const keys = ['small', 'big', 'odd', 'even', 'wrap', ...PAIR_KEYS];
        for (const key of keys) {
          const stake = bets[key] || 0;
          if (stake <= 0) continue;
          staked += stake;
          let win = false;
          let mult = 2;
          if (key === 'small') win = info.size === 'small';
          else if (key === 'big') win = info.size === 'big';
          else if (key === 'odd') win = info.parity === 'odd';
          else if (key === 'even') win = info.parity === 'even';
          else if (key === 'wrap') {
            win = info.triple;
            mult = 25;
          } else if (key[0] === 'c') {
            const a = Number(key[1]);
            const b = Number(key[2]);
            win = counts[a] > 0 && counts[b] > 0;
            mult = 6;
          } else if (key[0] === 'd') {
            const n = Number(key[1]);
            win = counts[n] >= 2;
            mult = 9;
          } else if (key[0] === 'f') {
            const n = Number(key[1]);
            const cnt = counts[n] || 0;
            if (cnt >= 1) {
              win = true;
              mult = cnt + 1; /* 1x1 / 1x2 / 1x3 → 返还 2/3/4 */
            }
          } else if (key[0] === 't') {
            const n = Number(key[1]);
            win = counts[n] === 3;
            mult = 151; /* 1 x 150 */
          }
          if (win) {
            returned += stake * mult;
            hits.push(BET_LABEL[key] || key);
          }
        }
        const net = returned - staked;
        if (returned > 0) {
          setBalance(balance + returned, true);
        } else if (staked > 0) {
          // 输：注金早在下注时扣过；闪一下积分提醒已变动
          balEl.classList.remove('flash-up', 'flash-down');
          void balEl.offsetWidth;
          balEl.classList.add('flash-down');
          setTimeout(() => balEl.classList.remove('flash-down'), 500);
        }
        return { staked, returned, net, hits };
      }
      function paintDiceFaces(dice) {
        const dies = [...resultDice.querySelectorAll('.die')];
        dice.forEach((n, i) => {
          const el = dies[i];
          if (!el) return;

      function showDiceOnly(info) {
        paintDiceFaces(info.dice);
        const sizeTxt = info.size === 'big' ? '大' : '小';
        const parTxt = info.parity === 'odd' ? '单' : '双';
        resultSum.textContent = `${info.dice[0]} · ${info.dice[1]} · ${info.dice[2]}  共 ${info.sum} 点 · ${sizeTxt}/${parTxt}`;
        resultPay.classList.remove('win', 'lose', 'flat');
        resultPay.textContent = '开奖中';
        resultPay.classList.add('flat');
        hideBoardOutcome();
        resultBoard.classList.add('show');

        const sizeTxt = info.size === 'big' ? '大' : '小';

        resultSum.textContent = `${info.dice[0]} · ${info.dice[1]} · ${info.dice[2]}  共 ${info.sum} 点 · ${sizeTxt}/${parTxt}`;

          showBoardOutcome('win');

          resultPay.textContent = '';
          resultPay.classList.add('flat');
          showBoardOutcome('lose');

          resultPay.textContent = '打平';
          resultPay.classList.add('flat');

      /* ---------- 女声：对标荷官 TTS（以前能出声那套）+ 预录 ---------- */
      const Voice = {

          youWin: `audio/you-win.mp3?v=${V}`,
          youLose: `audio/you-lose.mp3?v=${V}`,
          coin: `audio/coin-bag.mp3?v=${V}`,
          tick: `audio/tick.mp3?v=${V}`,
          bombTick: `audio/bomb-tick.mp3?v=${V}`,
          keyClick: `audio/key-click.mp3?v=${V}`,
        },
        clipFor: {
          '欢迎进入骰宝游戏': 'welcome',
          '开始下注': 'startBet',
          '停止下注': 'stopBet',
          '下注成功': 'betOk',
          '恭喜你赢钱了': 'youWin',
          '很遗憾你输了': 'youLose',
        },
        /* TTS 读音校正：骰宝念「头宝」，绝不能念成「筛宝」 */
        ttsAlias: {
          '欢迎进入骰宝游戏': '欢迎进入头宝游戏',
        },

        init() {
          Object.keys(this.players).forEach((k) => {
            const el = this.players[k];
            if (!el) return;
            el.src = this.clips[k];
            el.preload = 'auto';
            el.volume = 1;
            try { el.load(); } catch (_) { /* ignore */ }
          });
          if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
          }
        },

        /** 关页/切走：立刻停声（系统女声关标签后仍可能续播，必须强杀） */
        silence() {
          this.dead = true;
          this._playToken = {};
          this.pending.length = 0;
          this.pendingText = null;
          const killTts = () => {
            try {
              if (window.speechSynthesis) window.speechSynthesis.cancel();
            } catch (_) { /* ignore */ }
          };
          killTts();
          try { setTimeout(killTts, 0); } catch (_) { /* ignore */ }
          Object.keys(this.players).forEach((k) => {
            const el = this.players[k];
            if (!el) return;
            try {
              el.pause();
              el.currentTime = 0;
              el.muted = true;
              el.volume = 0;
            } catch (_) { /* ignore */ }
          });
          (this._ephemeral || []).forEach((el) => {
            try { el.pause(); el.muted = true; el.src = ''; } catch (_) { /* ignore */ }
          });
          this._ephemeral = [];
          // 页面上所有 audio 一并停（防漏网）
          try {
            document.querySelectorAll('audio').forEach((el) => {
              el.pause();
              el.muted = true;
              el.currentTime = 0;
            });
          } catch (_) { /* ignore */ }
          try {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
          } catch (_) { /* ignore */ }
          try {
            if (this.ctx && this.ctx.state === 'running') this.ctx.suspend();
          } catch (_) { /* ignore */ }
        },

        unlock() {
          this.dead = false;
          try {
            Object.keys(this.players).forEach((k) => {
              const el = this.players[k];
              if (!el) return;
              el.muted = false;
              el.volume = 1;
            });
          } catch (_) { /* ignore */ }
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
              this.ctx = this.ctx || new AC();
              if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            // 不再唤醒 speechSynthesis（关页后系统女声杀不掉）
            this.unlocked = true;
            while (this.pending.length) {
              const fn = this.pending.shift();
              try { fn(); } catch (_) { /* ignore */ }
            }
            if (this.pendingText) {
              const t = this.pendingText;
              this.pendingText = null;
              this.speak(t);
            }
          } catch (_) { /* ignore */ }
        },

        playEl(el) {
          return new Promise((resolve) => {
            if (this.dead || !el) { resolve(false); return; }
            let settled = false;
            let playing = false;
            const token = {};
            this._playToken = token;
            const done = (ok) => {
              if (settled) return;
              settled = true;
              clearTimeout(loadTimer);
              clearTimeout(endTimer);
              resolve(!!ok);
            };
            // 加载失败才超时；一旦开始播必须等播完，绝不能 350ms 误判导致下一句叠上去
            const loadTimer = setTimeout(() => {
              if (!playing) done(false);
            }, 4000);
            let endTimer = null;
            el.pause();
            try { el.currentTime = 0; } catch (_) { /* ignore */ }
            el.onended = () => done(true);
            el.onerror = () => done(false);
            const kick = () => {
              if (settled || this.dead || this._playToken !== token) return;
              const p = el.play();
              if (p && typeof p.then === 'function') {
                p.then(() => {
                  if (settled || this._playToken !== token) {
                    try { el.pause(); } catch (_) { /* ignore */ }
                    return;
                  }
                  playing = true;
                  clearTimeout(loadTimer);
                  // 兜底：按时长结束，防止 onended 丢了卡住
                  const dur = (Number.isFinite(el.duration) && el.duration > 0)
                    ? el.duration * 1000 + 200
                    : 5000;
                  endTimer = setTimeout(() => done(true), dur);
                }).catch(() => done(false));
              } else {
                done(false);
              }
            };
            if (el.readyState >= 2) kick();
            else {
              const onReady = () => kick();
              el.addEventListener('canplay', onReady, { once: true });
              try { el.load(); } catch (_) { kick(); }
            }
          });
        },

        pickFemaleVoice(u) {
          const vs = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
          // 优先台湾女声（美佳），偏林志玲甜软腔
          const female = vs.find((v) => /Meijia|美佳/i.test(v.name))
            || vs.find((v) => /zh-TW|zh_TW/i.test(v.lang) && /female|Mei|美|婷|晓|女|Ting|Yaoyao/i.test(v.name))
            || vs.find((v) => /zh|Chinese/i.test(v.lang) && /female|婷|晓|女|Mei|Ting|Xiaoxiao|Yaoyao|Tingting|Meijia/i.test(v.name))
            || vs.find((v) => /zh-TW|zh_TW|zh-CN|zh_CN|Chinese/i.test(v.lang));
          if (female) {
            u.voice = female;
            u.lang = female.lang || 'zh-TW';
          } else {
            u.lang = 'zh-TW';
          }
        },

        awaitVoices() {
          return new Promise((resolve) => {
            if (!window.speechSynthesis) { resolve(); return; }
            const vs = window.speechSynthesis.getVoices();
            if (vs && vs.length) { resolve(); return; }
            const done = () => resolve();
            window.speechSynthesis.addEventListener('voiceschanged', done, { once: true });
            setTimeout(done, 400);
          });
        },

        async playSfx(key) {
          const el = this.players[key];
          if (!el) return;
          await this.playEl(el);
        },

        /** 禁止用系统 TTS：关标签后 macOS 女声还会继续响。只用页面 audio。 */
        tts() {
          return Promise.resolve();
        },

        /** 播一个临时 mp3（随页面生死，关页必停） */
        playUrl(url) {
          return new Promise((resolve) => {
            if (this.dead) { resolve(false); return; }
            const el = new Audio(url);
            el.preload = 'auto';
            el.volume = 1;
            let settled = false;
            const done = (ok) => {
              if (settled) return;
              settled = true;
              try { el.pause(); } catch (_) { /* ignore */ }
              resolve(!!ok);
            };
            const timer = setTimeout(() => done(false), 4000);
            el.onended = () => { clearTimeout(timer); done(true); };
            el.onerror = () => { clearTimeout(timer); done(false); };
            const p = el.play();
            if (p && typeof p.then === 'function') {
              p.then(() => {}).catch(() => { clearTimeout(timer); done(false); });
            }
            // 关页时一并静音
            this._ephemeral = this._ephemeral || [];
            this._ephemeral.push(el);
          });
        },

        /** 一句一句播：串行队列，上一句播完才下一句；只用预录 mp3。返回是否真正播出。 */
        async speak(text) {
          const run = async () => {
            if (this.dead) return false;
            // 打断上一句音源
            this._playToken = {}; // 作废进行中的 playEl
            try {
              if (window.speechSynthesis) window.speechSynthesis.cancel();
              Object.keys(this.players).forEach((k) => {
                if (k === 'tick' || k === 'bombTick' || k === 'coin' || k === 'keyClick') return;
                const el = this.players[k];
                if (!el) return;
                try { el.pause(); el.currentTime = 0; } catch (_) { /* ignore */ }
              });
              (this._ephemeral || []).forEach((el) => {
                try { el.pause(); el.src = ''; } catch (_) { /* ignore */ }
              });
              this._ephemeral = [];
            } catch (_) { /* ignore */ }

            const key = this.clipFor[text];
            if (key && this.players[key]) {
              return await this.playEl(this.players[key]);
            }

            // 报点：3点、5点、2点，共10点 → 全 mp3 拼接
            const m = /^(\d)点、(\d)点、(\d)点，共(\d{1,2})点$/.exec(text);
            if (m) {
              const [, a, b, c, sum] = m;
              for (const n of [a, b, c]) {
                if (this.dead) return false;
                const ok = await this.playUrl(`audio/dice-${n}.mp3?v=${V}`);
                if (!ok) return false;
              }
              if (this.dead) return false;
              return await this.playUrl(`audio/sum-${sum}.mp3?v=${V}`);
            }
            return false;
          };

          // 严格排队：欢迎说完才「开始下注」
          const prev = this._speakChain || Promise.resolve();
          let release;
          this._speakChain = new Promise((r) => { release = r; });
          await prev.catch(() => {});
          try {
            return await run();
          } finally {
            release();
          }
        },

        /** 短音效：钟表滴答 / 炸弹滴滴（预录，不再用刺耳方波） */
        playQuick(key, vol = 0.6) {
          if (this.dead) return;
          const el = this.players[key];
          if (!el) return;
          try {
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            el.pause();
            el.currentTime = 0;
            el.volume = vol;
            const p = el.play();
            if (p && typeof p.catch === 'function') p.catch(() => {});
          } catch (_) { /* ignore */ }
        },

        /** 普通秒：钟表滴答 */
        tick() {
          this.playQuick('tick', 0.52);
        },

        /** ≤10 秒：定时炸弹滴滴 */
        bombTick() {
          this.playQuick('bombTick', 0.62);
        },
      };

      function setTimerDisplay(sec) {
        const p = Math.max(0, Math.min(1, sec / BET_SECS));
        timerEl.style.setProperty('--p', String(p));
        timerNum.textContent = String(sec);
        timerEl.classList.toggle('danger', sec > 0 && sec <= 10);
        if (sec <= 0) timerEl.classList.add('danger');
      }

      function setBettingOpen(open) {
        bettingOpen = open;
        stage.classList.toggle('betting-closed', !open);
      }

      function showStopBet(show) {
        stopBetEl.classList.toggle('show', !!show);
      }

      function srcFor(n) {
        return `chips/chip-${n}.webp?v=${V}`;
      }

      let welcomed = false;
      const unlockWaiters = [];

      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }
      function alive() {
        return !Voice.dead && !document.hidden;
      }
      function whenAudioReady() {
        if (Voice.unlocked && !Voice.dead) return Promise.resolve();
        return new Promise((resolve) => { unlockWaiters.push(resolve); });
      }
      function notifyAudioReady() {
        const q = unlockWaiters.splice(0);
        q.forEach((fn) => { try { fn(); } catch (_) { /* ignore */ } });
      }

      async function runRound() {
        if (roundStarted) return;
        roundStarted = true;
        resetBets();
        hideResult();
        setBettingOpen(true);
        showStopBet(false);
        setTimerDisplay(BET_SECS);

        // 浏览器禁止未手势自动播：必须等用户点一下再出声，否则会「假成功」导致以后再也不欢迎
        await whenAudioReady();
        if (!alive()) { roundStarted = false; return; }

        if (!welcomed) {
          if (!alive()) { roundStarted = false; return; }
          const okWelcome = await Voice.speak('欢迎进入骰宝游戏');
          if (!alive()) { roundStarted = false; return; }
          if (okWelcome) {
            await sleep(280);
            if (!alive()) { roundStarted = false; return; }
            const okStart = await Voice.speak('开始下注');
            if (okStart) welcomed = true;
          }
          // 若被自动播放拦截，不标 welcomed，下次点按再试
          if (!welcomed) {
            roundStarted = false;
            return;
          }
        } else {
          if (!alive()) { roundStarted = false; return; }
          await Voice.speak('开始下注');
        }

        for (let t = BET_SECS; t >= 1; t--) {
          if (!alive()) { roundStarted = false; return; }
          setTimerDisplay(t);
          if (t <= 10) Voice.bombTick();
          else Voice.tick();
          await sleep(1000);
        }

        if (!alive()) { roundStarted = false; return; }
        setTimerDisplay(0);
        setBettingOpen(false);
        showStopBet(true);
        await Voice.speak('停止下注');

        // 停注后停顿 5 秒 → 三骰上屏 → 报点数 → 再判输赢
        if (!alive()) { roundStarted = false; return; }
        await sleep(5000);
        if (!alive()) { roundStarted = false; return; }
        showStopBet(false);

        const info = classify(rollDice());
        showDiceOnly(info);
        const [a, b, c] = info.dice;
        await Voice.speak(`${a}点、${b}点、${c}点，共${info.sum}点`, { rate: 0.84 });
        if (!alive()) { roundStarted = false; return; }

        const pay = settle(info);
        showResultPay(info, pay);

        if (pay.staked > 0 && pay.net > 0) {
          // 赢：金币哗啦啦，再说恭喜
          await Voice.playSfx('coin');
          await sleep(200);
          await Voice.playSfx('coin');
          await Voice.speak('恭喜你赢钱了');
        }
        // 输：只显示小白字「输」，不说话

        if (!alive()) { roundStarted = false; return; }
        await sleep(3500);
        roundStarted = false;
        if (alive()) runRound();
      }

      // 静默解锁音频，无提示按钮
      Voice.init();
      document.addEventListener('pointerdown', () => {
        Voice.unlock();
        notifyAudioReady();
        if (!roundStarted) runRound();
      }, { passive: true });
      // 关页/切走：马上静音（capture 尽早拦；切回前台不自动恢复，点一下再播）
      const killAudio = () => Voice.silence();
      window.addEventListener('pagehide', killAudio, true);
      window.addEventListener('beforeunload', killAudio, true);
      window.addEventListener('unload', killAudio, true);
      window.addEventListener('freeze', killAudio, true);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) Voice.silence();
      }, true);
      setBalance(START_BAL);
      setTimerDisplay(BET_SECS);
      runRound();

      function visibleDenoms() {
        return DENOMS.slice(start, start + VISIBLE);
      }

      function syncArrows() {
        const atStart = start <= 0;
        const atEnd = start >= DENOMS.length - VISIBLE;
        arrowL.classList.toggle('is-dim', atStart);
        arrowR.classList.toggle('is-dim', atEnd);
        arrowL.setAttribute('aria-disabled', atStart ? 'true' : 'false');
        arrowR.setAttribute('aria-disabled', atEnd ? 'true' : 'false');
      }

      function paint() {
        const list = visibleDenoms();
        chips.forEach((btn, i) => {
          const n = list[i];
          const img = btn.querySelector('img');
          if (img.getAttribute('src') !== srcFor(n)) img.src = srcFor(n);
          btn.dataset.value = String(n);
          btn.setAttribute('aria-label', `筹码${n}`);
          const on = selected === n;
          btn.classList.toggle('on', on);
          btn.classList.toggle('up', on);
        });
        syncArrows();
      }

      function clearSelectVisual() {
        chips.forEach((b) => b.classList.remove('on', 'up'));
      }

      chips.forEach((btn) => {
        btn.addEventListener('click', () => {
          if (busy || !bettingOpen) return;
          const n = Number(btn.dataset.value);
          if (!Number.isFinite(n) || n <= 0) return;
          if (balance < n) return;
          selected = n;
          clearSelectVisual();
          btn.classList.add('on');
          requestAnimationFrame(() => {
            requestAnimationFrame(() => btn.classList.add('up'));
          });
        });
      });

      /** 確定：绿键齐闪 → 立体「下注成功」→ 扣积分/口播 */
      async function confirmBet() {
        if (!bettingOpen) return false;
        if (!selected) {
          showToast('请先选择筹码', 1200);
          return false;
        }
        if (!pendingMarket || pendingStake <= 0) {
          showToast('请先选择大/小/单/双', 1200);
          return false;
        }
        if (balance < pendingStake) {
          showToast('积分不足', 1200);
          return false;
        }
        const key = pendingMarket;
        const amt = pendingStake;
        Voice.playQuick('keyClick', 0.85);
        // 先落注让 has-bet 变绿，再全部绿键闪
        setBalance(balance - amt, true);
        bets[key] += amt;
        betDenom[key] = selected || amt;
        pendingMarket = null;
        pendingStake = 0;
        paintBets();
        paintPending();
        const wait = flashGreenKeys();
        await new Promise((r) => setTimeout(r, Math.max(180, wait * 0.55)));
        showToast('下注成功', 1800, 'success');
        await Voice.speak('下注成功');
        return true;
      }

      /** 重複下注：当前待确认金额再加一倍 */
      function repeatBet() {
        if (!bettingOpen) return;
        Voice.playQuick('keyClick', 0.7);
        if (!pendingMarket || pendingStake <= 0) {
          showToast('请先选筹码并点大/小/单/双', 1400);
          return;
        }
        const next = pendingStake * 2;
        if (balance < next) {
          showToast('积分不足，无法加倍', 1400);
          return;
        }
        pendingStake = next;
        paintPending();
        showToast(`加倍 ${pendingStake}`, 1000);
      }

      /** 取消：清掉未确认的选择 */
      function cancelBet() {
        if (!bettingOpen) return;
        Voice.playQuick('keyClick', 0.65);
        if (!pendingMarket && pendingStake <= 0) {
          showToast('没有可取消的下注', 1000);
          return;
        }
        clearPending(false);
      }

      betZones.forEach((zone) => {
        zone.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          Voice.unlock();
          if (!bettingOpen) return;
          if (!selected) {
            showToast('请先选择筹码', 1200);
            return;
          }
          const key = zone.dataset.bet;
          if (!(key in bets)) return;
          pendingMarket = key;
          pendingStake = selected; // 先按当前筹码额挂单
          Voice.playQuick('keyClick', 0.7);
          paintPending(); // 整格透明黄 × 底图字透红
        });
      });

      btnConfirm.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        Voice.unlock();
        await confirmBet();
      });
      btnCancel.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        Voice.unlock();
        cancelBet();
      });
      btnRepeat.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        Voice.unlock();
        repeatBet();
      });

      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      async function slide(dir) {
        if (busy) return;
        const next = start + dir;
        if (next < 0 || next > DENOMS.length - VISIBLE) return;
        busy = true;
        try {
          clearSelectVisual();

          const entering = dir > 0
            ? DENOMS[start + VISIBLE]
            : DENOMS[start - 1];

          const ghost = document.createElement('button');
          ghost.className = 'chip-btn chip-ghost';
          ghost.type = 'button';
          ghost.tabIndex = -1;
          const gImg = document.createElement('img');
          gImg.src = srcFor(entering);
          gImg.alt = '';
          gImg.draggable = false;
          ghost.appendChild(gImg);

          // 第 5 枚在左右裁切线外待命，滑入时被 clip，肉眼始终 4 枚；上下不裁以保圆形
          ghost.style.left = (dir > 0
            ? SLOT_LEFT[VISIBLE - 1] + GAP
            : SLOT_LEFT[0] - GAP) + '%';
          ghost.style.top = '84.32%';
          ghost.style.width = '4.022%';
          ghost.style.aspectRatio = '1';
          viewport.appendChild(ghost);

          const gapPx = (GAP / 100) * stage.clientWidth;
          const dx = dir > 0 ? -gapPx : gapPx;
          const movers = [...chips, ghost];
          void ghost.offsetWidth;
          movers.forEach((el) => {
            el.style.transition = 'transform var(--chip-slide)';
            el.style.transform = `translateX(${dx}px)`;
          });

          await sleep(400);

          start = next;
          movers.forEach((el) => {
            el.style.transition = 'none';
            el.style.transform = '';
          });
          ghost.remove();
          paint();
          void chips[0].offsetWidth;
          chips.forEach((el) => { el.style.transition = ''; });

          if (selected != null) {
            const btn = chips.find((b) => Number(b.dataset.value) === selected);
            if (btn) {
              btn.classList.add('on');
              requestAnimationFrame(() => btn.classList.add('up'));
            } else {
              selected = null;
            }
          }
        } catch (_) {
          start = Math.max(0, Math.min(DENOMS.length - VISIBLE, start + dir));
          paint();
        } finally {
          busy = false;
        }
      }

      function bindArrow(el, dir) {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          slide(dir);
        });
      }
      bindArrow(arrowL, -1);
      bindArrow(arrowR, 1);

      // 台面先出：筹码图空闲再预热，避免抢首屏带宽
      const warmChips = () => { DENOMS.forEach((n) => { const i = new Image(); i.src = srcFor(n); }); };
      if ('requestIdleCallback' in window) requestIdleCallback(warmChips, { timeout: 2500 });
      else setTimeout(warmChips, 1200);
      paint();
    })();
  </script>
</body>
</html>
