<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Forest Group · 登录注册</title>
  <!-- 手机过渡海报：登录页猛预热（webp 优先，体积小） -->
  <link rel="preload" as="image" href="assets/loading-posters/lucky-m.webp?v=1.5.1m4" type="image/webp" />
  <link rel="preload" as="image" href="assets/loading-posters/sanbao-m.webp?v=1.5.1m4" type="image/webp" />
  <link rel="preload" as="image" href="assets/loading-posters/lucky-m.jpg?v=1.5.1m4" type="image/jpeg" />
  <link rel="preload" as="image" href="assets/loading-posters/sanbao-m.jpg?v=1.5.1m4" type="image/jpeg" />
  <link rel="preload" as="image" href="assets/loading-posters/lucky-pc.jpg?v=1.5.1m4" type="image/jpeg" media="(min-width: 901px)" />
  <link rel="preload" as="image" href="assets/loading-posters/sanbao-pc.jpg?v=1.5.1m4" type="image/jpeg" media="(min-width: 901px)" />
  <style>
    :root {
      --gold: #d4b06a;
      --gold-bright: #f0d392;
      --gold-deep: #a67c2e;
      --ink: #0a0c10;
      --line: rgba(212, 176, 106, 0.35);
      --muted: rgba(232, 226, 212, 0.55);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%;
      background: var(--ink);
      color: #e8e2d4;
      font-family: "PingFang SC", "PingFang TC", "Microsoft YaHei", sans-serif;
    }
    .scene {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.2rem 1rem calc(4.2rem + var(--safe-b));
      background:
        radial-gradient(ellipse at 50% 0%, #1a1520 0%, #0a0c10 55%, #050608 100%);
    }
    .wrap {
      width: min(420px, 100%);
      margin-top: 2vh;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .brand { text-align: center; }
    .brand-mark {
      width: 78px; height: 78px;
      margin: 0 auto .65rem;
      border-radius: 50%;
      display: grid; place-items: center;
      background: radial-gradient(circle at 35% 30%, #f7e2a8, #c9973a 55%, #7a5418 100%);
      box-shadow: 0 0 0 2px rgba(255,220,150,.35), 0 10px 28px rgba(0,0,0,.45);
      color: #2a1a05;
      font-family: "Songti SC", "STSong", serif;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.05;
    }
    .brand h1 {
      font-size: clamp(1.2rem, 3.2vw, 1.7rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--gold-bright);
      text-indent: 0.22em;
    }
    .brand p {
      margin-top: .3rem;
      font-size: .74rem;
      letter-spacing: 0.18em;
      color: var(--muted);
    }
    .panel {
      width: 100%;
      padding: 1.15rem 1.1rem 1.2rem;
      border-radius: 12px;
      background: rgba(10, 12, 16, 0.92);
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .35rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .tab {
      border: 0;
      background: transparent;
      color: rgba(232,226,212,.55);
      font-size: .95rem;
      font-weight: 700;
      padding: .55rem 0 .7rem;
      cursor: pointer;
      position: relative;
    }
    .tab.is-on {
      color: var(--gold-bright);
    }
    .tab.is-on::after {
      content: "";
      position: absolute;
      left: 18%; right: 18%;
      bottom: 0;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #f3dfa0, #b8893a);
    }
    .pane { display: none; }
    .pane.is-on { display: block; }
    .field {
      position: relative;
      margin-bottom: .72rem;
    }
    .field label {
      display: block;
      margin-bottom: .28rem;
      font-size: .72rem;
      color: rgba(232,226,212,.62);
      letter-spacing: .04em;
    }
    .field label .req { color: #ff9b9b; margin-left: .15rem; }
    .field input {
      width: 100%;
      height: 44px;
      padding: 0 .9rem;
      border-radius: 8px;
      border: 1px solid rgba(212,176,106,.28);
      background: rgba(0,0,0,.45);
      color: #f4efdf;
      font-size: .92rem;
      outline: none;
    }
    .field input:focus {
      border-color: rgba(240,211,146,.7);
      box-shadow: 0 0 0 3px rgba(212,176,106,.15);
    }
    .field input:disabled {
      opacity: .75;
      color: #ffe9b0;
    }
    .field .eye {
      position: absolute;
      right: .45rem; bottom: .28rem;
      height: 38px; width: 42px;
      border: 0; background: transparent;
      color: rgba(232,226,212,.65);
      cursor: pointer;
      font-size: .78rem;
    }
    .ref-ok {
      margin-top: .28rem;
      font-size: .72rem;
      color: #7CFF7A;
      min-height: 1em;
    }
    .btn-main {
      width: 100%;
      height: 48px;
      margin-top: .35rem;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #2a1a05;
      background: linear-gradient(180deg, #f3dfa0 0%, #d4b06a 48%, #b8893a 100%);
      box-shadow: 0 2px 0 #8a6520, 0 8px 18px rgba(0,0,0,.35);
    }
    .btn-main:disabled { opacity: .6; cursor: default; }
    .err {
      min-height: 1.2em;
      margin: .55rem 0 0;
      text-align: center;
      font-size: .82rem;
      color: #ff9b9b;
      opacity: 0;
    }
    .err.show { opacity: 1; }
    .hint {
      margin-top: .75rem;
      text-align: center;
      font-size: .7rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .foot {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 3;
      padding: .55rem 1rem calc(.65rem + var(--safe-b));
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: .4rem 1rem;
      font-size: .66rem;
      color: rgba(232,226,212,.42);
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.7));
    }
    .langs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .45rem .75rem;
      font-size: .72rem;
      color: rgba(232,226,212,.7);
    }
    .langs label { display: flex; align-items: center; gap: .3rem; cursor: pointer; }
    .langs input { accent-color: var(--gold); }
  </style>
</head>
<body>
  <div class="scene">
    <div class="wrap">
      <div class="brand">
        <div class="brand-mark">森<br/>林</div>
        <h1>FOREST GROUP</h1>
        <p>LIVE CASINO · 加入牌桌</p>
      </div>

      <div class="panel">
        <div class="tabs" role="tablist">
          <button type="button" class="tab is-on" id="tabLogin" role="tab" aria-selected="true">登录</button>
          <button type="button" class="tab" id="tabReg" role="tab" aria-selected="false">注册</button>
        </div>

        <form class="pane is-on" id="loginPane" autocomplete="on">
          <div class="field">
            <label>登录账号</label>
            <input id="loginUser" name="username" type="text" placeholder="请输入账号" maxlength="24" />
          </div>
          <div class="field">
            <label>密码</label>
            <input id="loginPass" name="password" type="password" placeholder="请输入密码" maxlength="64" />
            <button class="eye" id="toggleLoginPass" type="button">显示</button>
          </div>
          <button class="btn-main" id="btnLogin" type="submit">登录并进入</button>
          <p class="err" id="loginErr"></p>
          <p class="hint">Forest Group · 公司根推荐码 FOREST</p>
        </form>

        <form class="pane" id="regPane" autocomplete="on">
          <div class="field">
            <label>登录账号<span class="req">*</span></label>
            <input id="regUser" type="text" placeholder="3-24 位字母/数字/下划线" maxlength="24" />
          </div>
          <div class="field">
            <label>密码<span class="req">*</span></label>
            <input id="regPass" type="password" placeholder="至少 8 位" maxlength="64" />
            <button class="eye" id="toggleRegPass" type="button">显示</button>
          </div>
          <div class="field">
            <label>游戏昵称<span class="req">*</span></label>
            <input id="regNick" type="text" placeholder="其他玩家看到的名字" maxlength="24" />
          </div>
          <div class="field">
            <label>WhatsApp<span class="req">*</span></label>
            <input id="regContact" type="tel" placeholder="WhatsApp 号码，如 +62812…" maxlength="20" />
          </div>
          <div class="field">
            <label>邮箱<span class="req">*</span></label>
            <input id="regEmail" type="email" placeholder="能联系到你的邮箱" maxlength="64" />
          </div>
          <div class="field">
            <label>推荐人推荐码<span class="req">* 必填</span></label>
            <input id="regRef" type="text" placeholder="必须填写推荐人推荐码" maxlength="32" />
            <div class="ref-ok" id="refOk"></div>
          </div>
          <button class="btn-main" id="btnReg" type="submit">注册并进入</button>
          <p class="err" id="regErr"></p>
          <p class="hint">无推荐码无法注册 · 关系创建后不可更改（直销制度）</p>
        </form>
      </div>

      <div class="langs" aria-label="语言">
        <label><input type="radio" name="lang" value="zh-Hans" checked /> 简体</label>
        <label><input type="radio" name="lang" value="zh-Hant" /> 繁體</label>
        <label><input type="radio" name="lang" value="en" /> EN</label>
        <label><input type="radio" name="lang" value="id" /> ID</label>
      </div>
    </div>

    <footer class="foot">
      <span>Forest Group</span>
      <span>V1.0.35</span>
      <span>推荐关系系统确认 · 不可更改</span>
    </footer>
  </div>

  <script>
  (function () {
    const V = 'v1.0.35';
    const NEXT = 'loading.html?v=1.5.1m4';
    const AUTH_API = 'api/sicbo-auth.php';
    const POSTER_V = '1.5.1m4';
    const MOBILE_POSTERS = [
      'assets/loading-posters/lucky-m.webp?v=' + POSTER_V,
      'assets/loading-posters/sanbao-m.webp?v=' + POSTER_V
    ];
    const MOBILE_POSTERS_JPG = [
      'assets/loading-posters/lucky-m.jpg?v=' + POSTER_V,
      'assets/loading-posters/sanbao-m.jpg?v=' + POSTER_V
    ];
    /* 登录页后台预热海报 + 预取大厅；不再阻塞跳转（以前慢就是卡在这） */
    (function warmPosters() {
      const urls = MOBILE_POSTERS.concat(MOBILE_POSTERS_JPG);
      urls.forEach((u) => {
        const img = new Image();
        img.decoding = 'async';
        img.src = u;
      });
      try {
        const pl = document.createElement('link');
        pl.rel = 'prefetch';
        pl.href = 'lobby.html?v=1.5.1';
        document.head.appendChild(pl);
      } catch (_) {}
    })();

    const tabLogin = document.getElementById('tabLogin');
    const tabReg = document.getElementById('tabReg');
    const loginPane = document.getElementById('loginPane');
    const regPane = document.getElementById('regPane');
    const loginErr = document.getElementById('loginErr');
    const regErr = document.getElementById('regErr');
    const refOk = document.getElementById('refOk');
    const regRef = document.getElementById('regRef');
    const regContact = document.getElementById('regContact');

    function showErr(el, msg) {
      el.textContent = msg || '';
      el.classList.toggle('show', !!msg);
    }

    function setMode(mode) {
      const reg = mode === 'reg';
      tabLogin.classList.toggle('is-on', !reg);
      tabReg.classList.toggle('is-on', reg);
      tabLogin.setAttribute('aria-selected', reg ? 'false' : 'true');
      tabReg.setAttribute('aria-selected', reg ? 'true' : 'false');
      loginPane.classList.toggle('is-on', !reg);
      regPane.classList.toggle('is-on', reg);
      showErr(loginErr, '');
      showErr(regErr, '');
    }

    tabLogin.addEventListener('click', () => setMode('login'));
    tabReg.addEventListener('click', () => setMode('reg'));

    /* ?ref=CODE 或 ?mode=reg 打开注册并预填推荐码 */
    try {
      const q = new URLSearchParams(location.search);
      const ref = (q.get('ref') || q.get('invite') || '').trim();
      if (ref) {
        setMode('reg');
        regRef.value = ref.toUpperCase();
        regRef.readOnly = true;
        checkRef(ref);
      } else if ((q.get('mode') || '') === 'reg') {
        setMode('reg');
      }
    } catch (_) {}

    try {
      const last = localStorage.getItem('fg_sicbo_last_user');
      if (last) document.getElementById('loginUser').value = last;
      if (sessionStorage.getItem('fg_sicbo_auth') === '1') {
        let u = (sessionStorage.getItem('fg_sicbo_user') || '').trim();
        if (!u && last) {
          u = last.trim();
          sessionStorage.setItem('fg_sicbo_user', u);
        }
        location.replace(NEXT);
        return;
      }
    } catch (_) {}

    function bindEye(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      btn.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? '隐藏' : '显示';
      });
    }
    bindEye('toggleLoginPass', 'loginPass');
    bindEye('toggleRegPass', 'regPass');

    let refTimer = 0;
    async function checkRef(code) {
      const c = (code || '').trim();
      refOk.textContent = '';
      if (!c) return false;
      try {
        const r = await fetch(AUTH_API + '?check_ref=' + encodeURIComponent(c), { cache: 'no-store' });
        const j = await r.json();
        if (j && j.ok && j.referrer) {
          refOk.textContent = '推荐人：' + (j.referrer.nick || j.referrer.user) + '（' + j.referrer.referralCode + '）';
          return true;
        }
        refOk.textContent = '';
        return false;
      } catch (_) {
        return false;
      }
    }
    regRef.addEventListener('input', () => {
      clearTimeout(refTimer);
      refOk.textContent = '';
      regRef.value = (regRef.value || '').toUpperCase();
      refTimer = setTimeout(() => checkRef(regRef.value), 350);
    });

    function enterAs(user, profile) {
      try {
        sessionStorage.setItem('fg_sicbo_auth', '1');
        sessionStorage.setItem('fg_sicbo_user', user);
        localStorage.setItem('fg_sicbo_last_user', user);
        if (profile) {
          sessionStorage.setItem('fg_sicbo_profile', JSON.stringify(profile));
        }
      } catch (_) {}
      location.href = NEXT;
    }

    document.getElementById('loginPane').addEventListener('submit', async (e) => {
      e.preventDefault();
      showErr(loginErr, '');
      const user = (document.getElementById('loginUser').value || '').trim();
      const password = (document.getElementById('loginPass').value || '').trim();
      if (!user || !password) {
        showErr(loginErr, '请输入账号和密码');
        return;
      }
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = '登录中…';
      try {
        const r = await fetch(AUTH_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', user, password }),
        });
        const j = await r.json();
        if (!j || !j.ok) {
          showErr(loginErr, (j && j.error) || '登录失败');
          return;
        }
        enterAs(j.user.user, j.user);
      } catch (_) {
        showErr(loginErr, '网络异常，请稍后重试');
      } finally {
        btn.disabled = false;
        btn.textContent = '登录并进入';
      }
    });

    document.getElementById('regPane').addEventListener('submit', async (e) => {
      e.preventDefault();
      showErr(regErr, '');
      const payload = {
        action: 'register',
        user: (document.getElementById('regUser').value || '').trim(),
        password: (document.getElementById('regPass').value || '').trim(),
        nick: (document.getElementById('regNick').value || '').trim(),
        contactType: 'whatsapp',
        contact: (regContact.value || '').trim(),
        email: (document.getElementById('regEmail').value || '').trim(),
        referrerCode: (document.getElementById('regRef').value || '').trim(),
      };
      if (!payload.referrerCode) {
        showErr(regErr, '必须填写推荐人推荐码');
        return;
      }
      const btn = document.getElementById('btnReg');
      btn.disabled = true;
      btn.textContent = '注册中…';
      try {
        const r = await fetch(AUTH_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const j = await r.json();
        if (!j || !j.ok) {
          showErr(regErr, (j && j.error) || '注册失败');
          return;
        }
        enterAs(j.user.user, j.user);
      } catch (_) {
        showErr(regErr, '网络异常，请稍后重试');
      } finally {
        btn.disabled = false;
        btn.textContent = '注册并进入';
      }
    });
  })();
  </script>
</body>
</html>
