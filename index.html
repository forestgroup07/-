<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Forest Group · 登入</title>
  <style>
    :root {
      --gold: #d4b06a;
      --gold-bright: #f0d392;
      --gold-deep: #a67c2e;
      --ink: #0a0c10;
      --panel: rgba(12, 14, 18, 0.78);
      --line: rgba(212, 176, 106, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: #e8e2d4;
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }
    /* 首页干净登入：无游戏台面、无骰宝图 */
    .scene {
      position: relative;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0c10;
    }

    .wrap {
      position: relative;
      z-index: 2;
      width: min(420px, 92vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      transform: translateY(-4vh);
    }

    .brand {
      text-align: center;
      animation: rise .7s ease both;
    }
    .brand-mark {
      width: 92px; height: 92px;
      margin: 0 auto .75rem;
      border-radius: 50%;
      display: grid; place-items: center;
      background:
        radial-gradient(circle at 35% 30%, #f7e2a8, #c9973a 55%, #7a5418 100%);
      box-shadow:
        0 0 0 2px rgba(255,220,150,.35),
        0 10px 28px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.45);
      color: #2a1a05;
      font-family: "Songti SC", "STSong", "Noto Serif TC", serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.05;
    }
    .brand h1 {
      font-size: clamp(1.35rem, 3.2vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.28em;
      color: var(--gold-bright);
      text-indent: 0.28em;
      text-shadow: 0 2px 16px rgba(0,0,0,.55);
    }
    .brand p {
      margin-top: .35rem;
      font-size: .78rem;
      letter-spacing: 0.22em;
      color: rgba(232,226,212,.65);
      text-indent: 0.22em;
    }

    .panel {
      width: 100%;
      padding: 1.55rem 1.35rem 1.35rem;
      border-radius: 10px;
      background: rgba(10, 12, 16, 0.92);
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      animation: rise .75s .08s ease both;
    }
    .field {
      position: relative;
      margin-bottom: .85rem;
    }
    .field input {
      width: 100%;
      height: 46px;
      padding: 0 2.4rem 0 2.55rem;
      border-radius: 6px;
      border: 1px solid rgba(212,176,106,.28);
      background: rgba(0,0,0,.45);
      color: #f4efdf;
      font-size: .98rem;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .field input:focus {
      border-color: rgba(240,211,146,.7);
      box-shadow: 0 0 0 3px rgba(212,176,106,.15);
    }
    .field .ico {
      position: absolute;
      left: .85rem; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      opacity: .75;
      pointer-events: none;
    }
    .field .eye {
      position: absolute;
      right: .7rem; top: 50%;
      transform: translateY(-50%);
      width: 34px; height: 34px;
      border: 0; background: transparent;
      color: rgba(232,226,212,.65);
      cursor: pointer;
      font-size: .95rem;
    }

    .btn-login {
      width: 100%;
      height: 48px;
      margin-top: .25rem;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      color: #2a1a05;
      background: linear-gradient(180deg, #f3dfa0 0%, #d4b06a 48%, #b8893a 100%);
      box-shadow: 0 2px 0 #8a6520, 0 8px 18px rgba(0,0,0,.35);
      transition: filter .15s ease, transform .1s ease;
    }
    .btn-login:hover { filter: brightness(1.05); }
    .btn-login:active { transform: translateY(1px); }
    .btn-login:disabled {
      opacity: .6;
      cursor: default;
    }

    .hint {
      margin-top: .85rem;
      text-align: center;
      font-size: .72rem;
      line-height: 1.55;
      color: rgba(232,226,212,.55);
    }
    .err {
      min-height: 1.2em;
      margin: .55rem 0 0;
      text-align: center;
      font-size: .82rem;
      color: #ff9b9b;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .err.show { opacity: 1; }

    .langs {
      position: absolute;
      right: max(1.2rem, 2vw);
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: .45rem;
      font-size: .72rem;
      color: rgba(232,226,212,.72);
    }
    .langs label {
      display: flex;
      align-items: center;
      gap: .4rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .langs input { accent-color: var(--gold); }

    .foot {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 3;
      padding: .65rem 1rem .8rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: .5rem 1rem;
      font-size: .68rem;
      color: rgba(232,226,212,.45);
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.55));
    }
    .foot a { color: rgba(240,211,146,.7); text-decoration: none; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      .langs {
        right: auto; left: 50%;
        top: auto; bottom: 3.2rem;
        transform: translateX(-50%);
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: .55rem .9rem;
        max-width: 92vw;
      }
      .brand-mark { width: 78px; height: 78px; font-size: 1.3rem; }
      .wrap { transform: none; margin-bottom: 3.5rem; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <aside class="langs" aria-label="语言">
      <label><input type="radio" name="lang" value="zh-Hant" checked /> 繁體中文</label>
      <label><input type="radio" name="lang" value="zh-Hans" /> 简体中文</label>
      <label><input type="radio" name="lang" value="en" /> 英文</label>
      <label><input type="radio" name="lang" value="id" /> 印尼文</label>
    </aside>

    <div class="wrap">
      <div class="brand">
        <div class="brand-mark">森<br/>林</div>
        <h1>FOREST GROUP</h1>
        <p>LIVE CASINO</p>
      </div>

      <form class="panel" id="loginForm" autocomplete="on">
        <div class="field">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.8-3.2 4.2-4.8 7-4.8s5.2 1.6 7 4.8"/></svg>
          <input id="user" name="username" type="text" placeholder="账号" value="asdg" maxlength="32" />
        </div>
        <div class="field">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input id="pass" name="password" type="password" placeholder="密码" value="123456" maxlength="32" />
          <button class="eye" id="togglePass" type="button" aria-label="显示密码">显示</button>
        </div>
        <button class="btn-login" id="btnLogin" type="submit">登入</button>
        <p class="err" id="err"></p>
        <p class="hint">本演示厅直播与软件仅供 Forest Group 内部演示使用</p>
      </form>
    </div>

    <footer class="foot">
      <span>在线客服 · Demo</span>
      <span>V1.0.9 · Chrome</span>
      <span>请启用 JavaScript 与 Cookies，建议使用 Chrome</span>
    </footer>
  </div>

  <script>
    (function () {
      const NEXT = 'loading.html?v=v1.0.11g';
      const form = document.getElementById('loginForm');
      const user = document.getElementById('user');
      const pass = document.getElementById('pass');
      const err = document.getElementById('err');
      const btn = document.getElementById('btnLogin');
      const toggle = document.getElementById('togglePass');

      // 已登入：进缓存页再进大厅
      try {
        if (sessionStorage.getItem('fg_sicbo_auth') === '1') {
          location.replace(NEXT);
          return;
        }
      } catch (_) { /* ignore */ }

      toggle.addEventListener('click', () => {
        const show = pass.type === 'password';
        pass.type = show ? 'text' : 'password';
        toggle.textContent = show ? '隐藏' : '显示';
      });

      function fail(msg) {
        err.textContent = msg;
        err.classList.add('show');
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        err.classList.remove('show');
        const u = (user.value || '').trim();
        const p = (pass.value || '').trim();
        if (!u || !p) {
          fail('请输入账号和密码');
          return;
        }
        btn.disabled = true;
        btn.textContent = '登入中';
        // 演示：任意非空账号密码即可进入骰宝
        try { sessionStorage.setItem('fg_sicbo_auth', '1'); } catch (_) { /* ignore */ }
        setTimeout(() => { location.href = NEXT; }, 280);
      });
    })();
  </script>
</body>
</html>
