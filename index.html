<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Forest Group · 骰宝</title>
  <link rel="preload" as="image" href="pc-full.webp?v=v1.0.5" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="chips/chip-10.webp?v=v1.0.5" type="image/webp" />
  <link rel="preload" as="image" href="chips/chip-20.webp?v=v1.0.5" type="image/webp" />
  <link rel="preload" as="image" href="chips/chip-50.webp?v=v1.0.5" type="image/webp" />
  <link rel="preload" as="image" href="chips/chip-100.webp?v=v1.0.5" type="image/webp" />
  <style>
    :root {
      --stage-w: 2188;
      --stage-h: 1393;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .frame {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      opacity: 0;
      transition: opacity .12s ease;
    }
    html.is-ready .frame { opacity: 1; }
    .stage {
      position: relative;
      width: min(100vw, calc(100vh * 2188 / 1393));
      height: min(100vh, calc(100vw * 1393 / 2188));
      overflow: hidden;
      background: #000;
    }
    .stage > picture,
    .stage .bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
      pointer-events: none;
    }
    .stage .bg { object-fit: fill; }

    /* 仅余额数字，无汇率条、无倒计时 */
    .bal {
      position: absolute;
      left: 50.091%; top: 80.043%;
      width: 4.068%; height: 3.015%;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      color: #c8d09b;
      font-family: Arial, Helvetica, sans-serif;
      font-size: calc(min(100vw, 100vh * 2188 / 1393) * 19 / 2188);
      line-height: 1; white-space: nowrap;
      text-shadow:
        -1px 0 0 rgba(6,18,12,.85), 1px 0 0 rgba(6,18,12,.85),
        0 -1px 0 rgba(6,18,12,.85), 0 1px 0 rgba(6,18,12,.85);
      z-index: 20;
    }

    /* 未点：底图平贴。一点：原位贴上 → 升起 + 光柱（1.0.2） */
    .chip-btn {
      position: absolute;
      z-index: 32;
      padding: 0; margin: 0; border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 50%;
      line-height: 0;
      overflow: visible;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .chip-btn:focus,
    .chip-btn:focus-visible { outline: none !important; }
    .chip-btn::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 112%;
      height: 32%;
      transform: translateX(-50%) scale(0.55);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at center,
          rgba(255,255,255,1) 0%,
          rgba(255,236,170,.95) 28%,
          rgba(255,255,255,.45) 52%,
          rgba(255,255,255,0) 72%);
      box-shadow:
        0 0 10px 3px rgba(255,255,255,.55),
        0 0 22px 6px rgba(255,230,140,.35);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      transition: opacity .16s ease, transform .2s cubic-bezier(.2,.8,.2,1);
    }
    .chip-btn::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 10%;
      width: 86%;
      height: 140%;
      transform: translateX(-50%) scaleY(0.35);
      transform-origin: 50% 100%;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 9%,
          rgba(255,255,255,.34) 9%,
          rgba(255,255,255,.34) 13%,
          transparent 13%,
          transparent 22%
        ),
        linear-gradient(
          to top,
          rgba(255,255,255,.55) 0%,
          rgba(255,245,200,.28) 38%,
          rgba(255,255,255,0) 78%
        );
      -webkit-mask-image: linear-gradient(to top, #000 0%, #000 35%, transparent 100%);
      mask-image: linear-gradient(to top, #000 0%, #000 35%, transparent 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      filter: blur(0.4px);
      transition: opacity .16s ease, transform .2s cubic-bezier(.2,.8,.2,1);
    }
    .chip-btn img {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
      display: block;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transform: translateY(0);
      transition: transform .2s cubic-bezier(.2,.8,.2,1);
      filter: none;
      will-change: transform;
    }
    .chip-btn.on { z-index: 99; }
    .chip-btn.on img {
      opacity: 1;
      filter:
        drop-shadow(0 8px 6px rgba(0,0,0,.45))
        drop-shadow(0 0 4px rgba(255,255,255,.5));
    }
    .chip-btn.on::before {
      opacity: 1;
      transform: translateX(-50%) scaleY(1);
    }
    .chip-btn.on::after {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    .chip-btn.on.up img {
      transform: translateY(-22%);
    }

    /* 10/20/50/100 同尺寸；50 在 20 与 100 正中 */
    #chip-a  { left: 69.104%; top: 84.32%; width: 4.022%; aspect-ratio: 1; }
    #chip-b  { left: 74.543%; top: 84.32%; width: 4.022%; aspect-ratio: 1; }
    #chip-c  { left: 79.982%; top: 84.32%; width: 4.022%; aspect-ratio: 1; }
    #chip-d  { left: 85.283%; top: 84.32%; width: 4.022%; aspect-ratio: 1; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="stage">
      <picture>
        <source srcset="pc-full.webp?v=v1.0.5" type="image/webp" />
        <img class="bg" id="bgImg" src="pc-full.jpg?v=v1.0.5" alt="骰宝" width="2188" height="1393" decoding="async" fetchpriority="high" draggable="false" />
      </picture>

      <div class="bal">2,000</div>

      <button class="chip-btn" id="chip-a" data-slot="0" type="button" aria-label="筹码10">
        <img src="chips/chip-10.webp?v=v1.0.5" alt="" decoding="async" draggable="false" />
      </button>
      <button class="chip-btn" id="chip-b" data-slot="1" type="button" aria-label="筹码20">
        <img src="chips/chip-20.webp?v=v1.0.5" alt="" decoding="async" draggable="false" />
      </button>
      <button class="chip-btn" id="chip-c" data-slot="2" type="button" aria-label="筹码50">
        <img src="chips/chip-50.webp?v=v1.0.5" alt="" decoding="async" draggable="false" />
      </button>
      <button class="chip-btn" id="chip-d" data-slot="3" type="button" aria-label="筹码100">
        <img src="chips/chip-100.webp?v=v1.0.5" alt="" decoding="async" draggable="false" />
      </button>
    </div>
  </div>
  <script>
    (async function () {
      const bg = document.getElementById('bgImg');
      try { if (bg.decode) await bg.decode(); } catch (_) {}
      document.documentElement.classList.add('is-ready');

      const chips = [...document.querySelectorAll('.chip-btn')];
      chips.forEach((btn) => {
        btn.addEventListener('click', () => {
          const turnOn = !btn.classList.contains('on');
          chips.forEach((b) => b.classList.remove('on', 'up'));
          if (!turnOn) return;
          btn.classList.add('on');
          requestAnimationFrame(() => {
            requestAnimationFrame(() => btn.classList.add('up'));
          });
        });
      });
    })();
  </script>
</body>
</html>
