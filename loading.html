<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Forest Group · 載入中</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .load {
      position: relative;
      width: 100%; height: 100%;
      background: #050505 url("assets/ref-loading.jpg?v=v1.0.30") center / cover no-repeat;
    }
    /* 手机：单张竖版整图，不再拼多图 */
    .load.is-m {
      background: #050505 url("assets/loading-poster-m.jpg?v=1.2.1m") center top / cover no-repeat;
    }
    .load::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.72) 100%);
      pointer-events: none;
    }
    .load.is-m::after {
      /* 海报自带底部文案区，只轻微压暗保证进度条可读 */
      background: linear-gradient(180deg, transparent 78%, rgba(0,0,0,.55) 100%);
    }
    .bar-wrap {
      position: absolute;
      left: 50%;
      bottom: 7%;
      transform: translateX(-50%);
      z-index: 2;
      width: min(640px, 86vw);
      text-align: center;
    }
    .load.is-m .bar-wrap {
      bottom: 3.2%;
      width: min(420px, 88vw);
    }
    .bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(212,176,106,.25);
    }
    .load.is-m .bar {
      height: 4px;
      background: rgba(255,255,255,.18);
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #c9973a, #f0d392, #ffe9a8);
      transition: width .05s linear;
    }
    .txt {
      margin-top: .55rem;
      color: #f0d392;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-size: clamp(12px, 1.6vw, 15px);
      letter-spacing: 0.12em;
      text-shadow: 0 2px 8px rgba(0,0,0,.7);
    }
    .load.is-m .txt {
      margin-top: .4rem;
      font-size: clamp(11px, 3.2vw, 13px);
      color: #f5e6c8;
    }
  </style>
</head>
<body>
  <div class="load" id="load">
    <div class="bar-wrap">
      <div class="bar"><i id="fill"></i></div>
      <div class="txt" id="txt">進入遊戲中... 0%</div>
    </div>
  </div>
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('fg_sicbo_auth') !== '1') {
          location.replace('index.html?v=v1.0.35');
          return;
        }
      } catch (_) { /* ignore */ }

      const loadEl = document.getElementById('load');
      const isMobile = (function () {
        try {
          if (window.matchMedia && window.matchMedia('(max-width: 900px)').matches) return true;
        } catch (_) {}
        const ua = navigator.userAgent || '';
        return /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      })();
      if (isMobile && loadEl) loadEl.classList.add('is-m');

      const fill = document.getElementById('fill');
      const txt = document.getElementById('txt');
      const LOBBY = 'lobby.html?v=v1.2.1b';
      const duration = 1600;
      const t0 = performance.now();

      function frame(now) {
        const p = Math.min(1, (now - t0) / duration);
        const pct = Math.round(p * 100);
        fill.style.width = pct + '%';
        txt.textContent = '進入遊戲中... ' + pct + '%';
        if (p < 1) requestAnimationFrame(frame);
        else location.replace(LOBBY);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
