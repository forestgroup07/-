<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Forest Group · 大廳</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #12151c;
      --gold: #d4b06a;
      --gold2: #f0d392;
      --line: rgba(212,176,106,.22);
      --muted: #9aa0ad;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: #ece7db;
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      overflow: hidden;
    }
    .app {
      display: grid;
      grid-template-rows: 52px 1fr;
      height: 100%;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 1rem;
      background: linear-gradient(180deg, #171a22, #10131a);
      border-bottom: 1px solid var(--line);
    }
    .top-left, .top-right {
      display: flex; align-items: center; gap: .85rem;
    }
    .user {
      display: flex; align-items: center; gap: .45rem;
      font-size: .9rem;
    }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(160deg, #f0d392, #a67c2e);
      display: grid; place-items: center;
      color: #2a1a05; font-weight: 800; font-size: .75rem;
    }
    .bal {
      display: flex; align-items: center; gap: .35rem;
      color: var(--gold2);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .chip-ico {
      width: 18px; height: 18px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffe9a8, #c9973a 70%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
    }
    .limit {
      font-size: .78rem;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: .2rem .45rem;
    }
    .ref-code {
      font-size: .72rem;
      color: var(--gold2);
      border: 1px solid rgba(212,176,106,.35);
      border-radius: 4px;
      padding: .2rem .5rem;
      letter-spacing: .04em;
      white-space: nowrap;
      cursor: pointer;
    }
    .icon-btn {
      width: 30px; height: 30px;
      border: 0; border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: .95rem;
    }
    .icon-btn:hover { color: var(--gold2); background: rgba(255,255,255,.04); }

    .body {
      display: grid;
      grid-template-columns: 168px 1fr;
      min-height: 0;
    }
    .side {
      background: #0e1117;
      border-right: 1px solid var(--line);
      padding: .55rem 0;
      overflow: auto;
    }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .55rem;
      padding: .7rem .9rem;
      border: 0;
      background: transparent;
      color: #c9c4b8;
      font-size: .86rem;
      text-align: left;
      cursor: pointer;
      position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,.04); color: #fff; }
    .nav-item.active {
      color: #fff;
      background: linear-gradient(90deg, rgba(212,176,106,.22), transparent);
    }
    .nav-item.active::before {
      content: "";
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--gold);
    }
    .nav-item .tag {
      margin-left: auto;
      font-size: .62rem;
      font-weight: 800;
      color: #fff;
      background: #d23b3b;
      border-radius: 3px;
      padding: .08rem .28rem;
    }
    .nav-ico { width: 1.1em; opacity: .9; }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(180,140,60,.08), transparent 55%),
        #0b0d12;
    }
    .recent {
      display: flex;
      gap: .55rem;
      padding: .7rem 1rem .35rem;
      overflow-x: auto;
    }
    .recent .pill {
      flex: 0 0 auto;
      min-width: 72px;
      padding: .45rem .55rem;
      border-radius: 8px;
      background: #151923;
      border: 1px solid var(--line);
      font-size: .72rem;
      color: var(--muted);
      text-align: center;
    }
    .recent .pill b {
      display: block;
      color: var(--gold2);
      font-size: .78rem;
      margin-bottom: .15rem;
    }

    .grid {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: .6rem 1rem 1.2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: .85rem;
      align-content: start;
    }
    .card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #151923;
      border: 1px solid var(--line);
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
      text-align: left;
      color: inherit;
      font: inherit;
      padding: 0;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(240,211,146,.45);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
    }
    .card.featured {
      border-color: rgba(240,211,146,.55);
      box-shadow: 0 0 0 1px rgba(212,176,106,.2), 0 12px 28px rgba(0,0,0,.4);
    }
    .card .thumb {
      height: 118px;
      background:
        linear-gradient(180deg, transparent 40%, rgba(0,0,0,.75)),
        url("assets/lobby-thumb.webp?v=v1.0.30") center / cover no-repeat;
    }
    .card.featured .thumb {
      background:
        linear-gradient(180deg, transparent 35%, rgba(0,0,0,.8)),
        url("assets/lobby-thumb.webp?v=v1.0.30") center 30% / cover no-repeat;
    }
    /* 骰宝卡：同轮盘构图；预览=当前线上游戏整屏实拍（非底图母版） */
    .card.sicbo .thumb {
      background:
        linear-gradient(180deg, transparent 35%, rgba(0,0,0,.8)),
        url("assets/lobby-sicbo-screen.jpg?v=1.5.2") center 12% / cover no-repeat;
    }
    .card.roulette .thumb {
      background:
        linear-gradient(180deg, transparent 35%, rgba(0,0,0,.8)),
        url("assets/roulette/pc-full-ref.jpg?v=60") center 20% / cover no-repeat;
    }
    .card .meta {
      padding: .65rem .75rem .75rem;
    }
    .card .name {
      font-size: .92rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .card .sub {
      margin-top: .25rem;
      font-size: .72rem;
      color: var(--muted);
    }
    .hint-bar {
      padding: .35rem 1rem .7rem;
      font-size: .78rem;
      color: var(--muted);
    }
    .hint-bar em {
      color: var(--gold2);
      font-style: normal;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .body { grid-template-columns: 118px 1fr; }
      .nav-item { padding: .65rem .55rem; font-size: .78rem; }
      .card .thumb { height: 96px; }
    }
    /* 手机进桌：同页 iframe，保留点击手势才能自动出声；也避免过渡页二次跳转变慢 */
    #fgEmbedShell {
      position: fixed; inset: 0; z-index: 99999;
      display: none; background: #000;
    }
    #fgEmbedShell.show { display: block; }
    #fgEmbedShell iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: #000;
    }
    #fgEmbedClose {
      position: absolute; top: max(8px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left));
      z-index: 2; width: 36px; height: 36px; border: 0; border-radius: 50%;
      background: rgba(0,0,0,.55); color: #f0d392; font-size: 22px; line-height: 36px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-left">
        <div class="user"><span class="avatar" id="lobbyAvatar">F</span><span id="lobbyUser">forest</span></div>
        <div class="bal"><span class="chip-ico"></span><span id="lobbyBal">2,000.00</span></div>
        <div class="ref-code" id="lobbyRef" title="我的推荐码">推荐码 —</div>
        <div class="limit">10 - 5,000</div>
      </div>
      <div class="top-right">
        <button class="icon-btn" type="button" title="客服">客服</button>
        <button class="icon-btn" type="button" title="声音" id="volBtn">声音</button>
        <button class="icon-btn" type="button" title="离开" id="logoutBtn">离开</button>
      </div>
    </header>

    <div class="body">
      <nav class="side" aria-label="游戏分类">
        <button class="nav-item active" type="button" data-cat="hot">熱門遊戲</button>
        <button class="nav-item" type="button" data-cat="all">所有遊戲</button>
        <button class="nav-item" type="button" data-cat="baccarat">所有百家樂</button>
        <button class="nav-item" type="button" data-cat="sexy">性感廳</button>
        <button class="nav-item" type="button" data-cat="wheel">幸運輪 <span class="tag">NEW</span></button>
        <button class="nav-item" type="button" data-cat="sicbo" id="navSicbo">骰寶</button>
        <button class="nav-item" type="button" data-cat="color">色碟</button>
        <button class="nav-item" type="button" data-cat="paigow">推筒子</button>
        <button class="nav-item" type="button" data-cat="other">其他遊戲</button>
      </nav>

      <main class="main">
        <div class="recent" aria-label="最近游玩">
          <div class="pill"><b>S601</b>骰寶</div>
          <div class="pill"><b>B601</b>百家樂</div>
          <div class="pill"><b>R501</b>輪盤</div>
        </div>
        <p class="hint-bar">點左側 <em>骰寶</em>，或點下方骰寶桌，進入遊戲</p>
        <div class="grid" id="grid"></div>
      </main>
    </div>
  </div>

  <script>
    (function () {
      const GAME_PC = 'game.html?v=1.5.18';
      const GAME_M = 'game-m.html?v=1.5.18';
      const ROULETTE_PC = 'roulette.html?v=1.2.16';
      const ROULETTE_M = 'roulette-m.html?v=1.3.12';
      const ROULETTE_M_BOOT = 'roulette-m-boot.html?v=1.3.12';
      function isMobileClient() {
        try {
          if (/(Android|iPhone|iPod|iPad|Mobile|webOS|BlackBerry)/i.test(navigator.userAgent || '')) return true;
          if (window.matchMedia && window.matchMedia('(max-width: 820px)').matches) return true;
        } catch (_) {}
        return false;
      }
      const GAME = isMobileClient() ? GAME_M : GAME_PC;
      /* 手机轮盘：大厅 iframe 直进（不再走过渡页，避免又慢又丢声音手势） */
      const ROULETTE = isMobileClient() ? ROULETTE_M : ROULETTE_PC;
      const SHELL_V = '1.3.9f';
      /* 父页播控：解锁禁播滚球长片；欢迎在点击手势内播，避免进桌无欢迎 */
      const ShellSfx = {
        els: Object.create(null),
        src: {
          welcome: 'audio/welcome-roulette.mp3?v=' + SHELL_V,
          welcomeSicbo: 'audio/welcome.mp3?v=1.5.15',
          startBet: 'audio/start-bet.mp3?v=' + SHELL_V,
          roundOpen: 'audio/round-open-bet.mp3?v=' + SHELL_V,
          stopBet: 'audio/stop-bet.mp3?v=' + SHELL_V,
          betOk: 'audio/bet-ok.mp3?v=1.5.15',
          tick: 'audio/tick.mp3?v=' + SHELL_V,
          bombTick: 'audio/bomb-tick.mp3?v=' + SHELL_V,
          keyClick: 'audio/key-click.mp3?v=' + SHELL_V,
          ballRoll: 'audio/roulette-ball-roll.mp3?v=' + SHELL_V,
          fret0: 'audio/roulette-fret-click-0.mp3?v=' + SHELL_V,
          fret1: 'audio/roulette-fret-click-1.mp3?v=' + SHELL_V,
          fret2: 'audio/roulette-fret-click-2.mp3?v=' + SHELL_V,
        },
        defaultVol: {
          tick: 0.52,
          bombTick: 0.62,
          keyClick: 0.7,
          ballRoll: 1,
          fret0: 0.9,
          fret1: 0.9,
          fret2: 0.9,
          betOk: 1,
        },
        voiceKeys: { welcome: 1, welcomeSicbo: 1, startBet: 1, roundOpen: 1, stopBet: 1 },
        /* 解锁静音试播：禁止 ballRoll/fret（长片会在开局漏出滚球声） */
        unlockPlayKeys: {
          welcome: 1, welcomeSicbo: 1, startBet: 1, roundOpen: 1, stopBet: 1,
          tick: 1, bombTick: 1, keyClick: 1,
        },
        ctx: null,
        live: Object.create(null),
        primed: false,
        heavyScheduled: false,
        embedWelcomeOk: null,
        embedWelcomeP: null,
        embedKind: null, /* 'roulette' | 'sicbo' */
        sicboReady: false,
        isSicboMuted() {
          try { return localStorage.getItem('fg_sicbo_m_sound_mute') === '1'; } catch (_) { return false; }
        },
        ensureEl(key) {
          if (this.els[key]) return this.els[key];
          const src = this.src[key];
          if (!src) return null;
          const a = new Audio(src);
          /* 欢迎首包用 metadata，避免进桌瞬间与键面图抢满带宽 */
          a.preload = (key === 'welcome' || key === 'welcomeSicbo') ? 'metadata' : 'auto';
          this.els[key] = a;
          return a;
        },
        reply(id, ok) {
          if (!id) return;
          try {
            const frame = document.getElementById('fgEmbedFrame');
            if (frame && frame.contentWindow) {
              frame.contentWindow.postMessage({ type: 'fg-sfx-done', id: id, ok: !!ok }, '*');
            }
          } catch (_) {}
        },
        replyWelcome(ok) {
          try {
            const frame = document.getElementById('fgEmbedFrame');
            if (frame && frame.contentWindow) {
              frame.contentWindow.postMessage({ type: 'fg-welcome', ok: !!ok }, '*');
            }
          } catch (_) {}
        },
        playWelcomeForEmbed() {
          if (this.embedWelcomeP) return this.embedWelcomeP;
          this.embedWelcomeP = this.playAwait('welcome').then((ok) => {
            this.embedWelcomeOk = !!ok;
            this.replyWelcome(!!ok);
            return !!ok;
          });
          return this.embedWelcomeP;
        },
        /* 手机骰宝：桌面就绪后再播；播前必查喇叭 */
        playWelcomeForSicboEmbed() {
          if (this.isSicboMuted()) {
            this.embedWelcomeOk = true;
            this.replyWelcome(true);
            return Promise.resolve(true);
          }
          if (this.embedWelcomeP) return this.embedWelcomeP;
          this.embedWelcomeP = this.playAwait('welcomeSicbo').then(async (ok) => {
            if (this.isSicboMuted()) {
              this.stopVoice();
              this.embedWelcomeOk = true;
              this.replyWelcome(true);
              return true;
            }
            this.embedWelcomeOk = !!ok;
            this.replyWelcome(!!ok);
            if (ok && !this.isSicboMuted()) {
              try { await this.playAwait('startBet'); } catch (_) {}
            }
            return !!ok;
          });
          return this.embedWelcomeP;
        },
        /* 手势内只解锁，不出声；等子页 fg-sicbo-ready 再播 */
        primeSicboGesture() {
          this.primeLight();
          ['welcomeSicbo', 'startBet', 'tick', 'bombTick', 'stopBet', 'betOk'].forEach((k) => {
            const el = this.ensureEl(k);
            if (!el || this.isSicboMuted()) return;
            try {
              el.muted = true;
              el.volume = 0;
              const p = el.play();
              const reset = () => {
                try { el.pause(); el.currentTime = 0; el.muted = false; el.volume = 1; } catch (_) {}
              };
              if (p && p.then) p.then(reset).catch(reset);
              else reset();
            } catch (_) {}
          });
        },
        playSicboWelcomeWhenReady() {
          if (this.embedKind !== 'sicbo') return;
          if (!this.sicboReady) return;
          if (this.embedWelcomeOk != null || this.embedWelcomeP) {
            if (this.embedWelcomeOk != null) this.replyWelcome(this.embedWelcomeOk);
            return;
          }
          void this.playWelcomeForSicboEmbed();
        },
        resetEmbedWelcome() {
          this.embedWelcomeOk = null;
          this.embedWelcomeP = null;
          this.sicboReady = false;
          this.heavyScheduled = false;
        },
        /* 进桌瞬时：只解锁 AudioContext + 欢迎，不预拉全套音效（恢复首屏速度） */
        primeLight() {
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
              this.ctx = this.ctx || new AC();
              if (this.ctx.state === 'suspended') this.ctx.resume();
              const buf = this.ctx.createBuffer(1, 1, 22050);
              const src = this.ctx.createBufferSource();
              src.buffer = buf;
              src.connect(this.ctx.destination);
              src.start(0);
            }
          } catch (_) {}
          this.ensureEl(this.embedKind === 'sicbo' ? 'welcomeSicbo' : 'welcome');
        },
        /* 桌内已出来后再预热其余音效；ballRoll 只 load 不 play */
        primeHeavy() {
          Object.keys(this.src).forEach((k) => {
            /* 进轮盘时不要预拉骰宝片，抢键面带宽 */
            if (this.embedKind === 'roulette' && (k === 'welcomeSicbo' || k === 'betOk')) return;
            if (this.embedKind === 'sicbo' && (k === 'welcome' || k === 'ballRoll' || k === 'fret0' || k === 'fret1' || k === 'fret2')) return;
            this.ensureEl(k);
          });
          if (this.embedKind !== 'sicbo') {
            ['ballRoll', 'fret0', 'fret1', 'fret2'].forEach((k) => {
              const el = this.els[k];
              if (!el) return;
              try { el.preload = 'auto'; el.load(); } catch (_) {}
            });
          }
          if (this.primed) return;
          this.primed = true;
          Object.keys(this.unlockPlayKeys).forEach((k) => {
            if (k === 'welcome' || k === 'welcomeSicbo') return;
            if (this.embedKind === 'roulette' && (k === 'welcomeSicbo')) return;
            if (this.embedKind === 'sicbo' && (k === 'welcome')) return;
            const el = this.els[k];
            if (!el) return;
            try {
              el.muted = true;
              el.volume = 0;
              const p = el.play();
              const reset = () => {
                try { el.pause(); el.currentTime = 0; el.muted = false; el.volume = 1; } catch (_) {}
              };
              if (p && p.then) p.then(reset).catch(reset);
              else reset();
            } catch (_) {}
          });
        },
        scheduleHeavy(delayMs) {
          if (this.heavyScheduled) return;
          this.heavyScheduled = true;
          const run = () => { try { this.primeHeavy(); } catch (_) {} };
          const wait = delayMs == null ? 1800 : delayMs;
          try {
            if (typeof requestIdleCallback === 'function' && wait <= 2000) {
              requestIdleCallback(run, { timeout: Math.max(2800, wait + 500) });
              return;
            }
          } catch (_) {}
          setTimeout(run, wait);
        },
        prime() {
          this.primeLight();
          /* 轮盘进桌：禁止预拉全套音效（修骰宝时加的 scheduleHeavy 会与键面抢带宽） */
          if (this.embedKind === 'roulette') return;
          this.scheduleHeavy(this.embedKind === 'sicbo' ? 2200 : 1800);
        },
        stopVoice() {
          Object.keys(this.voiceKeys).forEach((k) => {
            const el = this.els[k];
            if (!el) return;
            try { el.pause(); el.currentTime = 0; el.onended = null; el.onerror = null; } catch (_) {}
          });
          if (this.live.enNum) {
            try { this.live.enNum.pause(); this.live.enNum.currentTime = 0; } catch (_) {}
            delete this.live.enNum;
          }
        },
        stop(key) {
          if (key === 'ballRoll') {
            const a = this.live.ballRoll || this.els.ballRoll;
            if (a) try { a.pause(); a.currentTime = 0; } catch (_) {}
            delete this.live.ballRoll;
            return;
          }
          const a = this.live[key] || this.els[key];
          if (!a) return;
          try { a.pause(); a.currentTime = 0; } catch (_) {}
          delete this.live[key];
        },
        /* 口播/报数：优先 ended；手机常不触发 ended → 按片长收尾，避免卡死倒计时 */
        voiceEstMs: { welcome: 2000, welcomeSicbo: 2000, startBet: 1100, roundOpen: 1100, stopBet: 1100, enNum: 1600 },
        playAwait(key, vol) {
          return new Promise((resolve) => {
            if (!key || key === 'youWin' || key === 'beep') {
              resolve(false);
              return;
            }
            if (this.embedKind === 'sicbo' && this.isSicboMuted()) {
              resolve(false);
              return;
            }
            let done = false;
            const finish = (ok) => {
              if (done) return;
              done = true;
              resolve(!!ok);
            };
            const armDuration = (el, fallbackMs) => {
              let ms = fallbackMs;
              try {
                if (el && el.duration && isFinite(el.duration) && el.duration > 0) {
                  ms = Math.round(el.duration * 1000) + 120;
                }
              } catch (_) {}
              setTimeout(() => finish(true), Math.min(8000, Math.max(400, ms)));
            };
            try {
              if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
              if (key === 'enNum') {
                this.stopVoice();
                const n = Math.max(0, Math.min(36, Number(vol) || 0));
                const a = new Audio('audio/roulette-en/n' + n + '.mp3?v=' + SHELL_V);
                a.volume = 1;
                this.live.enNum = a;
                a.onended = () => finish(true);
                a.onerror = () => finish(false);
                const p = a.play();
                if (p && p.then) p.then(() => armDuration(a, this.voiceEstMs.enNum)).catch(() => finish(false));
                else armDuration(a, this.voiceEstMs.enNum);
                return;
              }
              if (!this.voiceKeys[key] || !this.src[key]) {
                this.play(key, vol);
                finish(true);
                return;
              }
              this.stopVoice();
              const el = this.ensureEl(key);
              if (!el) { finish(false); return; }
              el.muted = false;
              el.volume = 1;
              try { el.onended = null; el.onerror = null; } catch (_) {}
              el.pause();
              el.currentTime = 0;
              el.onended = () => finish(true);
              el.onerror = () => finish(false);
              const est = this.voiceEstMs[key] || 1200;
              const p = el.play();
              if (p && p.then) p.then(() => armDuration(el, est)).catch(() => finish(false));
              else armDuration(el, est);
            } catch (_) {
              finish(false);
            }
          });
        },
        play(key, vol) {
          if (!key) return;
          if (key === 'youWin' || key === 'beep') return;
          /* 骰宝桌内：喇叭关着一律不出声 */
          if (this.embedKind === 'sicbo' && this.isSicboMuted()) return;
          if (key === 'enNum') {
            void this.playAwait('enNum', vol);
            return;
          }
          const src = this.src[key];
          if (!src) return;
          try {
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            const dv = this.defaultVol[key];
            const v = vol != null ? vol : (dv != null ? dv : 1);
            if (this.voiceKeys[key]) {
              this.stopVoice();
              const el = this.ensureEl(key);
              if (!el) return;
              el.muted = false;
              el.volume = 1;
              el.pause();
              el.currentTime = 0;
              const p = el.play();
              if (p && p.catch) p.catch(() => {});
              return;
            }
            if (key === 'ballRoll') {
              this.stop('ballRoll');
              const el = this.ensureEl(key);
              if (!el) return;
              el.muted = false;
              el.volume = v;
              el.pause();
              el.currentTime = 0;
              this.live.ballRoll = el;
              const p = el.play();
              if (p && p.catch) p.catch(() => {});
              return;
            }
            if (key === 'tick' || key === 'bombTick' || key === 'keyClick') {
              const el = this.ensureEl(key);
              if (!el) return;
              el.muted = false;
              el.pause();
              el.currentTime = 0;
              el.volume = v;
              const p = el.play();
              if (p && p.catch) p.catch(() => {});
              return;
            }
            const base = this.ensureEl(key);
            if (!base) return;
            const a = base.cloneNode();
            a.muted = false;
            a.volume = v;
            const p = a.play();
            if (p && p.catch) p.catch(() => {});
          } catch (_) {}
        },
      };
      function ensureEmbedShell() {
        let shell = document.getElementById('fgEmbedShell');
        if (shell) return shell;
        shell = document.createElement('div');
        shell.id = 'fgEmbedShell';
        shell.innerHTML = '<iframe id="fgEmbedFrame" allow="autoplay *; fullscreen *" title="roulette"></iframe>'
          + '<button type="button" id="fgEmbedClose" aria-label="返回大厅">×</button>';
        document.body.appendChild(shell);
        document.getElementById('fgEmbedClose').addEventListener('click', () => closeEmbedShell());
        window.addEventListener('message', (ev) => {
          const d = ev && ev.data;
          if (!d || typeof d !== 'object') return;
          if (d.type === 'fg-sfx-prime') ShellSfx.prime();
          if (d.type === 'fg-sicbo-ready') {
            ShellSfx.sicboReady = true;
            ShellSfx.playSicboWelcomeWhenReady();
          }
          if (d.type === 'fg-want-welcome') {
            if (ShellSfx.embedWelcomeOk != null) ShellSfx.replyWelcome(ShellSfx.embedWelcomeOk);
            else if (ShellSfx.embedKind === 'sicbo') ShellSfx.playSicboWelcomeWhenReady();
            else void ShellSfx.playWelcomeForEmbed();
          }
          if (d.type === 'fg-sfx') {
            if ((d.key === 'welcome' || d.key === 'welcomeSicbo') && d.id) {
              if (ShellSfx.embedKind === 'sicbo') {
                if (ShellSfx.embedWelcomeOk != null) ShellSfx.reply(d.id, ShellSfx.embedWelcomeOk);
                else ShellSfx.playSicboWelcomeWhenReady();
              } else {
                ShellSfx.playWelcomeForEmbed().then((ok) => ShellSfx.reply(d.id, ok));
              }
            } else if (d.id) {
              ShellSfx.playAwait(d.key, d.vol).then((ok) => ShellSfx.reply(d.id, ok));
            } else {
              ShellSfx.play(d.key, d.vol);
            }
          }
          if (d.type === 'fg-sfx-stop') ShellSfx.stop(d.key);
          if (d.type === 'fg-embed-close') closeEmbedShell();
        });
        return shell;
      }
      function closeEmbedShell() {
        try { ShellSfx.stop('ballRoll'); ShellSfx.stopVoice(); } catch (_) {}
        ShellSfx.resetEmbedWelcome();
        const shell = document.getElementById('fgEmbedShell');
        const frame = document.getElementById('fgEmbedFrame');
        if (shell) shell.classList.remove('show');
        if (frame) frame.src = 'about:blank';
      }
      function openEmbedShell(url) {
        ShellSfx.stop('ballRoll');
        ShellSfx.resetEmbedWelcome();
        ShellSfx.embedKind = /game-m\.html/.test(url) ? 'sicbo' : /roulette-m\.html/.test(url) ? 'roulette' : null;
        const shell = ensureEmbedShell();
        const frame = document.getElementById('fgEmbedFrame');
        /* 先挂 iframe 出画面，避免父页全套音效与键面图抢 4G 带宽 */
        const join = url.indexOf('?') >= 0 ? '&' : '?';
        frame.src = url + join + 'embed=1';
        shell.classList.add('show');
        if (ShellSfx.embedKind === 'roulette') {
          /* 只解锁+欢迎；音效按需 ensureEl，绝不 scheduleHeavy 抢键面 */
          ShellSfx.primeLight();
          void ShellSfx.playWelcomeForEmbed();
        } else if (ShellSfx.embedKind === 'sicbo') {
          /* 手势内只解锁；等子页画面就绪再播，且播前查喇叭 */
          ShellSfx.primeSicboGesture();
          ShellSfx.scheduleHeavy(2200);
        } else {
          ShellSfx.primeLight();
          ShellSfx.scheduleHeavy(1800);
        }
      }
      const START_BAL = 2000;
      const ACCOUNT_API = 'api/fg-wallet-account.php';
      function currentUser() {
        try {
          const u = (sessionStorage.getItem('fg_sicbo_user')
            || localStorage.getItem('fg_sicbo_last_user')
            || 'asdg').trim();
          return u || 'asdg';
        } catch (_) {
          return 'asdg';
        }
      }
      function balKeyFor(user) {
        return 'fg_sicbo_bal::' + String(user || 'asdg').trim().toLowerCase();
      }
      function loadBal(user) {
        try {
          let raw = localStorage.getItem(balKeyFor(user));
          if (raw == null || raw === '') {
            raw = localStorage.getItem('fg_sicbo_balance');
          }
          if (raw == null || raw === '') return START_BAL;
          const n = Math.round(Number(raw));
          return Number.isFinite(n) && n >= 0 ? n : START_BAL;
        } catch (_) {
          return START_BAL;
        }
      }
      function saveBalLocal(user, n) {
        const v = String(Math.max(0, Math.round(Number(n) || 0)));
        try {
          localStorage.setItem(balKeyFor(user), v);
          localStorage.setItem('fg_sicbo_balance', v);
          localStorage.setItem('fg_sicbo_last_user', user);
        } catch (_) {}
      }
      async function syncBalFromServer(user) {
        try {
          const r = await fetch(ACCOUNT_API + '?user=' + encodeURIComponent(user), { cache: 'no-store' });
          const j = await r.json();
          if (!j || !j.ok || !j.data) return null;
          if (j.data.balance == null) return null;
          const n = Math.max(0, Math.round(Number(j.data.balance)) || 0);
          saveBalLocal(user, n);
          return n;
        } catch (_) {
          return null;
        }
      }
      try {
        if (sessionStorage.getItem('fg_sicbo_auth') !== '1') {
          location.replace('index.html?v=v1.0.35');
          return;
        }
        let u = (sessionStorage.getItem('fg_sicbo_user') || '').trim();
        if (!u) {
          u = currentUser();
          sessionStorage.setItem('fg_sicbo_user', u);
          localStorage.setItem('fg_sicbo_last_user', u);
        }
      } catch (_) { /* ignore */ }

      function paintUserBar() {
        const u = currentUser();
        const nameEl = document.getElementById('lobbyUser');
        const av = document.getElementById('lobbyAvatar');
        const balEl = document.getElementById('lobbyBal');
        const refEl = document.getElementById('lobbyRef');
        if (nameEl) nameEl.textContent = u;
        if (av) av.textContent = (u.charAt(0) || 'F').toUpperCase();
        if (balEl) {
          balEl.textContent = loadBal(u).toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });
        }
        let code = String(u || '').toUpperCase();
        try {
          const raw = sessionStorage.getItem('fg_sicbo_profile');
          if (raw) {
            const p = JSON.parse(raw);
            if (p && p.referralCode) code = String(p.referralCode).toUpperCase();
            if (p && p.nick && nameEl) nameEl.textContent = p.nick;
          }
        } catch (_) {}
        if (refEl) {
          refEl.textContent = '推荐码 ' + (code || '—');
          refEl.onclick = () => {
            const link = location.origin + '/index.html?v=v1.0.35&ref=' + encodeURIComponent(code);
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(link).then(() => alert('已复制邀请链接')).catch(() => prompt('邀请链接', link));
            } else {
              prompt('邀请链接', link);
            }
          };
        }
      }
      paintUserBar();
      (async () => {
        const u = currentUser();
        const n = await syncBalFromServer(u);
        if (n != null) paintUserBar();
      })();
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        paintUserBar();
        syncBalFromServer(currentUser()).then((n) => {
          if (n != null) paintUserBar();
        });
      });

      /* 只删掉重复骰宝厅 S602；其余分类/演示桌文案保留 */
      const tables = [
        { id: 'S601', name: '骰寶 S601', kind: 'sicbo', featured: true, sec: 22 },
        { id: 'R501', name: '輪盤 R501', kind: 'roulette', featured: true, sec: 20 },
        { id: 'F701', name: '魚蝦蟹 F701', kind: 'other', sec: 15 },
        { id: 'BB701', name: '牛牛 BB701', kind: 'other', sec: 16 },
        { id: 'W701', name: '三公 W701', kind: 'other', sec: 12 },
        { id: 'D801', name: '龍虎 D801', kind: 'other', sec: 14 },
        { id: 'B601', name: '百家樂 B601', kind: 'baccarat', sec: 20 },
        { id: 'B501', name: '百家樂 B501', kind: 'baccarat', sec: 11 },
      ];

      const grid = document.getElementById('grid');
      let cat = 'hot';

      function enterSicbo() {
        /* 手机：iframe 进桌 + 父页手势播欢迎（对齐轮盘，避免整页跳转首段全哑） */
        if (isMobileClient()) {
          openEmbedShell(GAME_M);
          return;
        }
        location.href = GAME;
      }
      function enterRoulette() {
        if (isMobileClient()) {
          openEmbedShell(ROULETTE_M);
          return;
        }
        location.href = ROULETTE;
      }

      function paint() {
        const list = tables.filter((t) => {
          if (cat === 'hot') return t.featured || t.kind === 'sicbo' || t.kind === 'roulette';
          if (cat === 'all') return true;
          if (cat === 'sicbo') return t.kind === 'sicbo';
          if (cat === 'baccarat') return t.kind === 'baccarat';
          if (cat === 'wheel') return t.kind === 'roulette';
          return t.kind === 'other' || t.kind === cat;
        });
        grid.innerHTML = '';
        list.forEach((t) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'card'
            + (t.featured ? ' featured' : '')
            + (t.kind === 'sicbo' ? ' sicbo' : '')
            + (t.kind === 'roulette' ? ' roulette' : '');
          const sub = t.kind === 'sicbo'
            ? '點擊進入骰寶桌'
            : (t.kind === 'roulette' ? '點擊進入輪盤桌' : '演示桌 · 暫未開放');
          btn.innerHTML =
            '<div class="thumb"></div>' +
            '<div class="meta"><div class="name">' + t.name + '</div>' +
            '<div class="sub">' + sub + '</div></div>';
          btn.addEventListener('click', () => {
            if (t.kind === 'sicbo') enterSicbo();
            else if (t.kind === 'roulette') enterRoulette();
            else alert('演示版请点击「骰寶」或「輪盤」进入');
          });
          grid.appendChild(btn);
        });
      }

      document.querySelectorAll('.nav-item').forEach((el) => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach((n) => n.classList.remove('active'));
          el.classList.add('active');
          cat = el.dataset.cat;
          /* 左侧点分类只筛选列表；进桌点卡片 */
          paint();
        });
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        try {
          sessionStorage.removeItem('fg_sicbo_auth');
          sessionStorage.removeItem('fg_sicbo_user');
        } catch (_) {}
        try { sessionStorage.removeItem('fg_sicbo_profile'); } catch (_) {}
        location.href = 'index.html?v=v1.0.35';
      });

      paint();
    })();
  </script>
</body>
