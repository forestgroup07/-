<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Forest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="manifest" href="assets/fg-lobby.webmanifest?v=1.0.0" />
  <link rel="apple-touch-icon" href="assets/mahjong/pwa/apple-touch-icon-180.png" />
  <title>Forest Group · 大廳</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #12151c;
      --gold: #d4b06a;
      --gold2: #f0d392;
      --line: rgba(212,176,106,.22);
      --muted: #9aa0ad;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: #ece7db;
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      overflow: hidden;
    }
    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      height: 100dvh;
      min-height: 0;
    }
    .top {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 0;
      background: linear-gradient(180deg, #171a22, #10131a);
      border-bottom: 1px solid var(--line);
    }
    .top-row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      min-height: 40px;
      padding: .32rem .55rem;
    }
    .top-row2 {
      display: flex;
      align-items: center;
      gap: .45rem;
      padding: .4rem .55rem .5rem;
      background: linear-gradient(180deg, rgba(212,176,106,.14), rgba(212,176,106,.05));
      border-top: 1px solid rgba(212,176,106,.28);
    }
    .top-left, .top-right {
      display: flex; align-items: center; gap: .45rem;
      min-width: 0;
    }
    .top-left {
      flex: 1;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .top-left::-webkit-scrollbar { display: none; }
    .user {
      display: flex; align-items: center; gap: .45rem;
      font-size: .9rem;
    }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(160deg, #f0d392, #a67c2e);
      display: grid; place-items: center;
      color: #2a1a05; font-weight: 800; font-size: .75rem;
    }
    .bal {
      display: flex; align-items: center; gap: .35rem;
      color: var(--gold2);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .chip-ico {
      width: 18px; height: 18px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffe9a8, #c9973a 70%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
    }
    .limit {
      font-size: .78rem;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: .2rem .45rem;
    }
    .ref-code {
      flex: 0 0 auto;
      font-size: .78rem;
      font-weight: 700;
      color: var(--gold2);
      border: 1px solid rgba(212,176,106,.45);
      border-radius: 6px;
      padding: .38rem .55rem;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .invite-btn {
      flex: 1;
      border: 0;
      border-radius: 999px;
      padding: .42rem .7rem;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .06em;
      color: #2a1a05;
      background: linear-gradient(180deg, #f3dfa0 0%, #d4b06a 48%, #b8893a 100%);
      box-shadow: 0 0 0 1px rgba(255, 220, 150, .45), 0 4px 14px rgba(212, 176, 106, .4);
      cursor: pointer;
      white-space: nowrap;
      animation: invitePulse 1.6s ease-in-out infinite;
    }
    .invite-btn:active { transform: scale(0.98); }
    .invite-btn.is-copied {
      animation: none;
      background: linear-gradient(180deg, #b8f5b0 0%, #6dce66 55%, #3a9e3a 100%);
      color: #0a0c10;
    }
    @keyframes invitePulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(255, 220, 150, .45), 0 4px 14px rgba(212, 176, 106, .4); }
      50% { box-shadow: 0 0 0 3px rgba(240, 211, 146, .55), 0 6px 18px rgba(240, 211, 146, .55); }
    }
    /* 推荐码下：加到主屏幕提示（闪 + 动画，点开步骤） */
    .top-row3 {
      padding: .28rem .55rem .4rem;
      background: rgba(8, 10, 14, .55);
      border-top: 1px solid rgba(212,176,106,.18);
    }
    .ahs-banner {
      width: 100%;
      border: 1px solid #ff2a2a;
      border-radius: 8px;
      padding: .42rem .55rem;
      background: linear-gradient(180deg, #ff3b3b 0%, #c41010 55%, #8e0000 100%);
      color: #fff;
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .02em;
      line-height: 1.35;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      text-shadow: 0 1px 0 rgba(0,0,0,.35);
      animation: ahsBannerFlash .7s ease-in-out infinite;
    }
    .ahs-banner:active { transform: scale(0.985); }
    @keyframes ahsBannerFlash {
      0%, 100% {
        opacity: 1;
        color: #fff;
        background: linear-gradient(180deg, #ff4d4d 0%, #e01212 55%, #a00000 100%);
        border-color: #ff6666;
        box-shadow: 0 0 0 1px rgba(255, 80, 80, .55), 0 0 16px rgba(255, 40, 40, .65);
        transform: scale(1);
      }
      50% {
        opacity: .35;
        color: #ffe0e0;
        background: linear-gradient(180deg, #ff7a7a 0%, #ff1a1a 50%, #b00000 100%);
        border-color: #ffd0d0;
        box-shadow: 0 0 0 3px rgba(255, 120, 120, .85), 0 0 22px rgba(255, 0, 0, .9);
        transform: scale(1.02);
      }
    }
    .icon-btn {
      width: 32px; height: 32px;
      border: 0; border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: .95rem;
      display: grid;
      place-items: center;
      line-height: 1;
    }
    .icon-btn:hover { color: var(--gold2); background: rgba(255,255,255,.04); }
    .icon-btn.icon-back {
      font-size: 1.15rem;
      color: #ffffff;
      filter: grayscale(1) brightness(1.35);
    }
    .icon-btn.icon-back:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, .1);
    }

    .body {
      display: grid;
      /* 手机竖屏优先：左侧再窄，中间多露牌桌 */
      grid-template-columns: 78px 1fr;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }
    .side {
      background: #0e1117;
      border-right: 1px solid var(--line);
      padding: .55rem 0;
      overflow: auto;
    }
    .nav-group { border-bottom: 1px solid rgba(255,255,255,.04); }
    .nav-parent {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .2rem;
      padding: .58rem .32rem;
      border: 0;
      background: transparent;
      color: #e8e2d4;
      font-size: .68rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      position: relative;
      letter-spacing: .02em;
      line-height: 1.25;
    }
    .nav-parent:hover { background: rgba(255,255,255,.04); color: #fff; }
    .nav-group.is-open > .nav-parent {
      color: #fff;
      background: linear-gradient(90deg, rgba(212,176,106,.22), transparent);
    }
    .nav-group.is-open > .nav-parent::before {
      content: "";
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--gold);
    }
    .nav-caret {
      font-size: .7rem;
      color: var(--gold2);
      transition: transform .18s ease;
    }
    .nav-group.is-open > .nav-parent .nav-caret { transform: rotate(90deg); }
    .nav-group.is-empty > .nav-parent .nav-caret { opacity: .35; }
    .nav-children {
      display: none;
      padding: 0 0 .35rem;
    }
    .nav-group.is-open > .nav-children { display: block; }
    .nav-child {
      width: 100%;
      display: block;
      padding: .36rem .28rem .36rem .42rem;
      border: 0;
      background: transparent;
      color: #a8a396;
      font-size: .62rem;
      text-align: left;
      cursor: pointer;
      line-height: 1.25;
    }
    .nav-child:hover { color: #fff; background: rgba(255,255,255,.03); }
    .nav-child.is-on {
      color: var(--gold2);
      background: rgba(212,176,106,.1);
    }

    .main {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(180,140,60,.08), transparent 55%),
        #0b0d12;
    }
    .recent,
    .hint-bar { display: none !important; }

    .grid {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      padding: .45rem .4rem 1.25rem;
      display: grid;
      /* 手机竖屏：一排两个完整方块，一屏至少看见两个 */
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .4rem;
      align-content: start;
    }
    .card {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: #151923;
      border: 1px solid var(--line);
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(240, 211, 146, .25);
      touch-action: manipulation;
      pointer-events: auto;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
      text-align: left;
      color: inherit;
      font: inherit;
      padding: 0;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 42vw;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(240,211,146,.45);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
    }
    .card.featured {
      border-color: rgba(240,211,146,.55);
      box-shadow: 0 0 0 1px rgba(212,176,106,.2), 0 12px 28px rgba(0,0,0,.4);
    }
    .card .thumb {
      flex: 1;
      min-height: 0;
      height: auto;
      background:
        linear-gradient(180deg, transparent 40%, rgba(0,0,0,.75)),
        url("assets/lobby-thumb.webp?v=v1.0.30") center / cover no-repeat;
    }
    .card.featured .thumb {
      background:
        linear-gradient(180deg, transparent 35%, rgba(0,0,0,.8)),
        url("assets/lobby-thumb.webp?v=v1.0.30") center 30% / cover no-repeat;
    }
    /* 打开网站加速：卡片用小缩图，禁止拉 580KB 电脑整图 */
    .card.sicbo .thumb {
      background:
        linear-gradient(180deg, transparent 35%, rgba(0,0,0,.8)),
        url("assets/lobby-sicbo-thumb.webp?v=1.4.5") center 12% / cover no-repeat;
    }
    .card.roulette .thumb {
      background:
        linear-gradient(180deg, transparent 35%, rgba(0,0,0,.8)),
        url("assets/lobby-roulette-thumb.webp?v=1.4.5") center 20% / cover no-repeat;
    }
    .card.baccarat .thumb {
      background:
        linear-gradient(180deg, transparent 35%, rgba(0,0,0,.8)),
        url("assets/lobby-baccarat-thumb.webp?v=1.1.1") center 40% / cover no-repeat;
    }
    .card.mahjong .thumb {
      background:
        linear-gradient(180deg, transparent 42%, rgba(0,0,0,.82)),
        url("assets/lobby-mahjong/hk.webp?v=1.0.1") center 28% / cover no-repeat;
    }
    /* 同类同封面、图上不写自编字：港/粤/川/另 各一张 */
    .card.mahjong.mj-hk .thumb,
    .card.mahjong.mj-hk2 .thumb,
    .card.mahjong.mj-hk3 .thumb {
      background-image:
        linear-gradient(180deg, transparent 42%, rgba(0,0,0,.82)),
        url("assets/lobby-mahjong/hk.webp?v=1.0.1");
    }
    .card.mahjong.mj-gd1 .thumb,
    .card.mahjong.mj-gd2 .thumb,
    .card.mahjong.mj-gd3 .thumb {
      background-image:
        linear-gradient(180deg, transparent 42%, rgba(0,0,0,.82)),
        url("assets/lobby-mahjong/gd.webp?v=1.0.1");
    }
    .card.mahjong.mj-sc1 .thumb,
    .card.mahjong.mj-sc2 .thumb,
    .card.mahjong.mj-sc3 .thumb {
      background-image:
        linear-gradient(180deg, transparent 42%, rgba(0,0,0,.82)),
        url("assets/lobby-mahjong/sc.webp?v=1.0.1");
    }
    .card.mahjong.mj-gb1 .thumb,
    .card.mahjong.mj-wind .thumb {
      background-image:
        linear-gradient(180deg, transparent 42%, rgba(0,0,0,.82)),
        url("assets/lobby-mahjong/other.webp?v=1.0.1");
    }
    .card .meta {
      flex: 0 0 auto;
      padding: .28rem .35rem .32rem;
      background: rgba(10, 12, 16, .92);
    }
    /* 麻将可进桌卡：加到主屏幕（全屏无网址栏） */
    .card.mahjong.has-ahs {
      position: relative;
    }
    .card .ahs-btn {
      position: absolute;
      top: .35rem;
      right: .35rem;
      z-index: 3;
      border: 1px solid rgba(240, 211, 146, .55);
      background: rgba(12, 14, 20, .82);
      color: var(--gold2);
      font-size: .58rem;
      font-weight: 700;
      letter-spacing: .02em;
      padding: .28rem .42rem;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
    }
    .card .ahs-btn:active { transform: scale(.97); }
    #ahsModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(0,0,0,.62);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #ahsModal.show { display: flex; }
    #ahsModal .ahs-panel {
      width: min(94vw, 400px);
      max-height: min(86vh, 640px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: #151923;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .9rem .95rem 1rem;
      color: #ece7db;
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
    }
    #ahsModal h3 {
      font-size: .95rem;
      color: var(--gold2);
      margin: 0 0 .45rem;
    }
    #ahsModal h4 {
      font-size: .78rem;
      color: #f0d392;
      margin: .7rem 0 .35rem;
      font-weight: 700;
    }
    #ahsModal p, #ahsModal ol {
      font-size: .72rem;
      color: #c8c2b4;
      line-height: 1.5;
      margin: 0 0 .45rem;
    }
    #ahsModal .ahs-note {
      color: var(--muted);
      font-size: .68rem;
    }
    #ahsModal ol { padding-left: 1.15rem; margin-bottom: .35rem; }
    #ahsModal li { margin: .28rem 0; }
    #ahsModal b { color: #f3e6c4; font-weight: 700; }
    #ahsModal .ahs-actions {
      display: flex;
      gap: .45rem;
      margin-top: .7rem;
    }
    #ahsModal .ahs-actions button {
      flex: 1;
      border: 1px solid var(--line);
      background: #1c2230;
      color: #ece7db;
      border-radius: 8px;
      padding: .55rem .4rem;
      font-size: .72rem;
      font-weight: 700;
      cursor: pointer;
    }
    #ahsModal .ahs-actions button.primary {
      border-color: rgba(240,211,146,.5);
      background: linear-gradient(180deg, #3a3224, #2a2418);
      color: var(--gold2);
    }
    .card .name {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card .sub {
      margin-top: .1rem;
      font-size: .58rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 760px) {
      .body { grid-template-columns: 72px 1fr; }
      .card { max-height: 46vw; }
    }
    @media (min-width: 761px) {
      .body { grid-template-columns: 96px 1fr; }
      .card { max-height: 220px; }
      .nav-parent { font-size: .76rem; padding: .62rem .45rem; }
      .nav-child { font-size: .7rem; padding: .4rem .4rem .4rem .55rem; }
    }
    /* 横版：列表可上下滑；卡片可点进桌（短屏整页滚，避免 iOS 嵌套滚失效） */
    @media (orientation: landscape) {
      .body { grid-template-columns: 84px 1fr; }
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: .45rem;
        padding: .4rem .5rem 1.5rem;
      }
      .card {
        max-height: min(38vh, 210px);
        aspect-ratio: 1 / 1;
      }
      .card .name { font-size: .78rem; }
      .card .sub { font-size: .62rem; }
    }
    @media (orientation: landscape) and (max-height: 480px) {
      html, body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .app {
        height: auto;
        min-height: 100dvh;
      }
      .body {
        height: auto;
        min-height: calc(100dvh - 88px);
        overflow: visible;
      }
      .main {
        height: auto;
        overflow: visible;
      }
      .grid {
        flex: none;
        overflow: visible;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .card { max-height: 140px; }
    }
    /* 竖屏：整页可滚，入口卡片完整显现（不被 46vw 裁切） */
    @media (orientation: portrait) {
      html, body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .app {
        height: auto;
        min-height: 100dvh;
      }
      .body {
        height: auto;
        min-height: calc(100dvh - 88px);
        overflow: visible;
      }
      .main {
        height: auto;
        overflow: visible;
      }
      .grid {
        flex: none;
        overflow: visible;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: .48rem;
        padding: .4rem .38rem 1.6rem;
      }
      .card {
        max-height: none;
        aspect-ratio: 1 / 1;
        width: 100%;
      }
      .card .meta { padding: .26rem .32rem .3rem; }
      .card .name { font-size: .7rem; }
      .card .sub { font-size: .56rem; }
      .card.mahjong .thumb {
        background-position: center 22%;
        background-size: cover;
      }
    }
    /* 手机进桌：透明壳压住大厅（仍看得见大厅）→ 子页就绪再淡入，禁止黑屏 */
    #fgEmbedShell {
      position: fixed; inset: 0; z-index: 99999;
      display: none; background: transparent;
    }
    #fgEmbedShell.show { display: block; }
    #fgEmbedShell.is-ready { background: #0a0c10; }
    #fgEmbedShell iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: transparent;
      opacity: 0;
    }
    #fgEmbedShell.is-ready iframe { opacity: 1; }
    #fgEmbedCover { display: none !important; }
    /* 进桌壳左上 × 已去掉：子页自带返回；避免盖住记录页标题 */
    #fgEmbedClose { display: none !important; }
  </style>
  <!-- 轮盘首页首开：预取轮盘页+键面；禁止预取骰宝抢带宽 -->
  <link rel="prefetch" href="roulette-m.html?v=1.6.12" as="document">
  <link rel="prefetch" href="mahjong-m.html?v=1.2.6" as="document">
  <link rel="prefetch" href="baccarat-m.html?v=2.9.1" as="document">
  <link rel="prefetch" href="assets/baccarat/src-green-full.webp?v=2.9.1" as="image">
  <link rel="preload" as="image" href="assets/roulette/m-kbd-face.webp?v=1.5.0" type="image/webp" fetchpriority="high">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row1">
        <div class="top-left">
          <div class="user"><span class="avatar" id="lobbyAvatar">F</span><span id="lobbyUser">forest</span></div>
          <div class="bal"><span class="chip-ico"></span><span id="lobbyBal">—</span></div>
        </div>
        <div class="top-right">
          <button class="icon-btn icon-back" type="button" title="返回" id="logoutBtn" aria-label="返回">🔙</button>
        </div>
      </div>
      <div class="top-row2">
        <div class="ref-code" id="lobbyRef" title="我的推荐码">推荐码 —</div>
        <button type="button" class="invite-btn" id="lobbyInvite" title="一点复制邀请链接，发给 WhatsApp 朋友">邀请链接 · 一点复制</button>

  <script>
    (function () {
      const GAME_PC = 'game.html?v=1.5.18';
      const GAME_M = 'game-m.html?v=2.9.0';
      const ROULETTE_PC = 'roulette.html?v=1.2.16';
      const ROULETTE_M = 'roulette-m.html?v=2.9.0';
      const ROULETTE_M_BOOT = 'roulette-m-boot.html?v=2.9.0';
      const BACCARAT_M = 'baccarat-m.html?v=2.9.1';
      const MAHJONG_M = 'mahjong-m.html?v=1.2.6';
      function isMobileClient() {
        try {
          if (/(Android|iPhone|iPod|iPad|Mobile|webOS|BlackBerry)/i.test(navigator.userAgent || '')) return true;
          if (window.matchMedia && window.matchMedia('(max-width: 820px)').matches) return true;
        } catch (_) {}
        return false;
      }
      const GAME = isMobileClient() ? GAME_M : GAME_PC;
      /* 手机轮盘：大厅 iframe 直进（不再走过渡页，避免又慢又丢声音手势） */
      const ROULETTE = isMobileClient() ? ROULETTE_M : ROULETTE_PC;
      const SHELL_V = '1.3.9h';
      /* 父页播控：解锁禁播滚球长片；欢迎在点击手势内播，避免进桌无欢迎 */
      const ShellSfx = {
        els: Object.create(null),
        src: {
          welcome: 'audio/welcome-roulette.mp3?v=' + SHELL_V,
          welcomeSicbo: 'audio/welcome.mp3?v=1.5.15',
          startBet: 'audio/start-bet.mp3?v=' + SHELL_V,
          roundOpen: 'audio/round-open-bet.mp3?v=' + SHELL_V,
          stopBet: 'audio/stop-bet.mp3?v=' + SHELL_V,
          betOk: 'audio/bet-ok.mp3?v=1.5.15',
          tick: 'audio/tick.mp3?v=' + SHELL_V,
          bombTick: 'audio/bomb-tick.mp3?v=' + SHELL_V,
          keyClick: 'audio/key-click.mp3?v=' + SHELL_V,
          ballRoll: 'audio/roulette-ball-roll.mp3?v=' + SHELL_V,
          fret0: 'audio/roulette-fret-click-0.mp3?v=' + SHELL_V,
          fret1: 'audio/roulette-fret-click-1.mp3?v=' + SHELL_V,
          fret2: 'audio/roulette-fret-click-2.mp3?v=' + SHELL_V,
        },
        defaultVol: {
          tick: 0.52,
          bombTick: 0.62,
          keyClick: 0.7,
          ballRoll: 1,
          fret0: 0.9,
          fret1: 0.9,
          fret2: 0.9,
          betOk: 1,
        },
        voiceKeys: { welcome: 1, welcomeSicbo: 1, startBet: 1, roundOpen: 1, stopBet: 1, betOk: 1 },
        /* 解锁静音试播：禁止 ballRoll/fret（长片会在开局漏出滚球声） */
        unlockPlayKeys: {
          welcome: 1, welcomeSicbo: 1, startBet: 1, roundOpen: 1, stopBet: 1, betOk: 1,
          tick: 1, bombTick: 1, keyClick: 1,
        },
        ctx: null,
        live: Object.create(null),
        primed: false,
        heavyScheduled: false,
        embedWelcomeOk: null,
        embedWelcomeP: null,
        embedKind: null, /* 'roulette' | 'sicbo' */
        sicboReady: false,
        /* 步骤3：骰宝静音只认子页 Voice.muted + fg_sicbo_m_sound_mute；父页不再代查/代判 */
        ensureEl(key) {
          if (this.els[key]) return this.els[key];
          const src = this.src[key];
          if (!src) return null;
          const a = new Audio(src);
          /* 欢迎首包用 metadata，避免进桌瞬间与键面图抢满带宽 */
          a.preload = (key === 'welcome' || key === 'welcomeSicbo') ? 'metadata' : 'auto';
          this.els[key] = a;
          return a;
        },
        reply(id, ok) {
          if (!id) return;
          try {
            const frame = document.getElementById('fgEmbedFrame');
            if (frame && frame.contentWindow) {
              frame.contentWindow.postMessage({ type: 'fg-sfx-done', id: id, ok: !!ok }, '*');
            }
          } catch (_) {}
        },
        replyWelcome(ok) {
          try {
            const frame = document.getElementById('fgEmbedFrame');
            if (frame && frame.contentWindow) {
              frame.contentWindow.postMessage({ type: 'fg-welcome', ok: !!ok }, '*');
            }
          } catch (_) {}
        },
        playWelcomeForEmbed() {
          if (this.embedWelcomeP) return this.embedWelcomeP;
          this.embedWelcomeP = this.playAwait('welcome').then((ok) => {
            this.embedWelcomeOk = !!ok;
            this.replyWelcome(!!ok);
            return !!ok;
          });
          return this.embedWelcomeP;
        },
        /* 步骤4/5：骰宝父页极轻解锁——只 AudioContext；不 ensureEl 口播片、不真播、不 scheduleHeavy */
        primeSicboGesture() {
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
              this.ctx = this.ctx || new AC();
              if (this.ctx.state === 'suspended') this.ctx.resume();
              const buf = this.ctx.createBuffer(1, 1, 22050);
              const src = this.ctx.createBufferSource();
              src.buffer = buf;
              src.connect(this.ctx.destination);
              src.start(0);
            }
          } catch (_) {}
        },
        /* 轮盘步骤1：父页极轻解锁；口播/滚球/隔板留给子页（步骤2） */
        primeRouletteGesture() {
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
              this.ctx = this.ctx || new AC();
              if (this.ctx.state === 'suspended') this.ctx.resume();
              const buf = this.ctx.createBuffer(1, 1, 22050);
              const src = this.ctx.createBufferSource();
              src.buffer = buf;
              src.connect(this.ctx.destination);
              src.start(0);
            }
          } catch (_) {}
        },
        resetEmbedWelcome() {
          this.embedWelcomeOk = null;
          this.embedWelcomeP = null;
          this.sicboReady = false;
          this.heavyScheduled = false;
        },
        /* 进桌瞬时：只解锁 AudioContext + 欢迎，不预拉全套音效（恢复首屏速度） */
        primeLight() {
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
              this.ctx = this.ctx || new AC();
              if (this.ctx.state === 'suspended') this.ctx.resume();
              const buf = this.ctx.createBuffer(1, 1, 22050);
              const src = this.ctx.createBufferSource();
              src.buffer = buf;
              src.connect(this.ctx.destination);
              src.start(0);
            }
          } catch (_) {}
          this.ensureEl(this.embedKind === 'sicbo' ? 'welcomeSicbo' : 'welcome');
        },
        /* 桌内已出来后再预热其余音效；ballRoll 只 load 不 play */
        primeHeavy() {
          /* 骰宝/轮盘/百家乐均不走 heavy（杜绝父页点亮音轨漏播） */
          if (this.embedKind === 'sicbo' || this.embedKind === 'roulette' || this.embedKind === 'baccarat' || this.embedKind === 'mahjong') return;
          Object.keys(this.src).forEach((k) => {
            this.ensureEl(k);
          });
          ['ballRoll', 'fret0', 'fret1', 'fret2'].forEach((k) => {
            const el = this.els[k];
            if (!el) return;
            try { el.preload = 'auto'; el.load(); } catch (_) {}
          });
          if (this.primed) return;
          this.primed = true;
          Object.keys(this.unlockPlayKeys).forEach((k) => {
            if (k === 'welcome' || k === 'welcomeSicbo') return;
            const el = this.els[k];
            if (!el) return;
            try {
              el.muted = true;
              el.volume = 0;
              const p = el.play();
              const reset = () => {
                try { el.pause(); el.currentTime = 0; el.muted = false; el.volume = 1; } catch (_) {}
              };
              if (p && p.then) p.then(reset).catch(reset);
              else reset();
            } catch (_) {}
          });
        },
        scheduleHeavy(delayMs) {
          /* 骰宝/轮盘/百家乐禁止 scheduleHeavy */
          if (this.embedKind === 'sicbo' || this.embedKind === 'roulette' || this.embedKind === 'baccarat' || this.embedKind === 'mahjong') return;
          if (this.heavyScheduled) return;
          this.heavyScheduled = true;
          const run = () => { try { this.primeHeavy(); } catch (_) {} };
          const wait = delayMs == null ? 1800 : delayMs;
          try {
            if (typeof requestIdleCallback === 'function' && wait <= 2000) {
              requestIdleCallback(run, { timeout: Math.max(2800, wait + 500) });
              return;
            }
          } catch (_) {}
          setTimeout(run, wait);
        },
        prime() {
          if (this.embedKind === 'sicbo' || this.embedKind === 'baccarat' || this.embedKind === 'mahjong') {
            this.primeSicboGesture();
            return;
          }
          /* 轮盘步骤1：只极轻解锁，不 scheduleHeavy、不预热口播片 */
          if (this.embedKind === 'roulette') {
            this.primeRouletteGesture();
            return;
          }
          this.primeLight();
          this.scheduleHeavy(1800);
        },
        stopVoice() {
          Object.keys(this.voiceKeys).forEach((k) => {
            const el = this.els[k];
            if (!el) return;
            try { el.pause(); el.currentTime = 0; el.onended = null; el.onerror = null; } catch (_) {}
          });
          if (this.live.enNum) {
            try { this.live.enNum.pause(); this.live.enNum.currentTime = 0; } catch (_) {}
            delete this.live.enNum;
          }
        },
        stop(key) {
          if (key === 'ballRoll') {
            const a = this.live.ballRoll || this.els.ballRoll;
            if (a) try { a.pause(); a.currentTime = 0; } catch (_) {}
            delete this.live.ballRoll;
            return;
          }
          const a = this.live[key] || this.els[key];
          if (!a) return;
          try { a.pause(); a.currentTime = 0; } catch (_) {}
          delete this.live[key];
        },
        /* 口播/报数：优先 ended；手机常不触发 ended → 按片长收尾，避免卡死倒计时 */
        voiceEstMs: { welcome: 2000, welcomeSicbo: 2000, startBet: 1100, roundOpen: 1100, stopBet: 1100, enNum: 1600 },
        playAwait(key, vol) {
          return new Promise((resolve) => {
            if (!key || key === 'youWin' || key === 'beep') {
              resolve(false);
              return;
            }
            /* 骰宝/轮盘桌内父页一律不代播（轮盘步骤1） */
            if (this.embedKind === 'sicbo' || this.embedKind === 'roulette') {
              resolve(false);
              return;
            }
            let done = false;
            const finish = (ok) => {
              if (done) return;
              done = true;
              resolve(!!ok);
            };
            const armDuration = (el, fallbackMs) => {
              let ms = fallbackMs;
              try {
                if (el && el.duration && isFinite(el.duration) && el.duration > 0) {
                  ms = Math.round(el.duration * 1000) + 120;
                }
              } catch (_) {}
              setTimeout(() => finish(true), Math.min(8000, Math.max(400, ms)));
            };
            try {
              if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
              if (key === 'enNum') {
                this.stopVoice();
                const n = Math.max(0, Math.min(36, Number(vol) || 0));
                const a = new Audio('audio/roulette-en/n' + n + '.mp3?v=' + SHELL_V);
                a.volume = 1;
                this.live.enNum = a;
                a.onended = () => finish(true);
                a.onerror = () => finish(false);
                const p = a.play();
                if (p && p.then) p.then(() => armDuration(a, this.voiceEstMs.enNum)).catch(() => finish(false));
                else armDuration(a, this.voiceEstMs.enNum);
                return;
              }
              if (!this.voiceKeys[key] || !this.src[key]) {
                this.play(key, vol);
                finish(true);
                return;
              }
              this.stopVoice();
              const el = this.ensureEl(key);
              if (!el) { finish(false); return; }
              el.muted = false;
              el.volume = 1;
              try { el.onended = null; el.onerror = null; } catch (_) {}
              el.pause();
              el.currentTime = 0;
              el.onended = () => finish(true);
              el.onerror = () => finish(false);
              const est = this.voiceEstMs[key] || 1200;
              const p = el.play();
              if (p && p.then) p.then(() => armDuration(el, est)).catch(() => finish(false));
              else armDuration(el, est);
            } catch (_) {
              finish(false);
            }
          });
        },
        play(key, vol) {
          if (!key) return;
          if (key === 'youWin' || key === 'beep') return;
          /* 骰宝/轮盘桌内父页一律不代播（轮盘步骤1） */
          if (this.embedKind === 'sicbo' || this.embedKind === 'roulette') return;
          if (key === 'enNum') {
            void this.playAwait('enNum', vol);
            return;
          }
          const src = this.src[key];
          if (!src) return;
          try {
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            const dv = this.defaultVol[key];
            const v = vol != null ? vol : (dv != null ? dv : 1);
            if (this.voiceKeys[key]) {
              this.stopVoice();
              const el = this.ensureEl(key);
              if (!el) return;
              el.muted = false;
              el.volume = 1;
              el.pause();
              el.currentTime = 0;
              const p = el.play();
              if (p && p.catch) p.catch(() => {});
              return;
            }
            if (key === 'ballRoll') {
              this.stop('ballRoll');
              const el = this.ensureEl(key);
              if (!el) return;
              el.muted = false;
              el.volume = v;
              el.pause();
              el.currentTime = 0;
              this.live.ballRoll = el;
              const p = el.play();
              if (p && p.catch) p.catch(() => {});
              return;
            }
            if (key === 'tick' || key === 'bombTick' || key === 'keyClick') {
              const el = this.ensureEl(key);
              if (!el) return;
              el.muted = false;
              el.pause();
              el.currentTime = 0;
              el.volume = v;
              const p = el.play();
              if (p && p.catch) p.catch(() => {});
              return;
            }
            const base = this.ensureEl(key);
            if (!base) return;
            const a = base.cloneNode();
            a.muted = false;
            a.volume = v;
            const p = a.play();
            if (p && p.catch) p.catch(() => {});
          } catch (_) {}
        },
      };
      let embedReadyTimer = 0;
      function revealEmbed() {
        if (embedReadyTimer) {
          clearTimeout(embedReadyTimer);
          embedReadyTimer = 0;
        }
        const shell = document.getElementById('fgEmbedShell');
        if (shell) shell.classList.add('is-ready');
      }
      function ensureEmbedShell() {
        let shell = document.getElementById('fgEmbedShell');
        if (shell) return shell;
        shell = document.createElement('div');
        shell.id = 'fgEmbedShell';
        /* 不再挂左上 ×：桌内用返回箭头 ‹ 回大厅 */
        shell.innerHTML = '<iframe id="fgEmbedFrame" allow="autoplay *; fullscreen *" allowfullscreen title="game"></iframe>';
        document.body.appendChild(shell);
        const frame = document.getElementById('fgEmbedFrame');
        if (frame) {
          frame.addEventListener('load', () => {
            /* 兜底：HTML 到了仍无 ready 时，最长再等一会揭开，绝不长期黑屏 */
            if (embedReadyTimer) clearTimeout(embedReadyTimer);
            /* 麻将：load 后立刻揭层；百家乐绿台已 webp，短兜底；其它桌保持原 1600 */
            var ms = ShellSfx.embedKind === 'mahjong' ? 0
              : (ShellSfx.embedKind === 'baccarat' ? 280 : 1600);
            embedReadyTimer = setTimeout(revealEmbed, ms);
          });
        }
        window.addEventListener('message', (ev) => {
          const d = ev && ev.data;
          if (!d || typeof d !== 'object') return;
          if (d.type === 'fg-sfx-prime') {
            /* 骰宝/轮盘/百家乐只极轻 AudioContext；禁止拉全套代播 */
            if (ShellSfx.embedKind === 'sicbo' || ShellSfx.embedKind === 'baccarat' || ShellSfx.embedKind === 'mahjong') ShellSfx.primeSicboGesture();
            else if (ShellSfx.embedKind === 'roulette') ShellSfx.primeRouletteGesture();
            else ShellSfx.prime();
          }
          if (d.type === 'fg-sicbo-ready') {
            ShellSfx.sicboReady = true;
            revealEmbed();
            /* 步骤1：只揭桌，不代播欢迎/开始下注 */
            ShellSfx.embedWelcomeOk = true;
            ShellSfx.replyWelcome(true);
          }
          if (d.type === 'fg-embed-ready' || d.type === 'fg-roulette-ready') {
            revealEmbed();
            if (d.type === 'fg-roulette-ready' && ShellSfx.embedKind === 'roulette') {
              /* 轮盘步骤1：只揭桌回执，不代播欢迎 */
              ShellSfx.embedWelcomeOk = true;
              ShellSfx.replyWelcome(true);
            }
            if (d.type === 'fg-embed-ready' && (ShellSfx.embedKind === 'baccarat' || ShellSfx.embedKind === 'mahjong')) {
              /* 百家乐对齐骰宝：只揭桌，父页不代播 */
              ShellSfx.embedWelcomeOk = true;
              ShellSfx.replyWelcome(true);
            }
          }
          /* 麻将匹配：子页点「开启全屏」→ 父页把 iframe 拉全屏（仅麻将） */
          if (d.type === 'fg-embed-fullscreen' && ShellSfx.embedKind === 'mahjong') {
            try {
              const frame = document.getElementById('fgEmbedFrame');
              const target = frame || document.documentElement;
              const req = target.requestFullscreen || target.webkitRequestFullscreen || target.webkitRequestFullScreen;
              if (req) {
                const p = req.call(target);
                if (p && p.catch) p.catch(function () {});
              }
            } catch (_) {}
          }
          if (d.type === 'fg-want-welcome') {
            if (ShellSfx.embedKind === 'sicbo' || ShellSfx.embedKind === 'roulette' || ShellSfx.embedKind === 'baccarat' || ShellSfx.embedKind === 'mahjong') {
              ShellSfx.embedWelcomeOk = true;
              ShellSfx.replyWelcome(true);
            } else if (ShellSfx.embedWelcomeOk != null) {
              ShellSfx.replyWelcome(ShellSfx.embedWelcomeOk);
            } else {
              void ShellSfx.playWelcomeForEmbed();
            }
          }
          if (d.type === 'fg-sfx') {
            if (ShellSfx.embedKind === 'sicbo' || ShellSfx.embedKind === 'roulette' || ShellSfx.embedKind === 'baccarat' || ShellSfx.embedKind === 'mahjong') {
              /* 骰宝/轮盘/百家乐/麻将父页不代播任何 fg-sfx；子页自播 */
              if (d.id) ShellSfx.reply(d.id, false);
            } else if ((d.key === 'welcome' || d.key === 'welcomeSicbo') && d.id) {
              ShellSfx.playWelcomeForEmbed().then((ok) => ShellSfx.reply(d.id, ok));
            } else if (d.id) {
              ShellSfx.playAwait(d.key, d.vol).then((ok) => ShellSfx.reply(d.id, ok));
            } else {
              ShellSfx.play(d.key, d.vol);
            }
          }
          if (d.type === 'fg-sfx-stop') ShellSfx.stop(d.key);
          if (d.type === 'fg-embed-close') closeEmbedShell();
        });
        return shell;
      }
      /* 麻将专用：进桌 pushState，系统返回只关桌，不退到登录页 */
      var mahjongEmbedHist = false;
      var mahjongEmbedClosing = false;
      function exitLobbyFullscreen() {
        try {
          if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen();
            return;
          }
        } catch (_) {}
        try {
          if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        } catch (_) {}
      }
      function closeEmbedShell(fromPop) {
        try { ShellSfx.stop('ballRoll'); ShellSfx.stopVoice(); } catch (_) {}
        ShellSfx.resetEmbedWelcome();
        if (embedReadyTimer) {
          clearTimeout(embedReadyTimer);
          embedReadyTimer = 0;
        }
        if (ShellSfx.embedKind === 'mahjong') exitLobbyFullscreen();
        const shell = document.getElementById('fgEmbedShell');
        const frame = document.getElementById('fgEmbedFrame');
        const wasMahjong = ShellSfx.embedKind === 'mahjong';
        if (shell) shell.classList.remove('show', 'is-ready');
        if (frame) frame.src = 'about:blank';
        ShellSfx.embedKind = null;
        /* 麻将：吞掉进桌 push，禁止 history.back（会把桌面App/网页直接退出） */
        if (wasMahjong && mahjongEmbedHist && !fromPop) {
          mahjongEmbedHist = false;
          try { history.replaceState({}, '', location.href); } catch (_) {}
        } else if (wasMahjong) {
          mahjongEmbedHist = false;
        }
        /* 从桌内返回：立刻刷新顶栏真实余额 */
        syncBalFromServer(currentUser()).then((n) => {
          if (n != null) paintUserBar();
        });
      }
      try { window.__fgCloseEmbed = closeEmbedShell; } catch (_) {}
      try {
        window.addEventListener('popstate', function () {
          if (mahjongEmbedClosing) return;
          if (ShellSfx.embedKind !== 'mahjong') return;
          const shell = document.getElementById('fgEmbedShell');
          if (shell && shell.classList.contains('show')) {
            mahjongEmbedHist = false;
            closeEmbedShell(true);
          }
        });
      } catch (_) {}
      function openEmbedShell(url) {
        ShellSfx.stop('ballRoll');
        ShellSfx.resetEmbedWelcome();
        ShellSfx.embedKind = /game-m\.html/.test(url)
          ? 'sicbo'
          : /roulette-m\.html/.test(url)
            ? 'roulette'
            : /baccarat-m\.html/.test(url)
              ? 'baccarat'
              : /mahjong-m\.html/.test(url)
                ? 'mahjong'
                : null;
        const shell = ensureEmbedShell();
        const frame = document.getElementById('fgEmbedFrame');
        /* 点进桌：大厅不卸、不盖黑/海报；子页 ready 再淡入桌面 */
        shell.classList.remove('is-ready');
        shell.classList.add('show');
        if (embedReadyTimer) clearTimeout(embedReadyTimer);
        /* 麻将 400；百家乐 600（绿台 webp）；其它桌仍 2200 */
        embedReadyTimer = setTimeout(
          revealEmbed,
          ShellSfx.embedKind === 'mahjong' ? 400
            : (ShellSfx.embedKind === 'baccarat' ? 600 : 2200)
        );
        /* 麻将：垫一层历史，手机返回先关桌 */
        if (ShellSfx.embedKind === 'mahjong' && !mahjongEmbedHist) {
          try {
            history.pushState({ fgEmbed: 'mahjong' }, '');
            mahjongEmbedHist = true;
          } catch (_) {}
        }
        const join = url.indexOf('?') >= 0 ? '&' : '?';
        /* 百家乐/麻将 embed：带上登录账号，子页 iframe 读不到父页 sessionStorage */
        let embedQs = 'embed=1';
        if (ShellSfx.embedKind === 'baccarat' || ShellSfx.embedKind === 'mahjong') {
          try {
            const u = encodeURIComponent(currentUser());
            if (u) embedQs += '&user=' + u;
          } catch (_) {}
        }
        frame.src = url + join + embedQs;
        if (ShellSfx.embedKind === 'roulette') {
          /* 轮盘步骤1：手势内只极轻 AudioContext；口播改子页自播（步骤2） */
          ShellSfx.primeRouletteGesture();
        } else if (ShellSfx.embedKind === 'sicbo' || ShellSfx.embedKind === 'baccarat' || ShellSfx.embedKind === 'mahjong') {
          /* 骰宝/百家乐/麻将：进桌手势只极轻 AudioContext；口播全子页 */
          ShellSfx.primeSicboGesture();
        } else {
          ShellSfx.primeLight();
        }
      }
      const START_BAL = 2000;
      const ACCOUNT_API = 'api/fg-wallet-account.php';
      function currentUser() {
        try {
          const u = (sessionStorage.getItem('fg_sicbo_user')
            || localStorage.getItem('fg_sicbo_last_user')
            || 'asdg').trim();
          return u || 'asdg';
        } catch (_) {
          return 'asdg';
        }
      }
      function balKeyFor(user) {
        return 'fg_sicbo_bal::' + String(user || 'asdg').trim().toLowerCase();
      }
      function loadBal(user) {
        try {
          let raw = localStorage.getItem(balKeyFor(user));
          if (raw == null || raw === '') {
            raw = localStorage.getItem('fg_sicbo_balance');
          }
          if (raw == null || raw === '') return START_BAL;
          const n = Math.round(Number(raw));
          return Number.isFinite(n) && n >= 0 ? n : START_BAL;
        } catch (_) {
          return START_BAL;
        }
      }
      function saveBalLocal(user, n) {
        const v = String(Math.max(0, Math.round(Number(n) || 0)));
        try {
          localStorage.setItem(balKeyFor(user), v);
          localStorage.setItem('fg_sicbo_balance', v);
          localStorage.setItem('fg_sicbo_last_user', user);
        } catch (_) {}
      }
      function fmtBal(n) {
        return Math.max(0, Math.round(Number(n) || 0)).toLocaleString('en-US', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }
      function paintBalOnly(n) {
        const balEl = document.getElementById('lobbyBal');
        if (!balEl || n == null || !Number.isFinite(Number(n))) return;
        balEl.textContent = fmtBal(n);
      }
      async function syncBalFromServer(user) {
        try {
          /* lean=1：只取真实余额，不下载整包流水 */
          const r = await fetch(
            ACCOUNT_API + '?user=' + encodeURIComponent(user) + '&lean=1',
            { cache: 'no-store' }
          );
          const j = await r.json();
          if (!j || !j.ok || !j.data) return null;
          if (j.data.balance == null) return null;
          const n = Math.max(0, Math.round(Number(j.data.balance)));
          if (!Number.isFinite(n)) return null;
          saveBalLocal(user, n);
          paintBalOnly(n);
          return n;
        } catch (_) {
          return null;
        }
      }
      try {
        /* 刷新大厅：localStorage 有登录态则恢复，不踢回登录页 */
        if (sessionStorage.getItem('fg_sicbo_auth') !== '1') {
          if (localStorage.getItem('fg_sicbo_auth') === '1') {
            sessionStorage.setItem('fg_sicbo_auth', '1');
            const lu = (localStorage.getItem('fg_sicbo_user') || localStorage.getItem('fg_sicbo_last_user') || '').trim();
            if (lu) sessionStorage.setItem('fg_sicbo_user', lu);
            try {
              const prof = localStorage.getItem('fg_sicbo_profile');
              if (prof) sessionStorage.setItem('fg_sicbo_profile', prof);
            } catch (_) {}
          } else {
            location.replace('index.html?v=v1.0.54');
            return;
          }
        }
        let u = (sessionStorage.getItem('fg_sicbo_user') || '').trim();
        if (!u) {
          u = currentUser();
          sessionStorage.setItem('fg_sicbo_user', u);
        }
        /* 把当前会话写入 localStorage，之后刷新/回首页可直进大厅 */
        try {
          localStorage.setItem('fg_sicbo_auth', '1');
          localStorage.setItem('fg_sicbo_user', u);
          localStorage.setItem('fg_sicbo_last_user', u);
          const prof = sessionStorage.getItem('fg_sicbo_profile');
          if (prof) localStorage.setItem('fg_sicbo_profile', prof);
        } catch (_) {}
      } catch (_) { /* ignore */ }

      function paintUserBar() {
        const u = currentUser();
        const nameEl = document.getElementById('lobbyUser');
        const av = document.getElementById('lobbyAvatar');
        const balEl = document.getElementById('lobbyBal');
        const refEl = document.getElementById('lobbyRef');
        const inviteEl = document.getElementById('lobbyInvite');
        if (nameEl) nameEl.textContent = u;
        if (av) av.textContent = (u.charAt(0) || 'F').toUpperCase();
        if (balEl) {
          /* 本地有缓存先显示；最终以服务器真实余额为准（不是写死 2000） */
          const localN = loadBal(u);
          balEl.textContent = localN === START_BAL && !localStorage.getItem(balKeyFor(u)) && !localStorage.getItem('fg_sicbo_balance')
            ? '…'
            : fmtBal(localN);
        }
        let code = String(u || '').toUpperCase();
        try {
          const raw = sessionStorage.getItem('fg_sicbo_profile');
          if (raw) {
            const p = JSON.parse(raw);
            if (p && p.referralCode) code = String(p.referralCode).toUpperCase();
            if (p && p.nick && nameEl) nameEl.textContent = p.nick;
          }
        } catch (_) {}
        if (refEl) refEl.textContent = '推荐码 ' + (code || '—');
        if (inviteEl) {
          inviteEl.dataset.code = code || '';
          if (!inviteEl.dataset.bound) {
            inviteEl.dataset.bound = '1';
            inviteEl.addEventListener('click', async () => {
              const c = inviteEl.dataset.code || '';
              const link = location.origin + '/index.html?v=v1.0.54&ref=' + encodeURIComponent(c);
              const done = () => {
                inviteEl.classList.add('is-copied');
                inviteEl.textContent = '已复制 · 去 WhatsApp 粘贴';
                setTimeout(() => {
                  inviteEl.classList.remove('is-copied');
                  inviteEl.textContent = '邀请链接 · 一点复制';
                }, 2200);
              };
              try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  await navigator.clipboard.writeText(link);
                  done();
                } else {
                  prompt('邀请链接（长按复制后发 WhatsApp）', link);
                }
              } catch (_) {
                prompt('邀请链接（长按复制后发 WhatsApp）', link);
              }
            });
          }
        }
      }
      paintUserBar();
      (async () => {
        const u = currentUser();
        const n = await syncBalFromServer(u);
        if (n != null) paintUserBar();
      })();
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        paintUserBar();
        syncBalFromServer(currentUser()).then((n) => {
          if (n != null) paintUserBar();
        });
      });

      /* 入口到风位大战为止；可进桌的保留进桌，其余演示 */
      const tables = [
        { id: 'S601', name: '骰宝 S601', kind: 'sicbo', featured: true, enter: 'sicbo', sec: 22 },
        { id: 'R501', name: '轮盘 R501', kind: 'roulette', featured: true, enter: 'roulette', sec: 20 },
        { id: 'B601', name: '百家乐 B601', kind: 'baccarat', featured: true, enter: 'baccarat', sec: 20 },
        { id: 'BJ01', name: '21点 BJ01', kind: 'blackjack', featured: true, enter: '', sec: 18 },
        { id: 'M701', name: '单人香港麻将', kind: 'mahjong', mj: 'hk', featured: true, enter: 'mahjong', sec: 20 },
        { id: 'M702', name: '多人香港麻将', kind: 'mahjong', mj: 'hk2', featured: true, enter: '', sec: 18 },
        { id: 'M703', name: '四人香港麻将', kind: 'mahjong', mj: 'hk3', featured: true, enter: '', sec: 18 },
        { id: 'M711', name: '广东麻将·经典', kind: 'mahjong', mj: 'gd1', featured: true, enter: '', sec: 18 },
        { id: 'M712', name: '广东麻将·鸡平胡', kind: 'mahjong', mj: 'gd2', featured: true, enter: '', sec: 18 },
        { id: 'M713', name: '广东麻将·推倒胡', kind: 'mahjong', mj: 'gd3', featured: true, enter: '', sec: 18 },
        { id: 'M721', name: '四川麻将·血战到底', kind: 'mahjong', mj: 'sc1', featured: true, enter: '', sec: 18 },
        { id: 'M722', name: '四川麻将·换三张', kind: 'mahjong', mj: 'sc2', featured: true, enter: '', sec: 18 },
        { id: 'M723', name: '四川麻将·血流成河', kind: 'mahjong', mj: 'sc3', featured: true, enter: '', sec: 18 },
        { id: 'M731', name: '国标麻将', kind: 'mahjong', mj: 'gb1', featured: true, enter: '', sec: 18 },
        { id: 'M732', name: '风位大战', kind: 'mahjong', mj: 'wind', featured: true, enter: '', sec: 18 },
      ];

      const grid = document.getElementById('grid');

      function enterSicbo() {
        /* 手机：iframe 进桌；只写子页静音 key（步骤3单一真相），父页不据此代播 */
        if (isMobileClient()) {
          try { localStorage.setItem('fg_sicbo_m_sound_mute', '1'); } catch (_) {}
          openEmbedShell(GAME_M);
          return;
        }
        location.href = GAME;
      }
      function enterRoulette() {
        /* 手机：与骰宝同款 iframe 进桌（用户书面改回）；只写子页静音 key，父页不代播 */
        if (isMobileClient()) {
          try { localStorage.setItem('fg_roulette_m_sound_mute', '1'); } catch (_) {}
          openEmbedShell(ROULETTE_M);
          return;
        }
        location.href = ROULETTE;
      }
      function enterBaccarat() {
        /* 手机百家乐厅：iframe 进桌；不影响骰宝/轮盘 */
        if (isMobileClient()) {
          openEmbedShell(BACCARAT_M);
          return;
        }
        location.href = BACCARAT_M;
      }
      function enterMahjong() {
        /* 第四款：麻将竖屏壳；不影响已封存三款子页 */
        if (isMobileClient()) {
          openEmbedShell(MAHJONG_M);
          return;
        }
        location.href = MAHJONG_M;
      }

      function bindEnter(id, fn) {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('click', function (e) {
          try { e.preventDefault(); e.stopPropagation(); } catch (_) {}
          fn();
        });
      }
      function enterByKey(key) {
        if (key === 'sicbo') enterSicbo();
        else if (key === 'roulette') enterRoulette();
        else if (key === 'baccarat') enterBaccarat();
        else if (key === 'mahjong') enterMahjong();
        else alert('即将开放');
      }

      function paint() {
        /* 中间始终展示全部 */
        grid.innerHTML = '';
        tables.forEach((t) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'card'
            + (t.featured ? ' featured' : '')
            + (t.kind === 'sicbo' ? ' sicbo' : '')
            + (t.kind === 'roulette' ? ' roulette' : '')
            + (t.kind === 'baccarat' ? ' baccarat' : '')
            + (t.kind === 'mahjong' ? ' mahjong' : '')
            + (t.mj ? (' mj-' + t.mj) : '');
          const open = !!t.enter;
          const sub = open ? ('点击进入 · ' + t.sec + 's') : '演示桌 · 暂未开放';
          const showAhs = t.enter === 'mahjong';
          if (showAhs) btn.classList.add('has-ahs');
          btn.innerHTML =
            '<div class="thumb"></div>' +
            (showAhs ? '<button type="button" class="ahs-btn" data-ahs="1">加到主屏幕</button>' : '') +
            '<div class="meta"><div class="name">' + t.name + '</div>' +
            '<div class="sub">' + sub + '</div></div>';
          var lastGoAt = 0;
          function goCard() {
            var now = Date.now();
            if (now - lastGoAt < 450) return;
            lastGoAt = now;
            if (t.enter) enterByKey(t.enter);
            else alert('演示桌暂未开放');
          }
          btn.addEventListener('click', function (e) {
            try {
              if (e.target && e.target.closest && e.target.closest('[data-ahs]')) return;
              e.preventDefault(); e.stopPropagation();
            } catch (_) {}
            goCard();
          });
          if (showAhs) {
            var ahsBtn = btn.querySelector('[data-ahs]');
            if (ahsBtn) {
              ahsBtn.addEventListener('click', function (e) {
                try { e.preventDefault(); e.stopPropagation(); } catch (_) {}
                openAhsModal();
              });
            }
          }
          grid.appendChild(btn);
        });
      }

      /* 加到主屏幕：Android 可走安装提示；iOS 只展示步骤（系统不允许网页强制添加） */
      var deferredAhsPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        try { e.preventDefault(); } catch (_) {}
        deferredAhsPrompt = e;
      });
      function isIosLike() {
        try {
          return /iPhone|iPad|iPod/i.test(navigator.userAgent || '') ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        } catch (_) { return false; }
      }
      function openAhsModal() {
        var modal = document.getElementById('ahsModal');
        var body = document.getElementById('ahsBody');
        var doBtn = document.getElementById('ahsDo');
        if (!modal || !body || !doBtn) return;
        /* 条款同时写清 iPhone + 安卓：手机底栏没有「全屏」键，只能加到主屏幕后从图标进 */
        body.innerHTML =
          '<h4>一、iPhone（Safari）怎么全屏</h4>' +
          '<ol>' +
          '<li>用 <b>Safari</b> 打开本站。</li>' +
          '<li>看手机<b>最底下那一栏</b>：新版 Safari 中间常常<b>没有</b>旧的分享键 □↑。</li>' +
          '<li>点底栏<b>最右边</b>的 <b>···</b>（三个点）。</li>' +
          '<li>在菜单里点 <b>共享</b>。（也可先点中间地址栏 <b>forestgroup.ai</b>，再找共享。）</li>' +
          '<li>弹出分享面板后，用手指<b>往上滑</b>（下面还有一截菜单）。</li>' +
          '<li>找到 <b>添加到主屏幕</b> → 点 <b>添加</b>。</li>' +
          '<li>按 Home 或上滑回到<b>手机桌面</b>，点新出现的 <b>麻将</b> 图标进入 → 此时才是全屏、没有网址栏。</li>' +
          '</ol>' +

          '<h4>二、安卓手机（Chrome）怎么全屏</h4>' +
          '<ol>' +
          '<li>用 <b>Chrome</b>（或系统浏览器）打开本站。</li>' +
          '<li>点右上角 <b>⋮</b>（三个竖点菜单）。</li>' +
          '<li>在菜单里找并点：<b>添加到主屏幕</b> / <b>安装应用</b> / <b>添加到主屏幕</b>（不同手机文案可能略有差别）。</li>' +
          '<li>若本弹窗下方出现 <b>按系统安装</b>，也可直接点它，按系统提示确认安装。</li>' +
          '<li>回到手机桌面，点 <b>麻将</b> 图标进入 → 全屏、没有网址栏。</li>' +
          '</ol>' +

          '<h4>三、怎样才算成功</h4>' +
          '<ol>' +
          '<li>必须从<b>桌面图标</b>点进，不是从 Safari/Chrome 书签或地址栏再开一次。</li>' +
          '<li>进去后顶部/底部应看不到网址输入框；若还看得到，说明仍在浏览器标签页里，请回到桌面用图标进。</li>' +
          '</ol>';

        if (isIosLike()) {
          doBtn.textContent = '打开麻将页再按上面步骤添加';
          doBtn.onclick = function () { location.href = MAHJONG_M; };
        } else if (deferredAhsPrompt) {
          doBtn.textContent = '按系统安装（安卓）';
          doBtn.onclick = function () {
            var p = deferredAhsPrompt;
            deferredAhsPrompt = null;
            p.prompt();
            try { p.userChoice.then(function () { closeAhsModal(); }); }
            catch (_) { closeAhsModal(); }
          };
        } else {
          doBtn.textContent = '打开麻将页';
          doBtn.onclick = function () { location.href = MAHJONG_M; };
        }
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
      }
      function closeAhsModal() {
        var modal = document.getElementById('ahsModal');
        if (!modal) return;
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
      }
      (function bindAhsModal() {
        var modal = document.getElementById('ahsModal');
        var closeBtn = document.getElementById('ahsClose');
        var banner = document.getElementById('ahsBanner');
        if (closeBtn) closeBtn.addEventListener('click', closeAhsModal);
        if (banner) {
          banner.addEventListener('click', function (e) {
            try { e.preventDefault(); e.stopPropagation(); } catch (_) {}
            openAhsModal();
          });
        }
        if (modal) {
          modal.addEventListener('click', function (e) {
            if (e.target === modal) closeAhsModal();
          });
        }
      })();

      /* 分类可多开：点棋牌不收起桌面，显得项目多 */
      document.querySelectorAll('.nav-parent').forEach((el) => {
        el.addEventListener('click', () => {
          const group = el.closest('.nav-group');
          if (!group || group.classList.contains('is-empty')) return;
          group.classList.toggle('is-open');
        });
      });
      document.querySelectorAll('.nav-child').forEach((el) => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.nav-child').forEach((n) => n.classList.remove('is-on'));
          el.classList.add('is-on');
          const key = el.dataset.enter || '';
          if (key === 'soon') {
            alert((el.dataset.label || '该玩法') + ' 即将开放');
            return;
          }
          enterByKey(key);
        });
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        try {
          sessionStorage.removeItem('fg_sicbo_auth');
          sessionStorage.removeItem('fg_sicbo_user');
          sessionStorage.removeItem('fg_sicbo_profile');
        } catch (_) {}
        try {
          localStorage.removeItem('fg_sicbo_auth');
          localStorage.removeItem('fg_sicbo_user');
          localStorage.removeItem('fg_sicbo_profile');
        } catch (_) {}
        location.href = 'index.html?v=v1.0.54';
      });

      paint();
    })();
  </script>
</body>
</html>
