<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="麻将" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>单人香港麻将 · v1.1.3</title>
  <link rel="modulepreload" href="https://unpkg.com/three@0.160.0/build/three.module.js" />
  <link rel="modulepreload" href="js/mahjong-dice-3d.js?v=1.1.3" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; overscroll-behavior: none;
    }
    .app {
      position: fixed; inset: 0;
      overflow: hidden;
      background: #000;
    }
    /* 跟对标图一样大：整图完整放进屏幕，不放大裁切 */
    .table-stage {
      position: absolute;
      left: 0; top: 0;
      width: 100px; height: 100px;
      z-index: 0;
      pointer-events: none;
      perspective: 1400px;
      perspective-origin: 50% 42%;
    }
    /* 步骤1：你的原桌图不变像素；外面加真桌厚度/落影/活光 */
    .table-live {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform: translateZ(0) rotateX(1.2deg);
      transform-origin: 50% 92%;
    }
    .table-shadow {
      position: absolute;
      left: 4%; right: 4%;
      top: 10%; bottom: -3%;
      border-radius: 18px;
      background: radial-gradient(ellipse 72% 55% at 50% 62%,
        rgba(0,0,0,.55) 0%, rgba(0,0,0,.28) 42%, rgba(0,0,0,0) 72%);
      filter: blur(10px);
      transform: translateZ(-28px) scale(1.02);
      pointer-events: none;
    }
    .table-body {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      border-radius: 2px;
      box-shadow:
        0 18px 40px rgba(0,0,0,.45),
        0 4px 10px rgba(0,0,0,.35);
    }
    .scene-bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      filter: none;
      border-radius: 1px;
      transform: translateZ(0);
      background: #000;
    }
    /* 活光：扫过毡面，不改原图像素 */
    .table-sheen {
      position: absolute; inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg,
        transparent 0%,
        rgba(255,245,220,.0) 28%,
        rgba(255,250,230,.14) 46%,
        rgba(255,245,220,.0) 62%,
        transparent 100%);
      background-size: 220% 100%;
      animation: tableSheen 7.5s ease-in-out infinite;
      mix-blend-mode: soft-light;
      opacity: .85;
      transform: translateZ(1px);
    }
    @keyframes tableSheen {
      0%, 100% { background-position: 100% 0; opacity: .55; }
      50% { background-position: 0% 0; opacity: .9; }
    }
    /* 前木真实厚度 */
    .table-edge-front { display: none; }
    .wall-ring {
      position: absolute; z-index: 3;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s ease;
    }
    .wall-ring.is-on { opacity: 1; }
    .wall { position: absolute; display: flex; gap: 0; }
    /* 主手：高 11%；仍14张 */
    .wall-bot {
      left: 31.46%;
      width: 40.00%;
      top: 65.80%;
      height: 11%;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-end;
      justify-content: flex-start;
      overflow: visible;
    }

    /* 上墙：高 7%；仍13张；同 flush 图；槽宽按 7% 比例收紧贴实 */
    .wall-top {
      position: absolute;
      left: 36.36%;
      width: 27.29%;
      top: 12.80%;
      height: 7%;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-start;
      justify-content: flex-start;
      overflow: visible;
      margin: 0;
      padding: 0;
      gap: 0;
    }
    .wall-top .wall-top-strip { display: none; }
    .wall-top .wall-stack {
      position: relative;
      flex: 0 0 calc(100% / 13);
      width: calc(100% / 13);
      height: 100%;
      margin: 0;
      padding: 0;
      opacity: 0;
      transform: none;
      transition: opacity .18s ease;
    }
    .wall-top .wall-stack.is-in {
      opacity: 1;
      transform: none;
    }
    .wall-bot .wall-stack {
      position: relative;
      flex: 0 0 calc(100% / 14);
      width: calc(100% / 14);
      height: 100%;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .wall-bot .wall-stack.is-in {
      opacity: 1;
      transform: none;
    }
    /* 左墙：前离木2cm / 尾离木2.5cm；牌尺寸对齐主牌 */
    .wall-left {
      position: absolute;
      inset: 0;
      display: block;
      overflow: visible;
    }
    .wall-left .wall-left-strip { display: none; }
    .wall-left .wall-stack {
      position: absolute;
      width: 3.505%;
      height: 7.399%;
      margin: 0;
      padding: 0;
      opacity: 0;
      transform: translateY(3px);
      transform-origin: left center;
      transition: opacity .18s ease, transform .18s ease;
    }
    .wall-left .wall-stack.is-in {
      opacity: 1;
      transform: none;
    }
    .wall-stack .stack-img {
      position: absolute;
      left: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: bottom center;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      /* 外观仍用你的原图；只加落影/微厚，做出实心感 */
      filter:
        brightness(1.08)
        drop-shadow(0 1px 0 rgba(40, 22, 8, .35))
        drop-shadow(1px 2px 2px rgba(0, 0, 0, .28))
        drop-shadow(2px 4px 5px rgba(0, 0, 0, .22));
    }
    /* 对面：必须压过通用 .wall-stack .stack-img，禁止换滤镜/留空缝 */
    .wall-top .wall-stack .stack-img {
      left: 0; top: 0; bottom: auto;
      object-fit: fill;
      object-position: center top;
      filter: none;
    }
    /* 单牌现场复制上下 2 张：每张=主手牌单张尺度；上下对齐；缝≈主手牌 */
    .wall-left .stack-img {
      object-fit: contain;
      object-position: center center;
      filter: brightness(1.08);
      width: 100%;
      height: 74.6%;
      left: 0;
    }
    .wall-left .stack-img.tile-bot {
      bottom: 0;
      left: 0;
      z-index: 1;
    }
    .wall-left .stack-img.tile-top {
      bottom: 25.4%;
      left: 0;
      z-index: 2;
    }
    /* 实心底托：不改牌面像素，只垫一层暗影体积 */
    .wall-stack::after {
      content: '';
      position: absolute;
      left: 8%; right: 8%;
      bottom: 2%;
      height: 10%;
      border-radius: 40%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: -1;
      transform: translateY(2px) scaleX(1.05);
    }
    /* 左墙墩缝干净：关掉底托暗影，勿渗进墩间 */
    .wall-left .wall-stack::after {
      content: none;
      display: none;
    }
    /* 右墙：HQ 单牌现场复制 ×14×上下2 */
    .wall-right {
      position: absolute;
      inset: 0;
      display: block;
      overflow: visible;
    }
    .wall-right .wall-stack {
      position: absolute;
      width: 3.505%;
      height: 7.399%;
      margin: 0;
      padding: 0;
      opacity: 0;
      transform: translateY(3px);
      transform-origin: right center;
      transition: opacity .18s ease, transform .18s ease;
    }
    .wall-right .wall-stack.is-in {
      opacity: 1;
      transform: none;
    }
    .wall-right .stack-img {
      object-fit: contain;
      object-position: center center;
      filter: brightness(1.08);
      width: 100%;
      height: 74.6%;
      left: 0;
    }
    .wall-right .stack-img.tile-bot { bottom: 0; left: 0; z-index: 1; }
    .wall-right .stack-img.tile-top { bottom: 25.4%; left: 0; z-index: 2; }
    .wall-right .wall-stack::after {
      content: none;
      display: none;
    }
    .mj-dice3d-layer {
      position: absolute;
      z-index: 12;
      left: 50%;
      top: 46%;
      width: 42%;
      height: 42%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      overflow: visible;
    }
    .mj-dice3d-layer.is-on {
      opacity: 1;
      visibility: visible;
    }
    #mjDice3dCanvas {
      width: 100%; height: 100%;
      display: block;
      border: 0;
      background: transparent !important;
    }
    /* 中央出牌计时器：对标公司体量（约桌高7.6%直径）；桌心；格闪+数字 */
    .turn-timer {
      position: absolute;
      left: 50%;
      top: 47.6%; /* 透视下几何中心偏近，略往对面移一点 */
      /* 横桌用高度定直径，避免按宽%显得过大；≈对标公司圆盘 */
      height: 7.6%;
      width: auto;
      aspect-ratio: 1;
      z-index: 6;
      transform: translate(-50%, -50%) rotateX(28deg);
      transform-origin: 50% 50%;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.55)) drop-shadow(0 2px 2px rgba(0,0,0,.4));
      transition: opacity .28s ease;
    }
    .turn-timer.is-on {
      opacity: 1;
      visibility: visible;
    }
    .turn-timer svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .turn-timer .seg {
      stroke: #0a0a0a;
      stroke-width: 2.2;
      stroke-linejoin: round;
      transition: fill .18s ease, filter .18s ease;
      filter: drop-shadow(0 1px 0 rgba(255,220,140,.12));
    }
    .turn-timer .seg.is-idle {
      fill: #6b4a2a;
    }
    .turn-timer .seg.is-hot {
      fill: #f0c23a;
      filter: drop-shadow(0 0 3px rgba(255,200,60,.55));
      animation: turnSegPulse .9s ease-in-out infinite;
    }
    .turn-timer .seg.is-gone {
      fill: #3a2818;
    }
    .turn-timer .hub {
      fill: #0b0b0b;
      stroke: #050505;
      stroke-width: 2.4;
    }
    .turn-timer .turn-num {
      fill: #f6d56a;
      font-family: "DIN Alternate", "Avenir Next Condensed", "PingFang SC", sans-serif;
      font-weight: 700;
      font-size: 28px;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: -0.02em;
      paint-order: stroke fill;
      stroke: rgba(0,0,0,.75);
      stroke-width: 1.6;
      animation: turnNumPulse .9s ease-in-out infinite;
    }
    @keyframes turnSegPulse {
      0%, 100% { fill: #f0c23a; filter: drop-shadow(0 0 2px rgba(255,200,60,.4)); }
      50% { fill: #ffe27a; filter: drop-shadow(0 0 5px rgba(255,220,90,.75)); }
    }
    @keyframes turnNumPulse {
      0%, 100% { opacity: .92; }
      50% { opacity: 1; }
    }
    .turn-toast {
      position: absolute;
      left: 50%;
      top: 58%;
      z-index: 8;
      transform: translate(-50%, -50%);
      padding: .45em 1.1em;
      border-radius: 999px;
      background: rgba(8,12,18,.78);
      border: 1px solid rgba(212,175,90,.55);
      color: #f3e2a8;
      font: 600 13px/1.2 "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: .04em;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .25s ease;
      white-space: nowrap;
    }
    .turn-toast.is-on { opacity: 1; visibility: visible; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="table-stage" id="tableStage">
      <div class="table-live" id="tableLive">
        <div class="table-shadow" aria-hidden="true"></div>
        <div class="table-body">
          <!-- 原桌图只引用、不改像素 -->
          <img class="scene-bg" src="assets/mahjong/table-empty-clean-v15.png?v=1.1.3" alt="" draggable="false" />
          <div class="table-sheen" aria-hidden="true"></div>
          <div class="table-edge-front" aria-hidden="true"></div>
        </div>
      </div>
      <div class="wall-ring" id="wallRing">
        <div class="wall wall-left" id="wallLeftVis"></div>
        <div class="wall wall-top" id="wallTopVis"></div>
        <div class="wall wall-right" id="wallRightVis"></div>
        <div class="wall wall-bot" id="wallBot"></div>
      </div>
      <div class="turn-timer" id="turnTimer" aria-hidden="true"></div>
      <div class="turn-toast" id="turnToast" aria-hidden="true">系统自动出牌</div>
      <div class="mj-dice3d-layer" id="mjDice3dLayer" aria-hidden="true">
        <canvas id="mjDice3dCanvas" width="640" height="640" data-lite="1" aria-hidden="true"></canvas>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/mahjong-dice-3d.js?v=1.1.3"></script>
  <script>
  (function () {
    const V = '1.1.3';
    /* 1.1.3：沿用1.1.2墙；桌心10秒计时器（对标体量/略上移/数字倒计时）定版 */
    const STEP1_FLAT_TABLE_ONLY = false;
    const STEP2_SOLID_TILES = false;
    const WALL_STACK = 'assets/mahjong/tiles/wall-bot-stack-101.webp?v=1.1.3';
    const WALL_LEFT_ONE = 'assets/mahjong/tiles/wall-left-one.webp?v=1.1.3';
    const WALL_RIGHT_ONE = 'assets/mahjong/tiles/wall-right-one.webp?v=1.1.3';
    const WALL_TOP_ONE = 'assets/mahjong/tiles/wall-top-one-flush.webp?v=1.1.3';
    const TURN_SECS = 10;
    const WALL_BOT_STACKS = 14;
    const WALL_LEFT_STACKS = 13;
    const WALL_RIGHT_STACKS = 14;
    const WALL_TOP_STACKS = 13;
    const TABLE_AR = 2048 / 944;
    /* 左墙：近大远小（近=现尺寸，远=0.8）；离木位置不变 */
    const LEFT_POS = [
      [27.16, 18.8, 2.804, 5.919], [26.43, 21.98, 2.862, 6.042], [25.89, 25.17, 2.921, 6.166], [25.16, 28.36, 2.979, 6.289],
      [24.47, 31.54, 3.038, 6.412], [23.89, 34.73, 3.096, 6.536], [23.2, 37.91, 3.154, 6.659], [22.57, 41.09, 3.213, 6.782],
      [21.93, 44.28, 3.271, 6.906], [21.3, 47.47, 3.33, 7.029], [20.66, 50.65, 3.388, 7.152], [20.03, 53.83, 3.447, 7.276],
      [19.35, 57.02, 3.505, 7.399]
    ];
    /* 右墙：近大远小（近=现尺寸，远=0.8）；右缘不动 */
    const RIGHT_POS = [
      [74.41, 18.5, 2.804, 5.919], [74.93, 21.46, 2.858, 6.033], [75.45, 24.43, 2.912, 6.147], [75.98, 27.39, 2.966, 6.261],
      [76.5, 30.35, 3.02, 6.374], [77.02, 33.32, 3.074, 6.488], [77.56, 36.28, 3.128, 6.602], [78.07, 39.24, 3.181, 6.716],
      [78.6, 42.2, 3.235, 6.83], [79.13, 45.17, 3.289, 6.944], [79.64, 48.13, 3.343, 7.057], [80.17, 51.09, 3.397, 7.171],
      [80.7, 54.06, 3.451, 7.285], [81.22, 57.02, 3.505, 7.399]
    ];

    function sleep(ms) {
      return new Promise(function (r) { setTimeout(r, ms); });
    }
    async function waitMahjongDice3D(ms) {
      const t0 = Date.now();
      while (!(window.MahjongDice3D && window.MahjongDice3D.ready) && Date.now() - t0 < (ms || 2500)) {
        await sleep(50);
      }
      return !!(window.MahjongDice3D && window.MahjongDice3D.ready);
    }
    function el(id) { return document.getElementById(id); }

    /* contain：整图跟对标一样完整进屏，不放大裁边 */
    function layoutTable() {
      const app = el('app');
      const stage = el('tableStage');
      if (!app || !stage) return;
      const W = app.clientWidth || window.innerWidth;
      const H = app.clientHeight || window.innerHeight;
      var w, h;
      if (W / H > TABLE_AR) {
        h = H;
        w = H * TABLE_AR;
      } else {
        w = W;
        h = W / TABLE_AR;
      }
      stage.style.width = Math.round(w) + 'px';
      stage.style.height = Math.round(h) + 'px';
      stage.style.left = Math.round((W - w) / 2) + 'px';
      stage.style.top = Math.round((H - h) / 2) + 'px';
    }

    function makeStackEl(src) {
      const s = document.createElement('div');
      s.className = 'wall-stack';
      const img = document.createElement('img');
      img.className = 'stack-img';
      img.src = src;
      img.alt = '';
      img.draggable = false;
      s.appendChild(img);
      return s;
    }

    /* 左墙：同一张 HQ 单牌复制两张（下+上，左右对齐），禁止死双层图 */
    function makeLeftLiveStackEl(src) {
      const s = document.createElement('div');
      s.className = 'wall-stack';
      const bot = document.createElement('img');
      bot.className = 'stack-img tile-bot';
      bot.src = src;
      bot.alt = '';
      bot.draggable = false;
      const top = document.createElement('img');
      top.className = 'stack-img tile-top';
      top.src = src;
      top.alt = '';
      top.draggable = false;
      s.appendChild(bot);
      s.appendChild(top);
      return s;
    }

    function prepareWall() {
      const bot = el('wallBot');
      const left = el('wallLeftVis');
      const right = el('wallRightVis');
      const ring = el('wallRing');
      if (!ring) return;
      if (bot) {
        bot.innerHTML = '';
        for (var i = 0; i < WALL_BOT_STACKS; i++) bot.appendChild(makeStackEl(WALL_STACK));
      }
      if (left) {
        left.innerHTML = '';
        for (var j = 0; j < WALL_LEFT_STACKS; j++) {
          var st = makeLeftLiveStackEl(WALL_LEFT_ONE);
          var pos = LEFT_POS[j] || LEFT_POS[LEFT_POS.length - 1];
          st.style.left = pos[0] + '%';
          st.style.top = pos[1] + '%';
          if (pos[2]) st.style.width = pos[2] + '%';
          if (pos[3]) st.style.height = pos[3] + '%';
          st.style.zIndex = String(j + 1);
          left.appendChild(st);
        }
      }
      if (right) {
        right.innerHTML = '';
        for (var k = 0; k < WALL_RIGHT_STACKS; k++) {
          var rst = makeLeftLiveStackEl(WALL_RIGHT_ONE);
          var rpos = RIGHT_POS[k] || RIGHT_POS[RIGHT_POS.length - 1];
          rst.style.left = rpos[0] + '%';
          rst.style.top = rpos[1] + '%';
          if (rpos[2]) rst.style.width = rpos[2] + '%';
          if (rpos[3]) rst.style.height = rpos[3] + '%';
          rst.style.zIndex = String(k + 1);
          right.appendChild(rst);
        }
      }
      var top = el('wallTopVis');
      if (top) {
        top.innerHTML = '';
        for (var t = 0; t < WALL_TOP_STACKS; t++) top.appendChild(makeStackEl(WALL_TOP_ONE));
      }
      ring.classList.remove('is-on');
    }

    async function revealWall() {
      const ring = el('wallRing');
      if (!ring) return;
      ring.classList.add('is-on');
      const stacks = ring.querySelectorAll('.wall-stack');
      for (var i = 0; i < stacks.length; i++) {
        stacks[i].classList.add('is-in');
        if (i % 2 === 0) await sleep(28);
      }
    }

    function hideDice() {
      try {
        if (window.MahjongDice3D && window.MahjongDice3D.hide) window.MahjongDice3D.hide();
      } catch (_) {}
      const layer = el('mjDice3dLayer');
      if (!layer) return;
      layer.classList.remove('is-on');
      layer.setAttribute('aria-hidden', 'true');
    }

    async function playDiceToss() {
      var a = 1 + Math.floor(Math.random() * 6);
      var b = 1 + Math.floor(Math.random() * 6);
      var ok = await waitMahjongDice3D(2500);
      if (ok) {
        try { await window.MahjongDice3D.play([a, b]); }
        catch (_) { await sleep(800); }
      } else {
        await sleep(800);
      }
      await sleep(900);
    }

    /* —— 中央 10 格计时器 —— */
    var turnTimerState = {
      segs: [],
      numEl: null,
      left: TURN_SECS,
      tickId: 0,
      running: false,
      onTimeout: null
    };

    function polar(cx, cy, r, a) {
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    }
    function segPath(i, n, cx, cy, r0, r1, gap) {
      var step = (Math.PI * 2) / n;
      var a0 = -Math.PI / 2 + i * step + gap / 2;
      var a1 = -Math.PI / 2 + (i + 1) * step - gap / 2;
      var p0 = polar(cx, cy, r1, a0);
      var p1 = polar(cx, cy, r1, a1);
      var p2 = polar(cx, cy, r0, a1);
      var p3 = polar(cx, cy, r0, a0);
      var large = (a1 - a0) > Math.PI ? 1 : 0;
      return 'M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
        ' A' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
        ' L' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) +
        ' A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + p3[0].toFixed(2) + ' ' + p3[1].toFixed(2) +
        ' Z';
    }
    function buildTurnTimer() {
      var host = el('turnTimer');
      if (!host) return;
      host.innerHTML = '';
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('aria-hidden', 'true');
      var n = TURN_SECS;
      var segs = [];
      for (var i = 0; i < n; i++) {
        var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', segPath(i, n, 50, 50, 28, 46.5, 0.07));
        p.setAttribute('class', 'seg is-idle');
        svg.appendChild(p);
        segs.push(p);
      }
      var hub = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      hub.setAttribute('cx', '50');
      hub.setAttribute('cy', '50');
      hub.setAttribute('r', '22');
      hub.setAttribute('class', 'hub');
      svg.appendChild(hub);
      var num = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      num.setAttribute('x', '50');
      num.setAttribute('y', '51');
      num.setAttribute('class', 'turn-num');
      num.textContent = String(TURN_SECS);
      svg.appendChild(num);
      host.appendChild(svg);
      turnTimerState.segs = segs;
      turnTimerState.numEl = num;
    }
    function paintTurnTimer() {
      var left = turnTimerState.left;
      var segs = turnTimerState.segs;
      for (var i = 0; i < segs.length; i++) {
        var seg = segs[i];
        seg.classList.remove('is-hot', 'is-idle', 'is-gone');
        if (i < left) {
          /* 剩余秒：当前秒最亮并闪，其余暖棕 */
          seg.classList.add(i === left - 1 ? 'is-hot' : 'is-idle');
        } else {
          seg.classList.add('is-gone');
        }
      }
      if (turnTimerState.numEl) {
        turnTimerState.numEl.textContent = String(Math.max(0, left));
      }
    }
    function showTurnToast(msg) {
      var t = el('turnToast');
      if (!t) return;
      if (msg) t.textContent = msg;
      t.classList.add('is-on');
      t.setAttribute('aria-hidden', 'false');
      clearTimeout(showTurnToast._id);
      showTurnToast._id = setTimeout(function () {
        t.classList.remove('is-on');
        t.setAttribute('aria-hidden', 'true');
      }, 1400);
    }
    function stopTurnTimer() {
      turnTimerState.running = false;
      if (turnTimerState.tickId) {
        clearInterval(turnTimerState.tickId);
        turnTimerState.tickId = 0;
      }
    }
    function hideTurnTimer() {
      stopTurnTimer();
      var host = el('turnTimer');
      if (!host) return;
      host.classList.remove('is-on');
      host.setAttribute('aria-hidden', 'true');
    }
    /* 选手手动出牌后调用，打断倒计时 */
    function playerDidDiscard() {
      stopTurnTimer();
      hideTurnTimer();
    }
    /* 超时：系统代打（手牌未接前先 toast + 钩子；接上手牌后在此打一张） */
    function systemAutoDiscard() {
      showTurnToast('系统自动出牌');
      try {
        if (typeof window.onMahjongAutoDiscard === 'function') {
          window.onMahjongAutoDiscard();
        }
      } catch (_) {}
      /* 暂无手牌：演示再开一轮 10 秒，接上手牌后改为进入下一玩家 */
      setTimeout(function () { startTurnTimer(); }, 900);
    }
    function startTurnTimer(onTimeout) {
      buildTurnTimer();
      stopTurnTimer();
      turnTimerState.left = TURN_SECS;
      turnTimerState.onTimeout = onTimeout || systemAutoDiscard;
      turnTimerState.running = true;
      var host = el('turnTimer');
      if (host) {
        host.classList.add('is-on');
        host.setAttribute('aria-hidden', 'false');
      }
      paintTurnTimer();
      turnTimerState.tickId = setInterval(function () {
        if (!turnTimerState.running) return;
        turnTimerState.left -= 1;
        if (turnTimerState.left <= 0) {
          turnTimerState.left = 0;
          paintTurnTimer();
          stopTurnTimer();
          hideTurnTimer();
          var fn = turnTimerState.onTimeout;
          turnTimerState.onTimeout = null;
          if (fn) fn();
          return;
        }
        paintTurnTimer();
      }, 1000);
    }
    window.MahjongTurnTimer = {
      start: startTurnTimer,
      stop: stopTurnTimer,
      hide: hideTurnTimer,
      playerDidDiscard: playerDidDiscard
    };

    async function boot() {
      hideDice();
      hideTurnTimer();
      if (STEP1_FLAT_TABLE_ONLY) {
        var ring = el('wallRing');
        if (ring) {
          ring.classList.remove('is-on');
          ring.innerHTML = '';
        }
        return;
      }
      prepareWall();
      if (STEP2_SOLID_TILES) {
        /* 步骤2只验实心墩，不摇骰 */
        await revealWall();
        return;
      }
      await playDiceToss();
      await revealWall();
      hideDice();
      /* 本步：墙出齐后开始 10 秒出牌倒计时（演示）；真正出牌回合后接选手手牌 */
      startTurnTimer();
    }

    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function () {});
      }
    } catch (_) {}

    window.addEventListener('resize', layoutTable);
    window.addEventListener('orientationchange', function () {
      setTimeout(layoutTable, 120);
    });

    layoutTable();
    boot();
    try { console.info('[mahjong-m]', V); } catch (_) {}
  })();
  </script>
</body>
</html>
