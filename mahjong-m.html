<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#1a2a22" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="麻将" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <link rel="manifest" href="assets/mahjong/manifest.webmanifest?v=1.2.5" />
  <link rel="apple-touch-icon" href="assets/mahjong/pwa/apple-touch-icon-180.png" />
  <title>单人香港麻将 · v1.2.5</title>
  <link rel="modulepreload" href="https://unpkg.com/three@0.160.0/build/three.module.js" />
  <link rel="modulepreload" href="js/mahjong-dice-3d.js?v=1.2.5" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #1a2a22;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; overscroll-behavior: none;
    }
    .app {
      position: fixed; inset: 0;
      overflow: hidden;
      background: #1a2a22;
    }
    /* 强制横屏根：竖持机时整页旋转成横桌，禁止竖屏窄条布局来回跳 */
    .orient-root {
      position: absolute;
      left: 0; top: 0;
      overflow: hidden;
      background: #1a2a22;
      transform-origin: top left;
    }
    /* 黑边新办法：舞台外地板 cover 填缝；舞台本身 contain 不裁主牌 */
    .floor-bleed {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: url("assets/mahjong/table-empty-clean-v15.png?v=1.2.5") center center / cover no-repeat;
    }
    /* contain：整桌进屏，不裁上下（主牌不被挡） */
    .table-stage {
      position: absolute;
      left: 0; top: 0;
      width: 100px; height: 100px;
      z-index: 1;
      pointer-events: none;
      overflow: visible;
      perspective: 1400px;
      perspective-origin: 50% 42%;
    }
    /* 步骤1：你的原桌图不变像素；外面加真桌厚度/落影/活光 */
    .table-live {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform: translateZ(0) rotateX(1.2deg);
      transform-origin: 50% 92%;
    }
    .table-shadow {
      position: absolute;
      left: 4%; right: 4%;
      top: 10%; bottom: -3%;
      border-radius: 18px;
      background: radial-gradient(ellipse 72% 55% at 50% 62%,
        rgba(0,0,0,.55) 0%, rgba(0,0,0,.28) 42%, rgba(0,0,0,0) 72%);
      filter: blur(10px);
      transform: translateZ(-28px) scale(1.02);
      pointer-events: none;
    }
    .table-body {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      border-radius: 2px;
      box-shadow:
        0 18px 40px rgba(0,0,0,.45),
        0 4px 10px rgba(0,0,0,.35);
    }
    .scene-bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      filter: none;
      border-radius: 1px;
      transform: translateZ(0);
      background: transparent;
    }
    /* 活光：扫过毡面，不改原图像素 */
    .table-sheen {
      position: absolute; inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg,
        transparent 0%,
        rgba(255,245,220,.0) 28%,
        rgba(255,250,230,.14) 46%,
        rgba(255,245,220,.0) 62%,
        transparent 100%);
      background-size: 220% 100%;
      animation: tableSheen 7.5s ease-in-out infinite;
      mix-blend-mode: soft-light;
      opacity: .85;
      transform: translateZ(1px);
    }
    @keyframes tableSheen {
      0%, 100% { background-position: 100% 0; opacity: .55; }
      50% { background-position: 0% 0; opacity: .9; }
    }
    /* 前木真实厚度 */
    .table-edge-front { display: none; }
    .wall-ring {
      position: absolute; z-index: 3;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s ease;
    }
    .wall-ring.is-on { opacity: 1; }
    .wall { position: absolute; display: flex; gap: 0; }
    /* 主手趴牌墙：17 摞 */
    .wall-bot {
      left: 27.5%;
      width: 47.5%;
      top: 65.80%;
      height: 11%;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-end;
      justify-content: flex-start;
      overflow: visible;
    }

    /* 上墙：17 摞 */
    .wall-top {
      position: absolute;
      left: 32.2%;
      width: 35.6%;
      top: 12.80%;
      height: 7%;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-start;
      justify-content: flex-start;
      overflow: visible;
      margin: 0;
      padding: 0;
      gap: 0;
    }
    .wall-top .wall-top-strip { display: none; }
    .wall-top .wall-stack {
      position: relative;
      flex: 0 0 calc(100% / 17);
      width: calc(100% / 17);
      height: 100%;
      margin: 0;
      padding: 0;
      opacity: 0;
      transform: none;
      transition: opacity .18s ease;
    }
    .wall-top .wall-stack.is-in {
      opacity: 1;
      transform: none;
    }
    .wall-bot .wall-stack {
      position: relative;
      flex: 0 0 calc(100% / 17);
      width: calc(100% / 17);
      height: 100%;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .wall-bot .wall-stack.is-in {
      opacity: 1;
      transform: none;
    }
    /* 左墙趴牌：与右墙同款双层墩，不动 */
    .wall-left {
      position: absolute;
      inset: 0;
      display: block;
      overflow: visible;
      z-index: 3;
    }
    .wall-left .wall-left-strip { display: none !important; }
    .wall-left .wall-stack {
      position: absolute;
      margin: 0;
      padding: 0;
      opacity: 0;
      transform: translateY(3px);
      transform-origin: left center;
      transition: opacity .18s ease, transform .18s ease;
    }
    .wall-left .wall-stack.is-in {
      opacity: 1;
      transform: none;
    }
    .wall-left .stack-img {
      position: absolute;
      object-fit: contain;
      object-position: center center;
      filter: brightness(1.08);
      width: 100%;
      height: 74.6%;
      left: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .wall-left .stack-img.tile-bot { bottom: 0; left: 0; z-index: 1; display: block !important; }
    .wall-left .stack-img.tile-top { bottom: 25.4%; left: 0; z-index: 2; display: block !important; }
    .wall-left .stack-img.tile-single { display: none !important; }

    /* —— 四家手牌立排（飞落后） —— */
    .hand-ring {
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
    }
    .hand {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 三家立背；主位超大正面条（对标公司底排） */
    /* 主位：间距再减 1mm；高 +3mm，宽按牌面比例约 +2.24mm */
    .hand-bot {
      left: 7%;
      width: 86%;
      /* 试看：整排相对原位上移 5mm */
      bottom: calc(-1.8% + 5mm);
      height: calc(16.8% + 3mm);
      flex-direction: row;
      align-items: flex-end;
      justify-content: center;
      gap: max(0px, calc(0.35% - 1mm));
      z-index: 12;
    }
    /* 三家立背：贴各自木沿（只换立牌图+定位，不动主位） */
    .hand-top {
      left: 26%;
      width: 48%;
      top: calc(0.4% + 3mm);
      height: 9.4%;
      flex-direction: row;
      align-items: flex-end;
      justify-content: center;
      gap: 0.12%;
      z-index: 11;
    }
    .hand-top .hand-tile + .hand-tile {
      margin-left: -1mm; /* 对面间距：-2mm 后再加大 1mm */
    }
    /* 左/右：13/14 张立在侧木上成一排；长边紧挨；绿面朝桌心（禁 stand-edge 冲天竖图）
       尺寸=对面像素换轴：立高 9.4%×944→width；沿木 48%×2048→height */
    .hand-left {
      /* 整列跟左木条同斜（rail≈22.7°）；左缘为轴，不拧单张四角 */
      left: 17.2%;
      width: calc(0.094 * 944 / 2048 * 100%);
      height: calc(0.48 * 2048 / 944 * 100%);
      top: calc((100% - 0.48 * 2048 / 944 * 100%) / 2);
      flex-direction: column; /* 一排沿左侧木条 */
      align-items: flex-start; /* 脚贴左木 */
      justify-content: center;
      gap: 0;
      z-index: 11;
      transform-origin: left center;
      transform: rotate(22.676deg);
      overflow: visible;
    }
    .hand-right {
      right: 8.1%;
      width: calc(0.094 * 944 / 2048 * 100%);
      height: calc(0.48 * 2048 / 944 * 100%);
      top: calc((100% - 0.48 * 2048 / 944 * 100%) / 2);
      flex-direction: column; /* 一排沿右侧木条 */
      align-items: flex-end; /* 脚贴右木 */
      justify-content: center;
      gap: 0;
      z-index: 11;
      transform: none;
      overflow: visible;
    }
    .hand-tile {
      display: block;
      object-fit: contain;
      object-position: center bottom;
      filter: brightness(1.06);
      opacity: 0;
      transform: translateY(6px) scale(.92);
      transition: opacity .16s ease, transform .16s ease;
    }
    .hand-tile.is-up {
      opacity: 1;
      transform: none;
    }
    /* 单张：长边紧挨（-1mm）；绿朝桌心靠 wood-stand 贴图 */
    .hand-left .hand-tile {
      width: 100%;
      height: calc(100% / 13);
      flex: 0 0 auto;
      object-fit: contain;
      object-position: left center;
      filter: drop-shadow(1px 3px 4px rgba(0,0,0,.45)) brightness(1.05);
      transform: translateX(-2px) scale(.92);
    }
    .hand-left .hand-tile.is-up { transform: none; }
    .hand-right .hand-tile {
      width: 100%;
      height: calc(100% / 14);
      flex: 0 0 auto;
      object-fit: contain;
      object-position: right center;
      filter: drop-shadow(-1px 3px 4px rgba(0,0,0,.45)) brightness(1.05);
      transform: translateX(2px) scale(.92);
    }
    .hand-right .hand-tile.is-up { transform: none; }
    .hand-left .hand-tile + .hand-tile,
    .hand-right .hand-tile + .hand-tile {
      margin-top: -1mm; /* 长边紧挨，对标对面 margin-left:-1mm */
      margin-left: 0;
    }
    .hand-top .hand-tile {
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)) brightness(1.05);
    }
    .hand-bot .hand-tile {
      width: calc(100% / 14 + 2.24mm);
      height: 100%;
      flex: 0 0 auto;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.4)) brightness(1.04);
    }
    /* 主位牌缝：在 -3mm 基础上再加 2mm → -1mm（只动间距） */
    .hand-bot .hand-tile + .hand-tile {
      margin-left: -1mm;
    }
    .hand-top .hand-tile {
      width: calc(100% / 13);
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
    }
    .wall-stack.is-taken {
      opacity: 0 !important;
      visibility: hidden;
      pointer-events: none;
    }
    /* 墩只剩 1 张：下/上墙裁掉上层；左/右靠隐藏 .tile-top */
    .wall-bot .wall-stack.is-half .stack-img,
    .wall-top .wall-stack.is-half .stack-img {
      clip-path: inset(48% 0 0 0);
      -webkit-clip-path: inset(48% 0 0 0);
    }
    .wall-left .wall-stack.is-half .stack-img.tile-top,
    .wall-right .wall-stack.is-half .stack-img.tile-top {
      display: none !important;
    }
    .deal-fly-layer {
      position: absolute;
      inset: 0;
      z-index: 16;
      pointer-events: none;
      overflow: visible;
    }
    .deal-fly {
      position: absolute;
      left: 0; top: 0;
      width: 28px; height: 38px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.45));
      will-change: transform, left, top;
      transition: left .28s cubic-bezier(.2,.75,.25,1), top .28s cubic-bezier(.2,.75,.25,1), transform .28s ease;
      z-index: 17;
    }
    .wall-stack .stack-img {
      position: absolute;
      left: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: bottom center;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      /* 外观仍用你的原图；只加落影/微厚，做出实心感 */
      filter:
        brightness(1.08)
        drop-shadow(0 1px 0 rgba(40, 22, 8, .35))
        drop-shadow(1px 2px 2px rgba(0, 0, 0, .28))
        drop-shadow(2px 4px 5px rgba(0, 0, 0, .22));
    }
    /* 对面：必须压过通用 .wall-stack .stack-img，禁止换滤镜/留空缝 */
    .wall-top .wall-stack .stack-img {
      left: 0; top: 0; bottom: auto;
      object-fit: fill;
      object-position: center top;
      filter: none;
    }
    /* 实心底托：不改牌面像素，只垫一层暗影体积 */
    .wall-stack::after {
      content: '';
      position: absolute;
      left: 8%; right: 8%;
      bottom: 2%;
      height: 10%;
      border-radius: 40%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: -1;
      transform: translateY(2px) scaleX(1.05);
    }
    /* 左墙墩缝干净：关掉底托暗影，勿渗进墩间 */
    .wall-left .wall-stack::after {
      content: none;
      display: none;
    }
    /* 右墙：HQ 单牌现场复制 ×14×上下2 */
    .wall-right {
      position: absolute;
      inset: 0;
      display: block;
      overflow: visible;
    }
    .wall-right .wall-stack {
      position: absolute;
      width: 3.505%;
      height: 7.399%;
      margin: 0;
      padding: 0;
      opacity: 0;
      transform: translateY(3px);
      transform-origin: right center;
      transition: opacity .18s ease, transform .18s ease;
    }
    .wall-right .wall-stack.is-in {
      opacity: 1;
      transform: none;
    }
    .wall-right .stack-img {
      object-fit: contain;
      object-position: center center;
      filter: brightness(1.08);
      width: 100%;
      height: 74.6%;
      left: 0;
    }
    .wall-right .stack-img.tile-bot { bottom: 0; left: 0; z-index: 1; }
    .wall-right .stack-img.tile-top { bottom: 25.4%; left: 0; z-index: 2; }
    .wall-right .wall-stack::after {
      content: none;
      display: none;
    }
    .mj-dice3d-layer {
      position: absolute;
      z-index: 12;
      left: 50%;
      top: 46%;
      /* 骰子视觉放大一倍：画布 84%（=42%×2）；滚动程序不动 DIE=0.36 */
      width: 84%;
      height: 84%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      overflow: visible;
    }
    .mj-dice3d-layer.is-on {
      opacity: 1;
      visibility: visible;
    }
    #mjDice3dCanvas {
      width: 100%; height: 100%;
      display: block;
      border: 0;
      background: transparent !important;
    }
    /* 中央出牌计时器：对标公司体量（约桌高7.6%直径）；桌心；格闪+数字 */
    .turn-timer {
      position: absolute;
      left: 50%;
      top: 47.6%; /* 透视下几何中心偏近，略往对面移一点 */
      /* 横桌用高度定直径，避免按宽%显得过大；≈对标公司圆盘 */
      height: 7.6%;
      width: auto;
      aspect-ratio: 1;
      z-index: 6;
      transform: translate(-50%, -50%) rotateX(28deg);
      transform-origin: 50% 50%;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.55)) drop-shadow(0 2px 2px rgba(0,0,0,.4));
      transition: opacity .28s ease;
    }
    .turn-timer.is-on {
      opacity: 1;
      visibility: visible;
    }
    .turn-timer svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .turn-timer .seg {
      stroke: #0a0a0a;
      stroke-width: 2.2;
      stroke-linejoin: round;
      transition: fill .18s ease, filter .18s ease;
      filter: drop-shadow(0 1px 0 rgba(255,220,140,.12));
    }
    .turn-timer .seg.is-idle {
      fill: #6b4a2a;
    }
    .turn-timer .seg.is-hot {
      fill: #f0c23a;
      filter: drop-shadow(0 0 3px rgba(255,200,60,.55));
      animation: turnSegPulse .9s ease-in-out infinite;
    }
    .turn-timer .seg.is-gone {
      fill: #3a2818;
    }
    .turn-timer .hub {
      fill: #0b0b0b;
      stroke: #050505;
      stroke-width: 2.4;
    }
    .turn-timer .turn-num {
      fill: #f6d56a;
      font-family: "DIN Alternate", "Avenir Next Condensed", "PingFang SC", sans-serif;
      font-weight: 700;
      /* 加大并上下顶满木圈内沿（hub r=25→直径50；字身≈不穿出） */
      font-size: 68px;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: -0.02em;
      paint-order: stroke fill;
      stroke: rgba(0,0,0,.75);
      stroke-width: 1.2;
      animation: turnNumPulse .9s ease-in-out infinite;
    }
    @keyframes turnSegPulse {
      0%, 100% { fill: #f0c23a; filter: drop-shadow(0 0 2px rgba(255,200,60,.4)); }
      50% { fill: #ffe27a; filter: drop-shadow(0 0 5px rgba(255,220,90,.75)); }
    }
    @keyframes turnNumPulse {
      0%, 100% { opacity: .92; }
      50% { opacity: 1; }
    }
    /* 「系统自动出牌」暂去掉 */
    .turn-toast { display: none !important; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="orient-root" id="orientRoot">
      <div class="floor-bleed" id="floorBleed" aria-hidden="true"></div>
      <div class="table-stage" id="tableStage">
        <div class="table-live" id="tableLive">
          <div class="table-shadow" aria-hidden="true"></div>
          <div class="table-body">
            <!-- 原桌图只引用、不改像素 -->
            <img class="scene-bg" src="assets/mahjong/table-empty-clean-v15.png?v=1.2.5" alt="" draggable="false" />
            <div class="table-sheen" aria-hidden="true"></div>
            <div class="table-edge-front" aria-hidden="true"></div>
          </div>
        </div>
        <div class="wall-ring" id="wallRing">
          <div class="wall wall-left" id="wallLeftVis"></div>
          <div class="wall wall-top" id="wallTopVis"></div>
          <div class="wall wall-right" id="wallRightVis"></div>
          <div class="wall wall-bot" id="wallBot"></div>
        </div>
        <div class="hand-ring" id="handRing" aria-hidden="true">
          <div class="hand hand-bot" id="handBot"></div>
          <div class="hand hand-left" id="handLeft"></div>
          <div class="hand hand-top" id="handTop"></div>
          <div class="hand hand-right" id="handRight"></div>
        </div>
        <div class="deal-fly-layer" id="dealFlyLayer" aria-hidden="true"></div>
        <div class="turn-timer" id="turnTimer" aria-hidden="true"></div>
        <div class="turn-toast" id="turnToast" aria-hidden="true">系统自动出牌</div>
        <div class="mj-dice3d-layer" id="mjDice3dLayer" aria-hidden="true">
          <canvas id="mjDice3dCanvas" width="640" height="640" data-lite="1" aria-hidden="true"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/mahjong-dice-3d.js?v=1.2.5"></script>
  <script>
  (function () {
    const V = '1.2.5';
    /* 1.1.5：主位试飞 5 张立体正脸成品（s7/p9/s4/ww/s1）；飞中立体壳→正脸；三家仍立背 */
    const STEP1_FLAT_TABLE_ONLY = false;
    const STEP2_SOLID_TILES = false;
    const WALL_STACK = 'assets/mahjong/tiles/wall-bot-stack-101.webp?v=1.2.5';
    const WALL_LEFT_FLAT = 'assets/mahjong/tiles/wall-left-one.webp?v=1.2.5';
    const WALL_RIGHT_ONE = 'assets/mahjong/tiles/wall-right-one.webp?v=1.2.5';
    const WALL_TOP_ONE = 'assets/mahjong/tiles/wall-top-one-flush.webp?v=1.2.5';
    const HAND_BOT = 'assets/mahjong/tiles/hand-bot-stand-one.webp?v=1.2.5';

      remain -= 1;
      stack.setAttribute('data-remain', String(remain));

    function flyOneTile(tileEntry, seat, faceId) {
      return new Promise(function (resolve) {
        var stage = el('tableStage');

        var handHost = el(HAND_HOST[seat]);
        var fromStack = consumeWallTile(tileEntry);
        if (!stage || !layer || !fromStack || !handHost) {
          resolve();
          return;
        }
        var sb = stageBox();
        var fr = nodeBox(fromStack);
        var handTile = appendHandTile(seat, faceId);
        if (!handTile) {
          resolve();
          return;
        }
        var tr = nodeBox(handTile) || nodeBox(handHost);
        if (!fr || !tr) {
          handTile.classList.add('is-up');
          resolve();
          return;
        }
        var fw = Math.max(12, fr.width * 0.9);
        var fh = Math.max(16, fr.height * 0.55);
        var fly = document.createElement('img');
        fly.className = 'deal-fly';
        fly.alt = '';
        fly.draggable = false;

        fly.style.height = fh + 'px';
        fly.style.left = (fr.left - sb.left) + 'px';
        fly.style.top = (fr.top - sb.top) + 'px';
        fly.style.transform = 'rotate(' + (-35 + Math.random() * 70) + 'deg) scale(0.92)';
        layer.appendChild(fly);

        var tw = Math.max(12, tr.width || fw * 0.85);
        var th = Math.max(16, tr.height || fh * 0.85);
        var tx = tr.left - sb.left + (tr.width - tw) / 2;
        var ty = tr.top - sb.top + (tr.height - th) / 2;

          requestAnimationFrame(function () {
            fly.style.width = tw + 'px';
            fly.style.height = th + 'px';
            fly.style.left = tx + 'px';
            fly.style.top = ty + 'px';
            fly.style.transform = 'rotate(0deg) scale(1.02)';
          });
        });

        var done = false;
        function finish() {
          if (done) return;
          done = true;
          if (fly.parentNode) fly.parentNode.removeChild(fly);
          handTile.classList.add('is-up');
          resolve();
        }
        fly.addEventListener('transitionend', finish);
        setTimeout(finish, 360);
      });

    function ensureStepACounts() {
      var need = { bot: 13, right: 14, top: 13, left: 13 };
      DEAL_SEATS.forEach(function (seat) {
        var n = handCount(seat);
        while (n < need[seat]) {
          var fid = null;
          if (seat === 'bot') {
            fid = botFaceIds[n] || FACE_IDS[n % FACE_IDS.length];
            if (!botFaceIds[n]) botFaceIds[n] = fid;
          }
          var t = appendHandTile(seat, fid);
          if (t) t.classList.add('is-up');

    async function dealHandsFly(br) {
      clearHands();
      botFaceIds = drawBotFaceIds();
      var ring = el('handRing');
      if (ring) ring.setAttribute('aria-hidden', 'false');
      var breakInfo = br || (window.MahjongRound && window.MahjongRound.openBreak) || calcOpenBreak(lastDice);
      /* 按张取：136 张队列；发 53 张后墙上应剩 83 */
      var queue = buildTileQueue(breakInfo);
      var qi = 0;
      function takeTile() {
        while (qi < queue.length) {
          var e = queue[qi++];
          if (!e || !e.stack) continue;
          var rem = parseInt(e.stack.getAttribute('data-remain') || '0', 10);
          if (rem > 0) return e;
        }
        return null;
      }
      /*
       * 香港发牌：每轮每家 4 张 ×3 =12，再各补 1→13，庄再补 1→14
       * 主位落地＝超大正面（随机 14）；三家＝立背
       */
      var seatCounts = { bot: 0, right: 0, top: 0, left: 0 };
      var plan = [];
      var r, si, t, seat, entry, faceId;
      for (r = 0; r < 3; r++) {
        for (si = 0; si < DEAL_SEATS.length; si++) {
          seat = DEAL_SEATS[si];
          for (t = 0; t < 4; t++) plan.push(seat);
        }
      }
      for (si = 0; si < DEAL_SEATS.length; si++) plan.push(DEAL_SEATS[si]);
      plan.push('bot');

      var pending = [];
      var dealtTiles = 0;
      for (var p = 0; p < plan.length; p++) {
        seat = plan[p];
        entry = takeTile();
        if (!entry) break;
        faceId = null;
        if (seat === 'bot') faceId = botFaceIds[seatCounts.bot] || null;
        seatCounts[seat] = (seatCounts[seat] || 0) + 1;
        dealtTiles += 1;
        pending.push(flyOneTile(entry, seat, faceId));
        var gap = ((p + 1) % 4 === 0) ? 90 : 36;
        await sleep(gap);
      }
      try { await Promise.all(pending); } catch (_) {}
      await sleep(80);
      seatCounts = ensureStepACounts();
      var wallLeft = wallTilesRemaining();
      try {
        window.MahjongRound = window.MahjongRound || {};
        window.MahjongRound.dealt = true;
        window.MahjongRound.handCounts = seatCounts;
        window.MahjongRound.openBreak = breakInfo;
        window.MahjongRound.dealtTiles = dealtTiles;
        window.MahjongRound.wallLeft = wallLeft;
        window.MahjongRound.botFaces = botFaceIds.slice();
        window.MahjongRound.step = 'B';
      } catch (_) {}
      try {
        console.info('[mahjong-m] deal', dealtTiles, 'wallLeft', wallLeft, 'botFaces', botFaceIds.join(','));
      } catch (_) {}
    }

    function hideDice() {
      try {
        if (window.MahjongDice3D && window.MahjongDice3D.hide) window.MahjongDice3D.hide();
      } catch (_) {}
      const layer = el('mjDice3dLayer');
      if (!layer) return;
      layer.classList.remove('is-on');
      layer.setAttribute('aria-hidden', 'true');
    }

    async function playDiceToss() {
      /* 两颗不许同点 */
      var a = 1 + Math.floor(Math.random() * 6);
      var b = 1 + Math.floor(Math.random() * 6);
      while (b === a) b = 1 + Math.floor(Math.random() * 6);
      var ok = await waitMahjongDice3D(2500);
      if (ok) {
        try { await window.MahjongDice3D.play([a, b]); }
        catch (_) { await sleep(800); }
      } else {
        await sleep(800);
      }
      await sleep(900);
      lastDice = { a: a, b: b, sum: a + b };
      return lastDice;
    }

    /* —— 中央 10 格计时器 —— */
    var turnTimerState = {
      segs: [],
      numEl: null,
      left: TURN_SECS,
      tickId: 0,
      running: false,
      onTimeout: null
    };

    function polar(cx, cy, r, a) {
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    }
    function segPath(i, n, cx, cy, r0, r1, gap) {
      var step = (Math.PI * 2) / n;
      var a0 = -Math.PI / 2 + i * step + gap / 2;
      var a1 = -Math.PI / 2 + (i + 1) * step - gap / 2;
      var p0 = polar(cx, cy, r1, a0);
      var p1 = polar(cx, cy, r1, a1);
      var p2 = polar(cx, cy, r0, a1);
      var p3 = polar(cx, cy, r0, a0);
      var large = (a1 - a0) > Math.PI ? 1 : 0;
      return 'M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
        ' A' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
        ' L' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) +
        ' A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + p3[0].toFixed(2) + ' ' + p3[1].toFixed(2) +
        ' Z';
    }
    function buildTurnTimer() {
      var host = el('turnTimer');
      if (!host) return;
      host.innerHTML = '';
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('aria-hidden', 'true');
      var n = TURN_SECS;
      var segs = [];
      for (var i = 0; i < n; i++) {
        var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', segPath(i, n, 50, 50, 28, 46.5, 0.07));
        p.setAttribute('class', 'seg is-idle');
        svg.appendChild(p);
        segs.push(p);
      }
      var hub = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      hub.setAttribute('cx', '50');
      hub.setAttribute('cy', '50');
      /* 木圈内径；数字上下顶满此圆，不穿出 */
      hub.setAttribute('r', '25');
      hub.setAttribute('class', 'hub');
      svg.appendChild(hub);
      var num = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      num.setAttribute('x', '50');
      num.setAttribute('y', '51');
      num.setAttribute('class', 'turn-num');
      num.textContent = String(TURN_SECS);
      svg.appendChild(num);
      host.appendChild(svg);
      turnTimerState.segs = segs;
      turnTimerState.numEl = num;
    }
    function paintTurnTimer() {
      var left = turnTimerState.left;
      var segs = turnTimerState.segs;
      for (var i = 0; i < segs.length; i++) {
        var seg = segs[i];
        seg.classList.remove('is-hot', 'is-idle', 'is-gone');
        if (i < left) {
          /* 剩余秒：当前秒最亮并闪，其余暖棕 */
          seg.classList.add(i === left - 1 ? 'is-hot' : 'is-idle');
        } else {
          seg.classList.add('is-gone');
        }
      }
      if (turnTimerState.numEl) {
        turnTimerState.numEl.textContent = String(Math.max(0, left));
      }
    }
    function showTurnToast(msg) {
      var t = el('turnToast');
      if (!t) return;
      if (msg) t.textContent = msg;
      t.classList.add('is-on');
      t.setAttribute('aria-hidden', 'false');
      clearTimeout(showTurnToast._id);
      showTurnToast._id = setTimeout(function () {
        t.classList.remove('is-on');
        t.setAttribute('aria-hidden', 'true');
      }, 1400);
    }
    function stopTurnTimer() {
      turnTimerState.running = false;
      if (turnTimerState.tickId) {
        clearInterval(turnTimerState.tickId);
        turnTimerState.tickId = 0;
      }
    }
    function hideTurnTimer() {
      stopTurnTimer();
      var host = el('turnTimer');
      if (!host) return;
      host.classList.remove('is-on');
      host.setAttribute('aria-hidden', 'true');
    }
    /* 选手手动出牌后调用，打断倒计时 */
    function playerDidDiscard() {
      stopTurnTimer();
      hideTurnTimer();
    }
    /* 超时：系统代打（手牌未接前先 toast + 钩子；接上手牌后在此打一张） */
    function systemAutoDiscard() {
      /* 「系统自动出牌」字样已去掉；逻辑仍走代打钩子 */
      try {
        if (typeof window.onMahjongAutoDiscard === 'function') {
          window.onMahjongAutoDiscard();
        }
      } catch (_) {}
      /* 暂无手牌：演示再开一轮 10 秒，接上手牌后改为进入下一玩家 */
      setTimeout(function () { startTurnTimer(); }, 900);
    }
    function startTurnTimer(onTimeout) {
      buildTurnTimer();
      stopTurnTimer();
      turnTimerState.left = TURN_SECS;
      turnTimerState.onTimeout = onTimeout || systemAutoDiscard;
      turnTimerState.running = true;
      var host = el('turnTimer');
      if (host) {
        host.classList.add('is-on');
        host.setAttribute('aria-hidden', 'false');
      }
      paintTurnTimer();
      turnTimerState.tickId = setInterval(function () {
        if (!turnTimerState.running) return;
        turnTimerState.left -= 1;
        if (turnTimerState.left <= 0) {
          turnTimerState.left = 0;
          paintTurnTimer();
          stopTurnTimer();
          hideTurnTimer();
          var fn = turnTimerState.onTimeout;
          turnTimerState.onTimeout = null;
          if (fn) fn();
          return;
        }
        paintTurnTimer();
      }, 1000);
    }
    window.MahjongTurnTimer = {
      start: startTurnTimer,
      stop: stopTurnTimer,
      hide: hideTurnTimer,
      playerDidDiscard: playerDidDiscard
    };

    async function boot() {
      hideDice();
      hideTurnTimer();
      if (STEP1_FLAT_TABLE_ONLY) {
        var ring = el('wallRing');
        if (ring) {
          ring.classList.remove('is-on');
          ring.innerHTML = '';
        }
        return;
      }
      prepareWall();
      if (STEP2_SOLID_TILES) {
        /* 步骤2只验实心墩，不摇骰 */
        await revealWall();
        return;
      }
      /* 四墙趴 → 掷骰 → 算起牌口 → 飞牌到四家立排 */
      await revealFlatWalls();
      var dice = await playDiceToss();
      var br = calcOpenBreak(dice);
      try {
        window.MahjongRound = window.MahjongRound || {};
        window.MahjongRound.dice = dice;
        window.MahjongRound.openBreak = br;
      } catch (_) {}
      await dealHandsFly(br);
      hideDice();
      startTurnTimer();
    }

    tryLockLandscape();
    document.addEventListener('pointerdown', tryLockLandscape, { passive: true });
    document.addEventListener('touchstart', tryLockLandscape, { passive: true });

    window.addEventListener('resize', layoutTable);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', layoutTable);
      window.visualViewport.addEventListener('scroll', layoutTable);
    }
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { tryLockLandscape(); layoutTable(); }, 120);
      setTimeout(layoutTable, 320);
    });

    layoutTable();
    boot();
    try { console.info('[mahjong-m]', V); } catch (_) {}
  })();
  </script>
</body>
