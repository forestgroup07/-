<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a1210" />
  <meta name="robots" content="noindex,nofollow" />
  <title>輪盤 R501 · 手机版</title>
  <!-- 键面最高优先；绿布让路，避免与键面并行抢带宽 -->
  <link rel="preload" as="image" href="assets/roulette/m-kbd-face.webp?v=1.4.0" type="image/webp" fetchpriority="high" />
  <style>
    :root {
      --bg: #0a1210;
      --teal: #0e3d38;
      --teal2: #12544c;
      --cell: #0f4a43;
      --cell-line: rgba(90, 200, 170, .28);
      --gold: #e8c76a;
      --gold2: #f5dfa0;
      --red: #c62828;
      --black: #1a1a1a;
      --muted: #9bb8b0;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --v: 1.0.0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: #f2f6f4;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    .app {
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding-top: var(--safe-t);
      padding-bottom: var(--safe-b);
      max-width: 480px;
      margin: 0 auto;
      background: linear-gradient(180deg, #07110f 0%, #0b1a17 40%, #0a1412 100%);
    }
    /* 关闭=露边一半；打开=完整竖向跑道盖住露边（一条整卵形），盘面左让 */
    .slide-root {
      position: relative;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      /* 整卵焊进底图(1479×2059)：无旋转 scale+平移，左列外沿竖直对齐 */
      --face-w: 1479;
      --face-base: 1200;
      --face-wide: 123.25%; /* 1479/1200 */
      --grid-w: 81.136%; /* 1200/1479 */
      --board-pan: -18.864%; /* (1479-1200)/1479 */
      --track-left: 63.243%;
      --track-top: 0%;
      --track-open: 36.596%;
      --track-h: 98.384%;
    }
    .slide-main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
    }
    .board-pan-inner {
      position: relative;
      width: var(--face-wide);
      transition: transform .38s cubic-bezier(.22, .7, .2, 1);
      will-change: transform;
    }
    /* 黄键打开：焊死底图整块左移，左侧绿键出画、右侧整卵入画 */
    .app.is-track .board-pan-inner { transform: translateX(var(--board-pan)); }
    .slide-track {
      position: absolute;
      top: var(--track-top);
      left: var(--track-left);
      width: var(--track-open);
      height: var(--track-h);
      display: block;
      opacity: 0;
      background: transparent;
      z-index: 8;
      box-shadow: none;
      overflow: visible;
      pointer-events: none;
    }
    .app.is-track .slide-track {
      opacity: 1;
      pointer-events: auto;
    }
    /* 卵已焊进底图：浮层只留热区，隐藏第二张卵图 */
    .slide-track .track-face,
    .slide-track picture { display: none !important; }
    .app.is-track .race-open-hit { pointer-events: none; visibility: hidden; }
    .track-top {
      display: none;
    }
    .track-back {
      position: absolute;
      left: .35rem;
      top: .35rem;
      z-index: 5;
      width: 1.85rem; height: 1.85rem;
      border-radius: 999px;
      background: rgba(0,0,0,.4);
      border: 1px solid rgba(240, 211, 146, .4);
      color: #f0d392;
      font-size: 1.15rem;
      line-height: 1;
      pointer-events: auto;
    }
    .track-title { display: none; }
    .track-body {
      position: relative;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .track-stage {
      position: absolute;
      inset: 0;
      margin: 0;
    }
    .track-face {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      object-position: left top;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      border-radius: 0;
    }
    #trackFrench,
    #trackNumsM {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #trackNumsM { z-index: 2; }
    #trackFrench { z-index: 3; } /* 中间绿键压在号格 AABB 之上 */
    #trackFrench .hit,
    #trackNumsM .hit {
      position: absolute;
      pointer-events: auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 0;
      border: 0;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
      z-index: 1;
      border-radius: 18% / 22%;
    }
    #trackFrench .hit.has-mask,
    #trackNumsM .hit.has-mask {
      border-radius: 0;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }
    /* 电脑同款：蒙格热区黄脸透字 */
    #trackFrench .hit::before,
    #trackNumsM .hit::before {
      content: "" !important;
      display: block !important;
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: transparent;
      pointer-events: none;
      z-index: 0;
    }
    #trackFrench .hit.is-lit,
    #trackNumsM .hit.is-lit {
      z-index: 2;
    }
    #trackFrench .hit.is-lit::before,
    #trackNumsM .hit.is-lit::before {
      /* 与主键盘 .n.is-lit 同色同透明度，叠在清晰 1.3.2 底上 */
      background: rgba(232, 196, 48, 0.50) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(120,80,0,.14);
    }
    #trackNumsM .hit .chip-on {
      z-index: 6;
    }
    .race-open-hit {
      position: absolute;
      left: 76%;
      top: 0;
      width: 24%;
      /* 勿盖到底部「第*列」行（约 91% 起），否则列键点不开 */
      height: 90%;
      z-index: 6;
      pointer-events: auto;
      background: transparent;
      border: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* —— 顶屏：电脑转盘区+绿布+黑滑道；底沿裁到滑道下沿，绿键顶死接上 —— */
    .stage {
      position: relative;
      width: 100%;
      /* 裁到黑滑道底（felt 高×97.6423%），下面不留空绿布 */
      aspect-ratio: 884 / 704;
      height: auto;
      max-height: min(46vh, 400px);
      background: #0f6b32;
      overflow: hidden;
    }
    .video-well {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      /* 仍按完整 felt 比例排轮盘/滑道，多出的底被 stage 裁掉 */
      height: 102.414%;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      background: #0f6b32;
    }
    /* 电脑屏转盘区绿布（含木台/滑道底，无烤死中奖号） */
    .felt-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 电脑 wheel-disc：按 pc-full-ref 相对几何叠在绿布上 */
    .wheel-wrap {
      position: absolute;
      left: 12.0159%;
      top: -8.8909%;
      width: 78.9592%;
      height: auto;
      aspect-ratio: 1 / 1;
      z-index: 25;
      pointer-events: none;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,.4));
    }
    .wheel-spin {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      transform: rotate(0deg);
      transform-origin: 50% 50%;
      will-change: transform;
      overflow: hidden;
    }
    .wheel-spin.is-idle {
      animation: wheel-idle-cw 22s linear infinite;
    }
    @keyframes wheel-idle-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .wheel-disc {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      z-index: 3;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .wheel-ball-layer {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .wheel-ball-layer.show { opacity: 1; }
    .wheel-ball-arm {
      position: absolute;
      inset: 0;
      transform: rotate(0deg);
      transform-origin: 50% 50%;
      will-change: transform;
    }
    .wheel-ball {
      position: absolute;
      left: 50%;
      top: 6.8%;
      /* 大球（回滚 1.3.12 后变小；恢复已验收 3.55%） */
      width: 3.55%;
      height: 3.55%;
      min-width: 9px;
      min-height: 9px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff 0%, #ececec 34%, #c8c8c8 58%, #7a7a7a 82%, #2a2a2a 100%);
      box-shadow: 0 1px 2px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.55);
    }
    /* 黑滑道：相对绿布裁切窗，与电脑同款长洞；开奖前无数字 */
    #pcRail {
      position: absolute;
      left: 9.0498%;
      top: 88.2109%;
      width: 77.4886%;
      height: 9.4314%;
      z-index: 55;
      pointer-events: none;
      border-radius: 999px;
      overflow: visible;
      box-sizing: border-box;
      background: url("assets/roulette/wheel-bases/history-rail-hole.png?v=1.1.8") center / 100% 100% no-repeat;
    }
    /* 红球：挂在绿布舞台上；仅开奖后出现，数字=本局真实中奖号 */
    #pcRailBall {
      position: absolute;
      left: 12.2947%;
      top: 91.5413%;
      width: 12.5465%;
      height: auto;
      aspect-ratio: 1 / 1;
      min-width: 22px;
      min-height: 22px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 56;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background:
        radial-gradient(circle at 30% 26%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 28%),
        radial-gradient(circle at 50% 55%, #ff5252 0%, #e53935 38%, #c62828 62%, #7f0000 100%);
      box-shadow:
        0 4px 8px rgba(0,0,0,.5),
        0 1px 0 rgba(255,255,255,.22) inset,
        0 -2px 4px rgba(0,0,0,.35) inset;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      font-size: clamp(1.4rem, 6.4vw, 1.9rem);
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,.55);
      opacity: 0;
      visibility: hidden;
      will-change: left, transform;
    }
    #pcRailBall.show {
      opacity: 1;
      visibility: visible;
    }
    #pcRailBall.is-rolling {
      animation: pc-rail-ball-spin 1.35s linear;
    }
    @keyframes pc-rail-ball-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(1080deg); }
    }

    .topbar {
      position: absolute; z-index: 5; left: 0; right: 0; top: 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: .55rem .7rem 0;
    }
    .top-left { display: flex; align-items: center; gap: .4rem; }
    .btn-back {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,.35);
      display: grid; place-items: center;
      font-size: 1rem; line-height: 1;
    }
    .table-name { font-size: .95rem; font-weight: 700; letter-spacing: .02em; text-shadow: 0 1px 3px #000; }
    .top-right { display: flex; align-items: center; gap: .55rem; }
    .ico {
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(0,0,0,.35);
      display: grid; place-items: center;
      color: #f0e6c8; font-size: .85rem;
      border: 0; padding: 0;
    }
    .round-id {
      position: absolute; z-index: 5; right: .7rem; top: 2.35rem;
      font-size: .68rem; color: rgba(255,255,255,.78);
      text-shadow: 0 1px 2px #000;
    }

    /* 倒计时：滑道上方左侧，不挡绿键接缝 */
    .timer {
      --p: 1;
      --timer-ring: #6fdc4a;
      --timer-pie: #6fdc4a66;
      position: absolute; z-index: 6;
      left: .55rem; bottom: auto; top: 62%;
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--timer-ring);
      text-shadow: 0 1px 2px rgba(0,0,0,.55);
      pointer-events: none;
      background:
        radial-gradient(farthest-side, rgba(8, 12, 8, 0.58) calc(100% - 0.13em), transparent calc(100% - 0.12em)),
        conic-gradient(var(--timer-ring) calc(var(--p) * 1turn), transparent 0);
    }
    .timer::before {
      content: "";
      position: absolute;
      inset: 0.13em;
      border-radius: 50%;
      background: conic-gradient(var(--timer-pie) calc(var(--p) * 1turn), transparent 0);
      pointer-events: none;
    }
    .timer::after {
      content: "";
      position: absolute;
      width: 11%; height: 11%;
      border-radius: 50%;
      background: var(--timer-ring);
      box-shadow: 0 0 0.08em rgba(0,0,0,.35);
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) rotate(calc(var(--p) * 360deg)) translateY(-430%);
      pointer-events: none;
      z-index: 2;
    }
    .timer > span { position: relative; z-index: 1; }
    .timer.closed {
      --timer-ring: #888;
      --timer-pie: #88888866;
      color: #aaa;
    }
    .timer.danger {
      --timer-ring: #ff3b3b;
      --timer-pie: #ff3b3b66;
      color: #ff3b3b;
    }

    /* 开奖结果：紧挨倒计时右侧（滑道上方） */
    .result-board {
      position: absolute; z-index: 8;
      left: calc(.55rem + 56px + .4rem);
      bottom: auto;
      top: calc(62% + 10px);
      display: none;
      align-items: flex-end;
      gap: .45rem;
      padding: 0;
      background: transparent;
      pointer-events: none;
    }
    .result-board.show { display: flex; }
    .result-board .rb-num {
      width: 36px; height: 36px;
      border-radius: 6px;
      border: 2px solid #e6c84a;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.55);
      box-shadow: 0 1px 4px rgba(0,0,0,.5);
      flex: 0 0 36px;
    }
    .result-board .rb-num.is-red { background: #c62828; }
    .result-board .rb-num.is-black { background: #1a1a1a; }
    .result-board .rb-num.is-green { background: #1b7a3a; }
    .result-board .rb-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-bottom: 2px;
      line-height: 1.1;
    }
    .result-board .rb-parity,
    .result-board .rb-size {
      font-size: 1.05rem;
      font-weight: 900;
      text-shadow: 0 1px 3px rgba(0,0,0,.65);
    }
    .result-board .rb-parity.is-odd { color: #4ea1ff; }
    .result-board .rb-parity.is-even { color: #ff5a5a; }
    .result-board .rb-size.is-big { color: #ff5a5a; }
    .result-board .rb-size.is-small { color: #4ea1ff; }

    /* 接缝处不要「轮盘」角标挡在滑道旁 */
    .brand-mark { display: none; }
    .phase-banner {
      position: absolute;
      left: 50%; top: 42%;
      transform: translate(-50%, -50%) scale(.96);
      z-index: 45;
      padding: 0.55em 1.25em;
      border-radius: 0.2em;
      background: rgba(0,0,0,.62);
      border: 1px solid rgba(255,220,140,.45);
      color: #ffe29a;
      font-size: clamp(1.05rem, 4.2vw, 1.35rem);
      font-weight: 800;
      letter-spacing: 0.12em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0; visibility: hidden;
      transition: opacity .22s ease, transform .22s ease, visibility .22s;
      text-shadow: 0 2px 8px rgba(0,0,0,.7);
    }
    .phase-banner.show {
      opacity: 1; visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
    .toast {
      position: absolute; z-index: 40; left: 50%; top: 58%;
      transform: translate(-50%, -50%);
      padding: .45rem .9rem; border-radius: 8px;
      background: rgba(0,0,0,.72); color: #fff;
      font-size: .88rem; font-weight: 700;
      opacity: 0; pointer-events: none; transition: opacity .2s;
      white-space: nowrap; visibility: hidden;
    }
    .toast.show { opacity: 1; visibility: visible; }

    /* —— 绿台键盘：公司原图原样贴上，顶死接黑滑道 —— */
    .board-wrap {
      position: relative;
      overflow: hidden;
      min-height: 0;
      background: #508c87;
      border-top: 0;
      margin-top: 0;
      padding-top: 0;
    }
    .board-scroll {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    .board-scroll::-webkit-scrollbar { display: none; }
    .board-face-wrap {
      position: relative;
      width: 100%;
      line-height: 0;
      overflow: hidden;
    }
    .board-face {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1479 / 2059;
      background: #0f4a43;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    /* 热区仍按原 1200 宽坐标系（焊图左段） */
    .board-grid {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--grid-w);
      height: 100%;
      z-index: 2;
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      pointer-events: none;
    }
    .board-grid .zero,
    .board-grid .n,
    .board-grid .out {
      position: absolute;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      color: transparent !important;
      font-size: 0 !important;
      border-radius: 0;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto;
      z-index: 5;
      cursor: pointer;
    }
    /* 落注：手机骰宝同款真筹码图 */
    .bet-chip,
    .chip-on {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44%;
      max-width: 38px;
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
      transform: translate(-50%, -50%);
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: transparent;
      font-size: 0;
      line-height: 0;
      pointer-events: none;
      z-index: 6;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55));
    }
    .bet-chip.is-pending {
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 0 2px rgba(255, 224, 138, 0.85));
      outline: 2px solid rgba(255, 224, 138, 0.9);
      outline-offset: 1px;
      border-radius: 50%;
    }
    #trackNumsM .hit .bet-chip,
    #trackFrench .hit .bet-chip {
      width: 56%;
      max-width: 34px;
    }
    /* 亮层铺满蒙版格（与底图格对齐） */
    .board-grid .n.is-lit,
    .board-grid .zero.is-lit,
    .board-grid .out.is-lit {
      box-shadow: none !important;
    }
    .board-grid .n.is-lit::before,
    .board-grid .zero.is-lit::before,
    .board-grid .out.is-lit::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 8% / 10%;
      background: rgba(232, 196, 48, 0.50);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(120,80,0,.14);
      pointer-events: none;
      z-index: 1;
    }
    .board-grid .zero.is-lit::before {
      border-radius: 10% / 14%;
    }
    .board-grid .out.is-lit::before {
      border-radius: 6% / 8%;
    }
    .board-grid .out .bet-chip {
      width: 52%;
      max-width: 34px;
    }

    /* —— 底栏（对标参考图） —— */
    .dock {
      position: relative;
      background: linear-gradient(180deg, #0d2c28, #081a18);
      border-top: 1px solid rgba(90, 200, 170, .2);
      padding: .35rem .55rem 0;
    }
    /* 确认三键：照抄手机骰宝 — 浮在底栏上方，保证可点 */
    .act-bar {
      display: none;
      position: absolute;
      left: 50%;
      bottom: calc(100% - 2px);
      transform: translateX(-50%);
      z-index: 60;
      width: min(88%, 360px);
      padding: 0;
      margin: 0;
      background: transparent;
      box-shadow: none;
      grid-template-columns: 1fr 1.28fr 1fr;
      gap: 10px;
      pointer-events: none;
    }
    .act-bar.show { display: grid; }
    .act-btn {
      height: 46px;
      border: 0;
      border-radius: 999px;
      padding: 0;
      overflow: visible;
      pointer-events: auto;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background: linear-gradient(180deg, #fff4b8 0%, #f7e68a 48%, #efd66a 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 -1px 0 rgba(180, 140, 40, 0.28),
        0 3px 8px rgba(0, 0, 0, 0.28);
      display: grid;
      place-items: center;
    }
    .act-btn:active { filter: brightness(1.04); transform: scale(.98); }
    .act-btn .act-ico {
      width: 28px;
      height: 28px;
      display: block;
      pointer-events: none;
    }
    .act-btn#btnUndo .act-ico { width: 30px; height: 30px; }
    .act-btn#btnConfirm .act-ico { width: 30px; height: 30px; }
    .dock-meta {
      display: flex; align-items: center; justify-content: space-between;
      gap: .4rem; margin-bottom: .35rem;
    }
    .limit-pill {
      display: inline-flex; align-items: center; gap: .25rem;
      padding: .18rem .45rem; border-radius: 999px;
      border: 1px solid rgba(232, 199, 106, .35);
      color: var(--gold2); font-size: .68rem; font-weight: 600;
      background: rgba(0,0,0,.25);
    }
    /* 限红说明：布局抄手机骰宝；文案用电脑轮盘限红 */
    .limit-tip {
      position: absolute;
      left: 3%;
      bottom: calc(100% + 8px);
      width: min(86vw, 320px);
      max-height: min(58vh, 420px);
      z-index: 52;
      padding: 0.5rem 0.55rem 0.4rem;
      border-radius: 10px;
      border: 1px solid rgba(232, 199, 106, 0.55);
      background: rgba(0, 0, 0, 0.88);
      color: #f0f0f0;
      display: none;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }
    .limit-tip.show { display: flex; }
    .limit-tip::after {
      content: "";
      position: absolute;
      left: 16%;
      bottom: -7px;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 8px solid rgba(0, 0, 0, 0.88);
    }
    .limit-tip-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      flex: 1 1 auto;
      min-height: 0;
      padding-right: 4px;
    }
    .limit-tip-sec-title {
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.2rem 0 0.35rem;
      margin-top: 0.15rem;
      border-bottom: 1px solid rgba(232, 199, 106, 0.55);
      margin-bottom: 0.1rem;
    }
    .limit-tip-sec-title:first-child { margin-top: 0; }
    .limit-tip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.3rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 0.66rem;
      line-height: 1.25;
    }
    .limit-tip-row .k { color: #f0f0f0; font-weight: 500; }
    .limit-tip-row .v {
      color: #e8e8e8;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      white-space: nowrap;
    }
    .bal-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-width: 0;
      line-height: 1.15;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      font: inherit;
      color: inherit;
    }
    .bal-wrap:focus,
    .bal-wrap:focus-visible { outline: none; }
    .bal-wrap .bal-user {
      color: rgba(255, 255, 255, 0.92);
      font-size: clamp(0.62rem, 2.6vw, 0.74rem);
      font-weight: 600;
      max-width: 9em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }
    .bal-wrap .bal-amt {
      display: flex;
      align-items: center;
      gap: .28rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #fff;
      font-size: .92rem;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }
    .bal-wrap .c {
      width: 16px; height: 16px; border-radius: 50%;
      flex: 0 0 16px;
      background: radial-gradient(circle at 30% 30%, #e8f7ef, #7ecf9a 55%, #3a9a6a 78%);
      box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35), 0 0 0 1px rgba(0,0,0,.25);
    }
    .account-tip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%) translateY(4px);
      z-index: 55;
      padding: 0.38rem 0.72rem;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.92);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.3;
      white-space: nowrap;
      display: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity .15s ease, transform .15s ease, visibility .15s;
    }
    .account-tip.show {
      display: block;
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
    .account-tip::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 7px solid rgba(0, 0, 0, 0.92);
    }
    .stake-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: .45rem;
      min-width: 5.2rem;
      height: 30px;
      padding: 0 .55rem 0 .42rem;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f2f2f2;
      font-size: .8rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .stake-btn .stake-coin {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: block;
    }
    .stake-btn .stake-num {
      flex: 1 1 auto;
      text-align: center;
      min-width: 1.2em;
    }
    .stake-btn .stake-caret {
      width: 0;
      height: 0;
      flex: 0 0 auto;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 6px solid #e8d5a0;
      margin-top: -1px;
    }
    .stake-btn[aria-expanded="true"] .stake-caret {
      border-bottom: 0;
      border-top: 6px solid #e8d5a0;
    }
    .stake-tip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translateX(-50%);
      width: min(86vw, 340px);
      z-index: 50;
      padding: 0.55rem 0.75rem 0.7rem;
      border-radius: 10px;
      background: rgba(8, 28, 26, 0.88);
      color: #f3f3f3;
      font-size: 0.78rem;
      line-height: 1.45;
      display: none;
      flex-direction: column;
      gap: 0.12rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
    }
    .stake-tip.show { display: flex; }
    .stake-tip::after {
      content: "";
      position: absolute;
      right: 18%;
      bottom: -7px;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 8px solid rgba(8, 28, 26, 0.88);
    }
    .stake-tip-head,
    .stake-tip-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      align-items: center;
      column-gap: 0.4rem;
      min-height: 1.4em;
    }
    .stake-tip-head {
      color: #e8c76a;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding-bottom: 0.28rem;
      margin-bottom: 0.12rem;
      border-bottom: 1px solid rgba(232, 199, 106, 0.45);
    }
    .stake-tip-head span:nth-child(2),
    .stake-tip-head span:nth-child(3),
    .stake-tip-row span:nth-child(2),
    .stake-tip-row span:nth-child(3) {
      text-align: center;
    }
    .stake-tip-row span:first-child {
      color: #f0f0f0;
      font-weight: 600;
    }
    .stake-tip-row.is-total {
      margin-top: 0.18rem;
      padding-top: 0.32rem;
      border-top: 1px solid rgba(232, 199, 106, 0.45);
      font-weight: 800;
      color: #e8c76a;
    }
    .dock-actions {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      align-items: center;
      gap: .4rem;
    }
    .btn-gear {
      width: 34px; height: 34px; border-radius: 8px;
      background: rgba(255,255,255,.06);
      color: var(--gold2); font-size: 1.05rem;
      display: grid; place-items: center;
    }
    .btn-gear.is-locked,
    .btn-gear:disabled,
    .btn-road.is-locked,
    .btn-road:disabled {
      opacity: 0.55;
      pointer-events: none;
      cursor: default;
    }
    .chips-rail {
      display: flex;
      align-items: center;
      gap: .4rem;
      min-width: 0;
    }
    .chips {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: .5rem;
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      scroll-snap-type: x proximity;
      padding: .15rem .1rem .35rem;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      width: 46px; height: 46px; border-radius: 50%;
      border: 2px solid transparent;
      background: transparent center / contain no-repeat;
      position: relative;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
      transition: transform .12s ease;
      scroll-snap-align: center;
    }
    .chips-rail > .chip.max {
      flex: 0 0 auto;
      margin-bottom: .2rem;
    }
    .chip.sel {
      border-color: #ffe08a;
      box-shadow: 0 0 0 3px rgba(255, 200, 80, .35);
      transform: translateY(-3px) scale(1.06);
    }
    .chip.max {
      background:
        radial-gradient(circle at 35% 30%, #ffd27a, #e07020 68%, #8a3a08);
      color: #fff; font-size: .62rem; font-weight: 900;
      letter-spacing: .02em;
      display: grid; place-items: center;
      border: 2px solid rgba(255,255,255,.35);
    }
    .chip.max.sel { border-color: #ffe08a; }
    .btn-road {
      padding: .55rem .7rem;
      border-radius: 8px;
      background: linear-gradient(180deg, #d9b57a, #b8894a);
      color: #2a1a05;
      font-size: .78rem; font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,.35);
    }
    .btn-road:active { filter: brightness(1.05); }
    .dock-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: .28rem;
      padding: .12rem .15rem calc(.08rem + var(--safe-b));
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .btn-nav {
      width: 40px; height: 36px;
      border-radius: 999px;
      display: grid; place-items: center;
      color: #d7e6e0;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-nav:active { background: rgba(255,255,255,.08); }
    .btn-nav svg { width: 22px; height: 22px; display: block; }
    .btn-nav.muted { color: #8a9a94; opacity: .72; }
    .btn-nav.muted .slash { display: block; }
    .btn-nav .slash { display: none; }

    .app.betting-closed .board-face {
      filter: brightness(.72);
    }
    /* 黑滑道上方右侧：只要中间标志，无底板 */
    .stage-corner-icons {
      position: absolute;
      right: 3.2%;
      /* pcRail top≈88.2%（相对绿布）→ 图标坐在滑道上方 */
      bottom: 13.5%;
      z-index: 58;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      pointer-events: auto;
    }
    .stage-ico {
      width: 1.85rem;
      height: 1.85rem;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent !important;
      box-shadow: none !important;
      overflow: visible;
      -webkit-tap-highlight-color: transparent;
      display: grid;
      place-items: center;
    }
    .stage-ico svg {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.55));
    }
    .stage-ico.is-locked { opacity: .55; }
    /* 弯道开关：默认金黄 →；开跑道后金黄 ←；跑道内小返回箭头不再出现 */
    .stage-ico .ico-arrow-left { display: none; }
    .app.is-track .stage-ico .ico-arrow-right { display: none; }
    .app.is-track .stage-ico .ico-arrow-left { display: block; }
    .track-back { display: none !important; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="slide-root" id="slideRoot">
    <div class="slide-main" id="slideMain">
    <header class="stage" id="stage">
      <div class="topbar">
        <div class="top-left">
          <button type="button" class="btn-back" id="btnBack" aria-label="返回">‹</button>
          <div class="table-name">轮盘 R501</div>
        </div>
        <div class="top-right">
          <span class="ico" title="安全" aria-hidden="true">🛡</span>
          <span class="ico" title="换筹码" aria-hidden="true">◎</span>
          <button type="button" class="ico" id="btnMenu" aria-label="菜单">≡</button>
        </div>
      </div>
      <div class="video-well" id="videoWell">
        <img class="felt-bg" src="assets/roulette/m-wheel-felt-bg.jpg?v=1.3.0" alt="" width="884" height="721" decoding="async" fetchpriority="low" draggable="false" />
        <div class="wheel-wrap" id="wheelWrap" aria-hidden="true">
          <div class="wheel-spin is-idle" id="wheelSpin">
            <img class="wheel-disc" id="wheelDisc" src="assets/roulette/wheel-disc.png?v=1.2.4" alt="" width="666" height="666" decoding="async" loading="lazy" fetchpriority="low" draggable="false" />
          </div>
          <div class="wheel-ball-layer" id="wheelBallLayer" aria-hidden="true">
            <div class="wheel-ball-arm" id="wheelBallArm">
              <div class="wheel-ball" id="wheelBall"></div>
            </div>
          </div>
        </div>
        <div id="pcRail" aria-label="开奖号码长洞" aria-hidden="true"></div>
        <div id="pcRailBall" aria-hidden="true"></div>
      </div>
      <div class="round-id" id="roundId">局号: —</div>
      <div class="timer" id="timer" style="--p:1"><span id="timerNum">22</span></div>
      <div class="result-board" id="resultBoard" aria-live="polite">
        <div class="rb-num is-red" id="rbNum">18</div>
        <div class="rb-meta">
          <div class="rb-parity is-even" id="rbParity">雙</div>
          <div class="rb-size is-small" id="rbSize">小</div>
        </div>
      </div>
      <div class="brand-mark"><span class="dot">↻</span>轮盘</div>
      <div class="phase-banner" id="phaseBanner" aria-live="polite"></div>
      <div class="toast" id="toast"></div>
      <!-- 电脑轮盘同款音源槽 -->
      <!-- embed 口播走父页；preload none 避免进桌抢键面带宽 -->
      <audio id="voWelcome" preload="none" playsinline></audio>
      <audio id="voStartBet" preload="none" playsinline></audio>
      <audio id="voRoundOpen" preload="none" playsinline></audio>
      <audio id="voStopBet" preload="none" playsinline></audio>
      <audio id="voBetOk" preload="none" playsinline></audio>
      <audio id="voEnNum" preload="none" playsinline></audio>
      <audio id="sfxTick" preload="none" playsinline></audio>
      <audio id="sfxBombTick" preload="none" playsinline></audio>
      <div class="stage-corner-icons" id="stageCornerIcons">
        <button type="button" class="stage-ico" id="btnTrackIco" aria-label="打开弯道">
          <svg class="ico-arrow-right" viewBox="0 0 48 48" aria-hidden="true">
            <g fill="none" stroke="#f0d392" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 24h20" />
              <path d="M26 14l10 10-10 10" />
            </g>
          </svg>
          <svg class="ico-arrow-left" viewBox="0 0 48 48" aria-hidden="true">
            <g fill="none" stroke="#f0d392" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M34 24H14" />
              <path d="M22 14L12 24l10 10" />
            </g>
          </svg>
        </button>
        <button type="button" class="stage-ico is-locked" id="btnStatsIco" aria-label="统计（暂不可用）" disabled>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <g fill="#f0d392" stroke="none">
              <rect x="10" y="28" width="6.5" height="10" rx="1.2" />
              <rect x="20.75" y="21" width="6.5" height="17" rx="1.2" />
              <rect x="31.5" y="14" width="6.5" height="24" rx="1.2" />
            </g>
            <g fill="none" stroke="#f0d392" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11.5 24.5 L21 16.5 L28.5 20.5 L37.5 11.5" />
            </g>
            <g fill="#f0d392">
              <circle cx="11.5" cy="24.5" r="2.1" />
              <circle cx="21" cy="16.5" r="2.1" />
              <circle cx="28.5" cy="20.5" r="2.1" />
              <circle cx="37.5" cy="11.5" r="2.1" />
            </g>
          </svg>
        </button>
      </div>
    </header>

    <main class="board-wrap" id="boardWrap">
      <div class="board-scroll" id="boardScroll">
        <div class="board-face-wrap" id="boardFaceWrap">
          <div class="board-pan-inner" id="boardPanInner">
            <img class="board-face" id="boardFace" src="assets/roulette/m-kbd-face.webp?v=1.4.0" data-fallback="assets/roulette/m-kbd-face.jpg?v=1.4.0" alt="" width="1479" height="2059" decoding="async" fetchpriority="high" loading="eager" draggable="false" />
            <div class="board-grid" id="boardGrid" aria-label="下注键盘"></div>
            <!-- 卵已焊进底图；此处仅打开态热区 -->
            <div class="slide-track" id="slideTrack" aria-hidden="true">
              <div class="track-body">
                <button type="button" class="track-back" id="trackBack" aria-label="返回盘面">‹</button>
                <div class="track-stage" id="trackStage">
                  <picture>
                    <source type="image/webp" srcset="assets/roulette/m-track-face-v.webp?v=1.3.5" />
                    <img class="track-face" id="trackFace" src="assets/roulette/m-track-face-v.png?v=1.3.5" alt="" width="238" height="888" decoding="async" loading="lazy" draggable="false" />
                  </picture>
                  <div id="trackNumsM" aria-label="弯道号格"></div>
                  <div id="trackFrench" aria-label="法式绿键"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    </div><!-- /.slide-main -->
    </div><!-- /.slide-root -->

    <footer class="dock">
      <div class="act-bar" id="actBar" aria-label="下注操作">
        <button type="button" class="act-btn" id="btnUndo" aria-label="撤销">
          <svg class="act-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#22c55e" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62C8.77 11.22 10.54 10.5 12.5 10.5c3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
          </svg>
        </button>
        <button type="button" class="act-btn" id="btnConfirm" aria-label="确定">
          <svg class="act-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7" />
          </svg>
        </button>
        <button type="button" class="act-btn" id="btnCancel" aria-label="取消">
          <svg class="act-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" d="M7 7l10 10M17 7L7 17" />
          </svg>
        </button>
      </div>

        if (balance < total) { toast('积分不足'); return false; }
        playClick();
        setBalance(balance - total, { type: 'bet', note: '确认下注', source: 'roulette-m' });
        const ts = Date.now();
        const betRows = keys.map((k, i) => ({
          betId: String(ts) + String(i).padStart(2, '0') + String(Math.floor(Math.random() * 90) + 10),
          ts,
          roundId: String(roundId || ''),
          tableId: 'R501',
          result: '',
          market: k,
          key: k,
          stake: Math.round(Number(draft[k]) || 0),
          pnl: 0,

        }));
        pushBetRecords(betRows);
        keys.forEach((k) => {
          confirmed[k] = (Number(confirmed[k]) || 0) + (Number(draft[k]) || 0);
        });
        draft = Object.create(null);
        undoStack = [];
        paintBets();
        holdPhaseBanner('下注成功', 1400);
        /* 与已验收：确定后播「下注成功」；void 不挡局流程 / 倒计时 */
        if (!Voice.isOff()) void Voice.speak('下注成功');
        return true;
      }

      function evalKey(key, win) {
        const n = numFromKey(key);
        if (n != null) return { win: n === win, mult: 36 };
        const inside = parseInsideBetKey(key);
        if (inside) {
          const hit = inside.nums.indexOf(win) >= 0;
          const multMap = { straight: 36, split: 18, street: 12, corner: 9, line: 6 };
          return { win: hit, mult: multMap[inside.kind] || 2 };
        }
        if (FRENCH[key]) {
          /* 电脑同款：法式键命中组内号，按注型简化连本×2 */
          return { win: FRENCH[key].has(win), mult: 2 };
        }
        if (key === 'red') return { win: win !== 0 && RED.has(win), mult: 2 };
        if (key === 'black') return { win: win !== 0 && !RED.has(win), mult: 2 };
        if (key === 'odd') return { win: win !== 0 && win % 2 === 1, mult: 2 };
        if (key === 'even') return { win: win !== 0 && win % 2 === 0, mult: 2 };
        if (key === 'small') return { win: win >= 1 && win <= 18, mult: 2 };
        if (key === 'big') return { win: win >= 19 && win <= 36, mult: 2 };
        if (key === 'd1' || key === 'dozen1') return { win: win >= 1 && win <= 12, mult: 3 };
        if (key === 'd2' || key === 'dozen2') return { win: win >= 13 && win <= 24, mult: 3 };
        if (key === 'd3' || key === 'dozen3') return { win: win >= 25 && win <= 36, mult: 3 };
        if (key === 'col1') return { win: win !== 0 && win % 3 === 1, mult: 3 };
        if (key === 'col2') return { win: win !== 0 && win % 3 === 2, mult: 3 };
        if (key === 'col3') return { win: win !== 0 && win % 3 === 0, mult: 3 };
        return { win: false, mult: 0 };
      }
      function settle(win) {
        let returned = 0;
        let staked = 0;
        let net = 0;
        Object.keys(confirmed).forEach((k) => {
          const stake = Number(confirmed[k]) || 0;
          if (stake <= 0) return;
          staked += stake;
          const r = evalKey(k, win);
          if (r.win) {
            returned += stake * r.mult;
            net += stake * (r.mult - 1);
          } else {
            net -= stake;
          }
        });
        confirmed = Object.create(null);
        draft = Object.create(null);
        undoStack = [];
        if (returned > 0) {
          setBalance(balance + returned, { type: 'payout', note: '开奖派彩', source: 'roulette-m' });
        }
        paintBets();
        return { staked, net, returned };
      }

      function normDeg(d) {
        return ((d % 360) + 360) % 360;
      }
      function readCssRotate(el) {
        if (!el) return 0;
        const t = getComputedStyle(el).transform;
        if (!t || t === 'none') return 0;
        const m = t.match(/matrix\(([^)]+)\)/);
        if (m) {
          const p = m[1].split(',').map(Number);
          return Math.atan2(p[1], p[0]) * 180 / Math.PI;
        }
        const m3 = t.match(/matrix3d\(([^)]+)\)/);
        if (m3) {
          const p = m3[1].split(',').map(Number);
          return Math.atan2(p[1], p[0]) * 180 / Math.PI;
        }
        return 0;
      }
      function pocketAngle(n) {
        const i = EU_ORDER.indexOf(n);
        return ZERO_CENTER_DEG + (i < 0 ? 0 : i) * SLOT;
      }
      function ballGeomFromCss(cssDeg) {
        return normDeg(cssDeg - BALL_CSS_TO_GEOM);
      }
      function setWheelAngle(deg, ms) {
        if (!wheelSpin) return;
        wheelAngle = deg;
        wheelSpin.style.transition = ms > 0
          ? 'transform ' + ms + 'ms cubic-bezier(.08,.72,.12,1)'
          : 'none';
        wheelSpin.style.transform = 'rotate(' + wheelAngle + 'deg)';
      }
      function setBallAngle(deg, ms) {
        if (!wheelBallArm) return;
        ballAngle = deg;
        wheelBallArm.style.transition = ms > 0
          ? 'transform ' + ms + 'ms cubic-bezier(.05,.75,.12,1)'

        wheelBallArm.style.transform = 'rotate(' + ballAngle + 'deg)';
      }
      function showBall(show) {

      function startIdleSpin() {
        if (!wheelSpin) return;
        wheelSpin.style.transition = 'none';
        const base = normDeg(wheelAngle);
        wheelSpin.style.transform = 'rotate(' + base + 'deg)';
        wheelSpin.style.animation = 'none';
        void wheelSpin.offsetWidth;
        wheelSpin.style.animation = 'wheel-idle-cw 22s linear infinite';
        wheelSpin.style.animationDelay = (-(base / 360) * 22) + 's';
        wheelSpin.classList.add('is-idle');
      }
      function stopIdleSpinCapture() {
        if (!wheelSpin) return normDeg(wheelAngle);
        const ang = normDeg(readCssRotate(wheelSpin));
        wheelSpin.classList.remove('is-idle');
        wheelSpin.style.animation = 'none';
        wheelSpin.style.transition = 'none';
        wheelAngle = ang;
        wheelSpin.style.transform = 'rotate(' + wheelAngle + 'deg)';
        return wheelAngle;
      }
      /**
       * 电脑同款开奖轨迹：外圈滚→掉入口袋→隔板跳动；配 roll + fret 音效
       */
      function runBallAndWheelStop(winNum) {
        const TOTAL_MS = 7600;
        const R_OUTER = 6.8;
        const R_POCKET = 50 - WHEEL_POCKET_DIST;
        const DROP_U0 = 0.55;
        const DROP_U1 = 0.61;
        const RATTLE_END = 0.88;
        const w0 = stopIdleSpinCapture();
        showBall(true);
        const ballEl = document.getElementById('wheelBall');
        if (ballEl) {
          ballEl.style.transition = 'none';
          ballEl.style.top = R_OUTER.toFixed(2) + '%';
        }
        const b0 = normDeg(ballAngle || 0);
        setBallAngle(b0, 0);

        const winIdx = Math.max(0, EU_ORDER.indexOf(winNum));
        const hops = 6 + ((Math.random() * 5) | 0);
        const startIdx = winIdx + hops;
        const markerCss = Math.random() * 360;
        const markerGeom = ballGeomFromCss(markerCss);
        const wheelTargetLocal = normDeg(markerGeom - pocketAngle(winNum));
        let wDelta = normDeg(wheelTargetLocal - normDeg(w0));
        if (wDelta < 80) wDelta += 360;
        wDelta += 360 * (1 + ((Math.random() * 2) | 0));
        const w1 = w0 + wDelta;

        let bDelta = normDeg(b0 - markerCss);
        if (bDelta < 1) bDelta = 360;
        bDelta += 360 * (9 + ((Math.random() * 3) | 0));

        const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
        const easeOutPow = (t, p) => 1 - Math.pow(1 - t, p);
        const easeInCubic = (t) => t * t * t;
        const BALL_EASE_P = 2.55;
        const ballProgress = (u) => 1 - Math.pow(1 - Math.min(1, Math.max(0, u)), BALL_EASE_P);
        const finalBallCss = () => normDeg(pocketAngle(winNum) + BALL_CSS_TO_GEOM + w1);
        const pocketFloatAt = (u) => {
          if (u <= DROP_U0) return startIdx;
          if (u >= RATTLE_END) return winIdx;
          const t = (u - DROP_U0) / (RATTLE_END - DROP_U0);
          const e = easeOutPow(t, 2.35);
          let f = startIdx - hops * e;
          f += Math.sin(t * Math.PI * (hops * 0.85 + 0.5)) * (1 - e) * 0.42;
          return f;
        };
        const localDegFromFloat = (f) => ZERO_CENTER_DEG + f * SLOT;
        const radiusAt = (u, justHit) => {
          if (u < DROP_U0) return R_OUTER;
          if (u < DROP_U1) {
            const t = (u - DROP_U0) / (DROP_U1 - DROP_U0);
            return R_OUTER + (R_POCKET - R_OUTER) * easeInCubic(t);
          }
          if (u < RATTLE_END) {
            const t = (u - DROP_U1) / (RATTLE_END - DROP_U1);
            const amp = (1 - t) * (1 - t) * (justHit ? 1.6 : 1.1);
            return R_POCKET - amp;
          }
          return R_POCKET;
        };

        playBallSpinSfx();
        const t0 = performance.now();
        let raf = 0;
        let dropArmed = false;
        let lastPocketI = -999;

        return new Promise((resolve) => {
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            if (raf) cancelAnimationFrame(raf);
            const endCss = finalBallCss();
            setWheelAngle(w1, 0);
            setBallAngle(endCss, 0);
            wheelAngle = normDeg(w1);
            ballAngle = normDeg(endCss);
            if (ballEl) ballEl.style.top = R_POCKET.toFixed(2) + '%';
            stopBallSpinSfx();
            resolve();
          };
          const frame = (now) => {
            if (settled) return;
            const u = Math.min(1, (now - t0) / TOTAL_MS);
            const wNow = w0 + wDelta * easeOutCubic(u);
            setWheelAngle(wNow, 0);
            let ang;
            let justHit = false;
            if (u < DROP_U0) {
              ang = b0 - bDelta * ballProgress(u);
            } else {
              if (!dropArmed) {
                dropArmed = true;
                stopBallRollOnly();
                playFretClick(1);
                lastPocketI = Math.floor(pocketFloatAt(u) + 1e-6);
              }
              const f = pocketFloatAt(u);
              const pocketI = Math.floor(f + 1e-6);
              if (pocketI !== lastPocketI) {
                justHit = true;
                lastPocketI = pocketI;
                const t = (u - DROP_U0) / Math.max(1e-6, RATTLE_END - DROP_U0);
                playFretClick(0.95 - Math.min(0.45, t * 0.45));
              }
              const local = localDegFromFloat(f);
              ang = normDeg(local + BALL_CSS_TO_GEOM + wNow);
            }
            setBallAngle(ang, 0);
            if (ballEl) ballEl.style.top = radiusAt(u, justHit).toFixed(2) + '%';
            if (u < 1) {
              raf = requestAnimationFrame(frame);
              return;
            }
            finish();
          };
          raf = requestAnimationFrame(frame);
          setTimeout(finish, TOTAL_MS + 400);
        });
      }
      async function speakEnWinNumber(n) {
        if (Voice.isOff()) return false;
        const num = Math.max(0, Math.min(36, n | 0));
        if (IS_EMBED) return await postParentSfxAwait('enNum', num);

      async function runRound() {
        const token = ++timerToken;
        bumpRound();
        hideResultBoard();
        hideRailBall();
        showBall(false);
        phase = 'betting';
        timerLeft = BET_SEC;
        paintTimer();
        paintMeta();
        /* 与电脑：首局欢迎 → 开始下注口播 → 整秒倒计时滴答 → 停止下注口播 → 小球/报数 */
        if (!welcomePlayed) await playWelcomeOnce();
        if (token !== timerToken) return;
        startIdleSpin();
        void holdPhaseBanner('开始下注', 1400);
        if (!Voice.isOff()) await Voice.speak('开始下注');
        else await sleep(900);
        if (token !== timerToken) return;

        for (let t = BET_SEC; t >= 1; t--) {
          if (token !== timerToken) return;
          timerLeft = t;
          paintTimer();
          if (!Voice.isOff()) {
            if (t <= 10) Voice.bombTick();
            else Voice.tick();
          }
          await sleep(1000);
        }
        if (token !== timerToken) return;
        timerLeft = 0;
        paintTimer();
        phase = 'closed';
        paintMeta();
        if (totalDraft() > 0) cancelDraft();
        void holdPhaseBanner('停止下注', 1800);
        if (!Voice.isOff()) await Voice.speak('停止下注');
        else await sleep(400);
        if (token !== timerToken) return;

        const win = EU_ORDER[Math.floor(Math.random() * EU_ORDER.length)];
        await runBallAndWheelStop(win);
        if (token !== timerToken) return;
        paintResultBoard(win);
        const railP = rollHistoryRailBall(win);
        const voiceP = speakEnWinNumber(win);
        await Promise.all([railP, voiceP]);
        if (token !== timerToken) return;
        history.unshift(win);
        if (history.length > 40) history.length = 40;
        paintHistory();
        const settled = settle(win);
        phase = 'result';
        paintMeta();
        /* 电脑轮盘：赢/输只显示不口播恭喜/遗憾 */
        if (settled.staked > 0) {
          if (settled.net > 0) await holdPhaseBanner('本局贏 +' + Math.round(settled.net), 2200);
          else if (settled.net < 0) await holdPhaseBanner('输 ' + Math.round(settled.net), 2200);
          else await holdPhaseBanner('本局平', 1600);
        } else {
          await sleep(1800);
        }
        if (token !== timerToken) return;
        runRound();
      }

      buildBoard();
      /* 弯道热区/蒙版延后到首次打开弯道再建，避免进页拖慢 */
      /* 电脑同款：悬停/按住预览黄（主盘号 ↔ 弯道号 / 法式） */
      function bindHoverLit(root, filterFn) {
        if (!root) return;
        root.querySelectorAll('[data-bet]').forEach((zone) => {
          if (filterFn && !filterFn(zone)) return;
          const key = zone.dataset.bet;
          if (!key) return;
          zone.addEventListener('pointerenter', () => { hoverMarket = key; paintLit(); });
          zone.addEventListener('pointerdown', () => { hoverMarket = key; paintLit(); });
          zone.addEventListener('pointerleave', () => {
            if (hoverMarket === key) hoverMarket = null;
            paintLit();
          });
          zone.addEventListener('pointerup', () => {
            if (hoverMarket === key) hoverMarket = null;
            paintLit();
          });
        });
      }
      bindHoverLit(boardGrid, (z) => z.classList.contains('n') || z.classList.contains('zero') || z.classList.contains('out'));
      /* 进页 1.8s 后静默预建弯道，不挡首屏 */
      setTimeout(() => { try { ensureTrackBoard(); } catch (_) {} }, 1800);
      paintHistory();
      paintMeta();
      paintTimer();
      layoutPcFrame();
      window.addEventListener('resize', layoutPcFrame);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', layoutPcFrame);

      /* 进桌消黑屏：首帧就通知父页揭封面；绝不 await，不挡倒计时 */
      if (IS_EMBED) {
        const notifyReady = () => {
          try { window.parent.postMessage({ type: 'fg-embed-ready' }, '*'); } catch (_) {}
        };
        requestAnimationFrame(() => requestAnimationFrame(notifyReady));
      }

      /* 先 lean 拉真实余额并上屏，再 hydrate 流水；回前台再同步 */
      void syncBalanceLean();
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) void syncBalanceLean();
      });

      wallet.hydrate().then((res) => {
        const n = res && typeof res === 'object' && res.balance != null ? res.balance : res;
        if (n != null && Number.isFinite(Number(n))) applyServerBalance(n);
        const doc = res && res.doc;
        /* 仅离线/失败（doc 空）才推本机流水；有服务器响应但无日志数组时不误推 */
        if (doc && Array.isArray(doc.creditlog) && doc.creditlog.length) {
          try { mergeCreditLogFromServer(doc.creditlog); } catch (_) {}
        } else if (!doc) {
          const localCredits = loadCreditLog();
          if (localCredits.length) {
            try { wallet.schedule({ creditAppend: localCredits.slice(0, 500) }); } catch (_) {}
          }
        }
        if (doc && Array.isArray(doc.betlog) && doc.betlog.length) {
          try { mergeBetLogFromServer(doc.betlog); } catch (_) {}
        } else if (!doc) {
          const localBets = loadBetLog();
          if (localBets.length) {
            try { wallet.schedule({ betAppend: localBets.slice(0, 500) }); } catch (_) {}
          }
        }
        paintMeta();
        void syncBalanceLean();
      }).catch(() => { void syncBalanceLean(); });

      runRound();
    })();
  </script>
</body>
</html>
