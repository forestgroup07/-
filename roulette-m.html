<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a1210" />
  <meta name="robots" content="noindex,nofollow" />
  <title>輪盤 R501 · 手机版</title>
  <link rel="preload" as="image" href="assets/roulette/wheel-disc.png?v=1.2.4" type="image/png" fetchpriority="high" />
  <link rel="preload" as="image" href="assets/roulette/m-kbd-face.webp?v=1.3.5" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="assets/roulette/m-kbd-face.jpg?v=1.3.5" type="image/jpeg" fetchpriority="high" />
  <style>
    :root {
      --bg: #0a1210;
      --teal: #0e3d38;
      --teal2: #12544c;
      --cell: #0f4a43;
      --cell-line: rgba(90, 200, 170, .28);
      --gold: #e8c76a;
      --gold2: #f5dfa0;
      --red: #c62828;
      --black: #1a1a1a;
      --muted: #9bb8b0;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --v: 1.0.0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: #f2f6f4;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    .app {
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding-top: var(--safe-t);
      padding-bottom: var(--safe-b);
      max-width: 480px;
      margin: 0 auto;
      background: linear-gradient(180deg, #07110f 0%, #0b1a17 40%, #0a1412 100%);
    }
    /* 关闭=露边一半；打开=完整竖向跑道盖住露边（一条整卵形），盘面左让 */
    .slide-root {
      position: relative;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      /* 整卵焊进底图(1479×2059)：无旋转 scale+平移，左列外沿竖直对齐 */
      --face-w: 1479;
      --face-base: 1200;
      --face-wide: 123.25%; /* 1479/1200 */
      --grid-w: 81.136%; /* 1200/1479 */
      --board-pan: -18.864%; /* (1479-1200)/1479 */
      --track-left: 63.243%;
      --track-top: 0%;
      --track-open: 36.596%;
      --track-h: 98.384%;
    }
    .slide-main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
    }
    .board-pan-inner {
      position: relative;
      width: var(--face-wide);
      transition: transform .38s cubic-bezier(.22, .7, .2, 1);
      will-change: transform;
    }
    /* 黄键打开：焊死底图整块左移，左侧绿键出画、右侧整卵入画 */
    .app.is-track .board-pan-inner { transform: translateX(var(--board-pan)); }
    .slide-track {
      position: absolute;
      top: var(--track-top);
      left: var(--track-left);
      width: var(--track-open);
      height: var(--track-h);
      display: block;
      opacity: 0;
      background: transparent;
      z-index: 8;
      box-shadow: none;
      overflow: visible;
      pointer-events: none;
    }
    .app.is-track .slide-track {
      opacity: 1;
      pointer-events: auto;
    }
    /* 卵已焊进底图：浮层只留热区，隐藏第二张卵图 */
    .slide-track .track-face,
    .slide-track picture { display: none !important; }
    .app.is-track .race-open-hit { pointer-events: none; visibility: hidden; }
    .track-top {
      display: none;
    }
    .track-back {
      position: absolute;
      left: .35rem;
      top: .35rem;
      z-index: 5;
      width: 1.85rem; height: 1.85rem;
      border-radius: 999px;
      background: rgba(0,0,0,.4);
      border: 1px solid rgba(240, 211, 146, .4);
      color: #f0d392;
      font-size: 1.15rem;
      line-height: 1;
      pointer-events: auto;
    }
    .track-title { display: none; }
    .track-body {
      position: relative;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .track-stage {
      position: absolute;
      inset: 0;
      margin: 0;
    }
    .track-face {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      object-position: left top;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      border-radius: 0;
    }
    #trackFrench,
    #trackNumsM {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #trackNumsM { z-index: 2; }
    #trackFrench { z-index: 3; } /* 中间绿键压在号格 AABB 之上 */
    #trackFrench .hit,
    #trackNumsM .hit {
      position: absolute;
      pointer-events: auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 0;
      border: 0;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
      z-index: 1;
      border-radius: 18% / 22%;
    }
    #trackFrench .hit.has-mask,
    #trackNumsM .hit.has-mask {
      border-radius: 0;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }
    /* 电脑同款：蒙格热区黄脸透字 */
    #trackFrench .hit::before,
    #trackNumsM .hit::before {
      content: "" !important;
      display: block !important;
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: transparent;
      pointer-events: none;
      z-index: 0;
    }
    #trackFrench .hit.is-lit,
    #trackNumsM .hit.is-lit {
      z-index: 2;
    }
    #trackFrench .hit.is-lit::before,
    #trackNumsM .hit.is-lit::before {
      /* 与主键盘 .n.is-lit 同色同透明度，叠在清晰 1.3.2 底上 */
      background: rgba(232, 196, 48, 0.50) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(120,80,0,.14);
    }
    #trackNumsM .hit .chip-on {
      z-index: 6;
    }
    .race-open-hit {
      position: absolute;
      left: 76%;
      top: 0;
      width: 24%;
      height: 92%;
      z-index: 6;
      pointer-events: auto;
      background: transparent;
      border: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* —— 顶屏：电脑转盘区+绿布+黑滑道；底沿裁到滑道下沿，绿键顶死接上 —— */
    .stage {
      position: relative;
      width: 100%;
      /* 裁到黑滑道底（felt 高×97.6423%），下面不留空绿布 */
      aspect-ratio: 884 / 704;
      height: auto;
      max-height: min(46vh, 400px);
      background: #0f6b32;
      overflow: hidden;
    }
    .video-well {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      /* 仍按完整 felt 比例排轮盘/滑道，多出的底被 stage 裁掉 */
      height: 102.414%;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      background: #0f6b32;
    }
    /* 电脑屏转盘区绿布（含木台/滑道底，无烤死中奖号） */
    .felt-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 电脑 wheel-disc：按 pc-full-ref 相对几何叠在绿布上 */
    .wheel-wrap {
      position: absolute;
      left: 12.0159%;
      top: -8.8909%;
      width: 78.9592%;
      height: auto;
      aspect-ratio: 1 / 1;
      z-index: 25;
      pointer-events: none;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,.4));
    }
    .wheel-spin {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      transform: rotate(0deg);
      transform-origin: 50% 50%;
      will-change: transform;
      overflow: hidden;
    }
    .wheel-spin.is-idle {
      animation: wheel-idle-cw 22s linear infinite;
    }
    @keyframes wheel-idle-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .wheel-disc {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      z-index: 3;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .wheel-ball-layer {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .wheel-ball-layer.show { opacity: 1; }
    .wheel-ball-arm {
      position: absolute;
      inset: 0;
      transform: rotate(0deg);
      transform-origin: 50% 50%;
      will-change: transform;
    }
    .wheel-ball {
      position: absolute;
      left: 50%;
      top: 6.8%;
      width: 2.95%;
      height: 2.95%;
      min-width: 7px;
      min-height: 7px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff 0%, #ececec 34%, #c8c8c8 58%, #7a7a7a 82%, #2a2a2a 100%);
      box-shadow: 0 1px 2px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.55);
    }
    /* 黑滑道：相对绿布裁切窗，与电脑同款长洞；开奖前无数字 */
    #pcRail {
      position: absolute;
      left: 9.0498%;
      top: 88.2109%;
      width: 77.4886%;
      height: 9.4314%;
      z-index: 55;
      pointer-events: none;
      border-radius: 999px;
      overflow: visible;
      box-sizing: border-box;
      background: url("assets/roulette/wheel-bases/history-rail-hole.png?v=1.1.8") center / 100% 100% no-repeat;
    }
    /* 红球：挂在绿布舞台上；仅开奖后出现，数字=本局真实中奖号 */
    #pcRailBall {
      position: absolute;
      left: 12.2947%;
      top: 91.5413%;
      width: 12.5465%;
      height: auto;
      aspect-ratio: 1 / 1;
      min-width: 22px;
      min-height: 22px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 56;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background:
        radial-gradient(circle at 30% 26%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 28%),
        radial-gradient(circle at 50% 55%, #ff5252 0%, #e53935 38%, #c62828 62%, #7f0000 100%);
      box-shadow:
        0 4px 8px rgba(0,0,0,.5),
        0 1px 0 rgba(255,255,255,.22) inset,
        0 -2px 4px rgba(0,0,0,.35) inset;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      font-size: clamp(1.4rem, 6.4vw, 1.9rem);
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,.55);
      opacity: 0;
      visibility: hidden;
      will-change: left, transform;
    }
    #pcRailBall.show {
      opacity: 1;
      visibility: visible;
    }
    #pcRailBall.is-rolling {
      animation: pc-rail-ball-spin 1.35s linear;
    }
    @keyframes pc-rail-ball-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(1080deg); }
    }

    .topbar {
      position: absolute; z-index: 5; left: 0; right: 0; top: 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: .55rem .7rem 0;
    }
    .top-left { display: flex; align-items: center; gap: .4rem; }
    .btn-back {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,.35);
      display: grid; place-items: center;
      font-size: 1rem; line-height: 1;
    }
    .table-name { font-size: .95rem; font-weight: 700; letter-spacing: .02em; text-shadow: 0 1px 3px #000; }
    .top-right { display: flex; align-items: center; gap: .55rem; }
    .ico {
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(0,0,0,.35);
      display: grid; place-items: center;
      color: #f0e6c8; font-size: .85rem;
      border: 0; padding: 0;
    }
    .round-id {
      position: absolute; z-index: 5; right: .7rem; top: 2.35rem;
      font-size: .68rem; color: rgba(255,255,255,.78);
      text-shadow: 0 1px 2px #000;
    }

    /* 倒计时：滑道上方左侧，不挡绿键接缝 */
    .timer {
      --p: 1;
      --timer-ring: #6fdc4a;
      --timer-pie: #6fdc4a66;
      position: absolute; z-index: 6;
      left: .55rem; bottom: auto; top: 62%;
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--timer-ring);
      text-shadow: 0 1px 2px rgba(0,0,0,.55);
      pointer-events: none;
      background:
        radial-gradient(farthest-side, rgba(8, 12, 8, 0.58) calc(100% - 0.13em), transparent calc(100% - 0.12em)),
        conic-gradient(var(--timer-ring) calc(var(--p) * 1turn), transparent 0);
    }
    .timer::before {
      content: "";
      position: absolute;
      inset: 0.13em;
      border-radius: 50%;
      background: conic-gradient(var(--timer-pie) calc(var(--p) * 1turn), transparent 0);
      pointer-events: none;
    }
    .timer::after {
      content: "";
      position: absolute;
      width: 11%; height: 11%;
      border-radius: 50%;
      background: var(--timer-ring);
      box-shadow: 0 0 0.08em rgba(0,0,0,.35);
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) rotate(calc(var(--p) * 360deg)) translateY(-430%);
      pointer-events: none;
      z-index: 2;
    }
    .timer > span { position: relative; z-index: 1; }
    .timer.closed {
      --timer-ring: #888;
      --timer-pie: #88888866;
      color: #aaa;
    }
    .timer.danger {
      --timer-ring: #ff3b3b;
      --timer-pie: #ff3b3b66;
      color: #ff3b3b;
    }

    /* 开奖结果：紧挨倒计时右侧（滑道上方） */
    .result-board {
      position: absolute; z-index: 8;
      left: calc(.55rem + 56px + .4rem);
      bottom: auto;
      top: calc(62% + 10px);
      display: none;
      align-items: flex-end;
      gap: .45rem;
      padding: 0;
      background: transparent;
      pointer-events: none;
    }
    .result-board.show { display: flex; }
    .result-board .rb-num {
      width: 36px; height: 36px;
      border-radius: 6px;
      border: 2px solid #e6c84a;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.55);
      box-shadow: 0 1px 4px rgba(0,0,0,.5);
      flex: 0 0 36px;
    }
    .result-board .rb-num.is-red { background: #c62828; }
    .result-board .rb-num.is-black { background: #1a1a1a; }
    .result-board .rb-num.is-green { background: #1b7a3a; }
    .result-board .rb-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-bottom: 2px;
      line-height: 1.1;
    }
    .result-board .rb-parity,
    .result-board .rb-size {
      font-size: 1.05rem;
      font-weight: 900;
      text-shadow: 0 1px 3px rgba(0,0,0,.65);
    }
    .result-board .rb-parity.is-odd { color: #4ea1ff; }
    .result-board .rb-parity.is-even { color: #ff5a5a; }
    .result-board .rb-size.is-big { color: #ff5a5a; }
    .result-board .rb-size.is-small { color: #4ea1ff; }

    /* 接缝处不要「轮盘」角标挡在滑道旁 */
    .brand-mark { display: none; }
    .phase-banner {
      position: absolute;
      left: 50%; top: 42%;
      transform: translate(-50%, -50%) scale(.96);
      z-index: 45;
      padding: 0.55em 1.25em;
      border-radius: 0.2em;
      background: rgba(0,0,0,.62);
      border: 1px solid rgba(255,220,140,.45);
      color: #ffe29a;
      font-size: clamp(1.05rem, 4.2vw, 1.35rem);
      font-weight: 800;
      letter-spacing: 0.12em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0; visibility: hidden;
      transition: opacity .22s ease, transform .22s ease, visibility .22s;
      text-shadow: 0 2px 8px rgba(0,0,0,.7);
    }
    .phase-banner.show {
      opacity: 1; visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
    .toast {
      position: absolute; z-index: 40; left: 50%; top: 58%;
      transform: translate(-50%, -50%);
      padding: .45rem .9rem; border-radius: 8px;
      background: rgba(0,0,0,.72); color: #fff;
      font-size: .88rem; font-weight: 700;
      opacity: 0; pointer-events: none; transition: opacity .2s;
      white-space: nowrap; visibility: hidden;
    }
    .toast.show { opacity: 1; visibility: visible; }

    /* —— 绿台键盘：公司原图原样贴上，顶死接黑滑道 —— */
    .board-wrap {
      position: relative;
      overflow: hidden;
      min-height: 0;
      background: #508c87;
      border-top: 0;
      margin-top: 0;
      padding-top: 0;
    }
    .board-scroll {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    .board-scroll::-webkit-scrollbar { display: none; }
    .board-face-wrap {
      position: relative;
      width: 100%;
      line-height: 0;
      overflow: hidden;
    }
    .board-face {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    /* 热区仍按原 1200 宽坐标系（焊图左段） */
    .board-grid {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--grid-w);
      height: 100%;
      z-index: 2;
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      pointer-events: none;
    }
    .board-grid .zero,
    .board-grid .n {
      position: absolute;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      color: transparent !important;
      font-size: 0 !important;
      border-radius: 0;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto;
      z-index: 5;
      cursor: pointer;
    }
    .chip-on {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      min-width: 1.35em;
      padding: .05em .28em;
      border-radius: 999px;
      background: rgba(0,0,0,.72);
      border: 1px solid rgba(240, 211, 146, .65);
      color: #ffe29a;
      font-size: .58rem;
      font-weight: 800;
      line-height: 1.2;
      pointer-events: none;
      z-index: 6;
    }
    /* 亮层铺满蒙版格（与底图格对齐） */
    .board-grid .n.is-lit,
    .board-grid .zero.is-lit {
      box-shadow: none !important;
    }
    .board-grid .n.is-lit::before,
    .board-grid .zero.is-lit::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 8% / 10%;
      background: rgba(232, 196, 48, 0.50);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(120,80,0,.14);
      pointer-events: none;
      z-index: 1;
    }
    .board-grid .zero.is-lit::before {
      border-radius: 10% / 14%;
    }

    /* —— 底栏（对标参考图） —— */
    .dock {
      position: relative;
      background: linear-gradient(180deg, #0d2c28, #081a18);
      border-top: 1px solid rgba(90, 200, 170, .2);
      padding: .35rem .55rem 0;
    }
    .act-bar {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: .45rem;
      margin-bottom: .35rem;
    }
    .act-bar.show { display: grid; }
    .act-btn {
      height: 40px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff4b8 0%, #f7e68a 48%, #efd66a 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 -1px 0 rgba(180, 140, 40, 0.28),
        0 3px 8px rgba(0, 0, 0, 0.28);
      display: grid; place-items: center;
    }
    .act-btn .act-ico { width: 28px; height: 28px; display: block; pointer-events: none; }
    .dock-meta {
      display: flex; align-items: center; justify-content: space-between;
      gap: .4rem; margin-bottom: .35rem;
    }

        raceHit.setAttribute('aria-label', '打开弯道');
        boardGrid.appendChild(raceHit);
      }
      function buildTrackBoard() {
        const numsRoot = document.getElementById('trackNumsM');
        const frRoot = document.getElementById('trackFrench');
        if (!numsRoot || !frRoot) return;
        numsRoot.innerHTML = '';
        frRoot.innerHTML = '';
        /* 底图蒙格：LOCKED 卵面像素归属 → m-track-masks（电脑同款 mask 黄脸） */
        TRACK_ORDER.forEach((n) => {
          const box = TRACK_CELLS_M[n];
          if (!box || !box.mask) return;
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'hit has-mask';
          b.dataset.bet = 'n' + n;
          b.dataset.track = '1';
          b.setAttribute('aria-label', '滚道' + n);
          b.style.left = box.left + '%';
          b.style.top = box.top + '%';
          b.style.width = box.w + '%';
          b.style.height = box.h + '%';
          const mu = box.mask + '?v=' + V;
          b.style.webkitMaskImage = 'url(' + mu + ')';
          b.style.maskImage = 'url(' + mu + ')';
          b.style.webkitMaskSize = '100% 100%';
          b.style.maskSize = '100% 100%';
          b.style.webkitMaskRepeat = 'no-repeat';
          b.style.maskRepeat = 'no-repeat';
          numsRoot.appendChild(b);
        });
        Object.keys(FRENCH_CELLS_M).forEach((key) => {
          const box = FRENCH_CELLS_M[key];
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'hit has-mask';
          b.dataset.bet = key;
          b.setAttribute('aria-label', box.label || key);
          b.style.left = box.left + '%';
          b.style.top = box.top + '%';
          b.style.width = box.w + '%';
          b.style.height = box.h + '%';
          const mu = box.mask + '?v=' + V;
          b.style.webkitMaskImage = 'url(' + mu + ')';
          b.style.maskImage = 'url(' + mu + ')';
          b.style.webkitMaskSize = '100% 100%';
          b.style.maskSize = '100% 100%';
          b.style.webkitMaskRepeat = 'no-repeat';
          b.style.maskRepeat = 'no-repeat';
          frRoot.appendChild(b);
        });
      }
      function openTrack() {
        app.classList.add('is-track');
        const pane = document.getElementById('slideTrack');
        if (pane) pane.setAttribute('aria-hidden', 'false');
        const ico = document.getElementById('btnTrackIco');
        if (ico) ico.setAttribute('aria-label', '关闭弯道');
        paintBets();
      }
      function closeTrack() {
        app.classList.remove('is-track');
        const pane = document.getElementById('slideTrack');
        if (pane) pane.setAttribute('aria-hidden', 'true');
        const ico = document.getElementById('btnTrackIco');
        if (ico) ico.setAttribute('aria-label', '打开弯道');
      }

      function addDraft(key, amt) {
        if (phase !== 'betting') return;
        const a = Math.max(0, Math.round(Number(amt) || 0));
        if (!key || a <= 0) return;
        if (availableBal() < a) { toast('积分不足'); return; }
        draft[key] = (Number(draft[key]) || 0) + a;
        undoStack.push({ key, amt: a });
        paintBets();
      }
      /* 电脑同款：内注点一下覆盖该盘口为当前筹码（可撤销回上一值） */
      function placeInsideDraft(key, amt) {
        if (phase !== 'betting') return;
        const next = Math.max(0, Math.round(Number(amt) || 0));
        if (!key || next <= 0) return;
        const other = totalDraft() - (Number(draft[key]) || 0);
        if (availableBal() < other + next) { toast('积分不足'); return; }
        undoStack.push({ key, prev: Number(draft[key]) || 0, mode: 'inside' });
        draft[key] = next;
        paintBets();
      }
      /* 法式绿键：按配方在主键盘对应分注/街注/角注/直注落筹（主盘变黄） */
      function placeFrenchDraft(frenchKey, unitAmt) {
        if (phase !== 'betting') return;
        const unit = Math.max(0, Math.round(Number(unitAmt) || 0));
        const places = FRENCH_PLACEMENTS[frenchKey];
        if (!unit || !places || !places.length) return;
        let need = 0;
        const ops = places.map((p) => {
          const key = insideBetKey(p.kind, p.nums);
          const add = unit * (p.u || 1);
          need += add;
          return { key, add };
        });
        if (availableBal() < need) { toast('积分不足'); return; }
        const prev = Object.create(null);
        ops.forEach(({ key, add }) => {
          prev[key] = Number(draft[key]) || 0;
          draft[key] = prev[key] + add;
        });
        undoStack.push({ mode: 'french', prev });
        paintBets();
      }
      function undoBet() {
        const last = undoStack.pop();
        if (!last) return;
        if (last.mode === 'french' && last.prev) {
          Object.keys(last.prev).forEach((key) => {
            const v = Math.max(0, Number(last.prev[key]) || 0);
            if (v > 0) draft[key] = v;
            else delete draft[key];
          });
        } else if (last.mode === 'inside') {
          const prev = Math.max(0, Number(last.prev) || 0);
          if (prev > 0) draft[last.key] = prev;
          else delete draft[last.key];
        } else {
          draft[last.key] = Math.max(0, (Number(draft[last.key]) || 0) - (Number(last.amt) || 0));
          if (!draft[last.key]) delete draft[last.key];
        }
        paintBets();
      }
      function cancelDraft() {
        draft = Object.create(null);
        undoStack = [];
        paintBets();
      }
      function confirmBet() {
        if (phase !== 'betting') return false;
        const keys = Object.keys(draft).filter((k) => (Number(draft[k]) || 0) > 0);
        if (!keys.length) { toast('请先选择下注位置'); return false; }
        const total = sumMap(draft);
        if (balance < total) { toast('积分不足'); return false; }
        setBalance(balance - total);
        keys.forEach((k) => {
          confirmed[k] = (Number(confirmed[k]) || 0) + (Number(draft[k]) || 0);
        });
        draft = Object.create(null);
        undoStack = [];
        paintBets();
        holdPhaseBanner('下注成功', 1400);
        return true;
      }

      function evalKey(key, win) {
        const n = numFromKey(key);
        if (n != null) return { win: n === win, mult: 36 };
        const inside = parseInsideBetKey(key);
        if (inside) {
          const hit = inside.nums.indexOf(win) >= 0;
          const multMap = { straight: 36, split: 18, street: 12, corner: 9, line: 6 };
          return { win: hit, mult: multMap[inside.kind] || 2 };
        }
        if (FRENCH[key]) {
          /* 电脑同款：法式键命中组内号，按注型简化连本×2 */
          return { win: FRENCH[key].has(win), mult: 2 };
        }
        if (key === 'red') return { win: win !== 0 && RED.has(win), mult: 2 };
        if (key === 'black') return { win: win !== 0 && !RED.has(win), mult: 2 };
        if (key === 'odd') return { win: win !== 0 && win % 2 === 1, mult: 2 };
        if (key === 'even') return { win: win !== 0 && win % 2 === 0, mult: 2 };
        if (key === 'small') return { win: win >= 1 && win <= 18, mult: 2 };
        if (key === 'big') return { win: win >= 19 && win <= 36, mult: 2 };
        if (key === 'dozen1') return { win: win >= 1 && win <= 12, mult: 3 };
        if (key === 'dozen2') return { win: win >= 13 && win <= 24, mult: 3 };
        if (key === 'dozen3') return { win: win >= 25 && win <= 36, mult: 3 };
        if (key === 'col1') return { win: win !== 0 && win % 3 === 1, mult: 3 };
        if (key === 'col2') return { win: win !== 0 && win % 3 === 2, mult: 3 };
        if (key === 'col3') return { win: win !== 0 && win % 3 === 0, mult: 3 };
        return { win: false, mult: 0 };
      }
      function settle(win) {
        let returned = 0;
        Object.keys(confirmed).forEach((k) => {
          const stake = Number(confirmed[k]) || 0;
          if (stake <= 0) return;
          const r = evalKey(k, win);
          if (r.win) returned += stake * r.mult;
        });
        confirmed = Object.create(null);
        draft = Object.create(null);
        undoStack = [];
        if (returned > 0) setBalance(balance + returned);
        paintBets();
        if (returned > 0) toast('本局贏 +' + returned, 2000);
      }

      function angleForNum(n) {
        const idx = EU_ORDER.indexOf(n);
        const slot = 360 / EU_ORDER.length;
        /* 盘面图 0 点朝上附近；停到正上方口袋 */
        return -idx * slot;
      }
      function spinTo(win) {
        return new Promise((resolve) => {
          wheelSpin.classList.remove('is-idle');
          const base = angleForNum(win);
          const turns = 4 + Math.floor(Math.random() * 2);
          const target = wheelAngle - (wheelAngle % 360) - turns * 360 + base;
          wheelAngle = target;
          if (wheelBallLayer) wheelBallLayer.classList.add('show');
          if (wheelBallArm) {
            wheelBallArm.style.transition = 'transform 4.8s cubic-bezier(.12,.7,.08,1)';
            wheelBallArm.style.transform = 'rotate(' + (target * -1.15) + 'deg)';
          }
          wheelSpin.style.transition = 'transform 5.2s cubic-bezier(.12,.7,.08,1)';
          wheelSpin.style.transform = 'rotate(' + target + 'deg)';
          setTimeout(() => {
            if (wheelBallLayer) wheelBallLayer.classList.remove('show');
            resolve();
          }, 5400);
        });
      }

      async function runRound() {
        const token = ++timerToken;
        bumpRound();
        hideResultBoard();
        hideRailBall();
        phase = 'betting';
        timerLeft = BET_SEC;
        paintTimer();
        paintMeta();
        holdPhaseBanner('开始下注', 1400);
        wheelSpin.classList.add('is-idle');
        wheelSpin.style.transition = '';

        while (timerLeft > 0) {
          await sleep(250);
          if (token !== timerToken) return;
          timerLeft -= 0.25;
          paintTimer();
        }
        timerLeft = 0;
        paintTimer();
        phase = 'closed';
        paintMeta();
        /* 未确定草稿作废 */
        if (totalDraft() > 0) cancelDraft();
        await holdPhaseBanner('停止下注', 1800);
        if (token !== timerToken) return;

        const win = EU_ORDER[Math.floor(Math.random() * EU_ORDER.length)];
        await spinTo(win);
        if (token !== timerToken) return;
        paintResultBoard(win);
        await rollHistoryRailBall(win);
        if (token !== timerToken) return;
        history.unshift(win);
        if (history.length > 40) history.length = 40;
        paintHistory();
        settle(win);
        phase = 'result';
        paintMeta();
        await sleep(1800);
        if (token !== timerToken) return;
        runRound();
      }

      /* chips */
      document.getElementById('chips').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-chip]');
        if (!btn) return;
        const v = btn.getAttribute('data-chip');
        if (v === 'max') {
          selected = Math.max(10, availableBal());
          toast('MAX');
        } else {
          selected = Number(v) || 10;
        }
        document.querySelectorAll('#chips .chip').forEach((c) => {
          c.classList.toggle('sel', c === btn || (v !== 'max' && c.getAttribute('data-chip') === String(selected)));
        });
        if (v === 'max') btn.classList.add('sel');
      });

      let lastZoneBetAt = 0;
      let lastZoneBetKey = '';
      document.getElementById('boardWrap').addEventListener('click', (e) => {
        if (e.target.closest('#raceOpenHit')) {
          openTrack();
          return;
        }
        const btn = e.target.closest('[data-bet]');
        if (!btn || !boardGrid.contains(btn)) return;
        const raw = btn.getAttribute('data-bet');
        const isNum = btn.classList.contains('n') || btn.classList.contains('zero');
        if (!isNum) return;
        const n = numFromKey(raw);
        if (n == null) return;
        const rect = btn.getBoundingClientRect();
        let lxS = rect.width ? (e.clientX - rect.left) / rect.width : 0.5;
        let lyS = rect.height ? (e.clientY - rect.top) / rect.height : 0.5;
        const pc = screenToPcInsideXY(lxS, lyS);
        const hit = resolveInsideBet(n, pc.lx, pc.ly);
        const betKey = insideBetKey(hit.kind, hit.nums);
        const now = Date.now();
        if (betKey === lastZoneBetKey && now - lastZoneBetAt < 450) return;
        lastZoneBetAt = now;
        lastZoneBetKey = betKey;
        placeInsideDraft(betKey, selected);
      });
      /* 弯道全貌：号格单注；绿键 → 主盘法式落筹+变黄 */
      const trackStage = document.getElementById('trackStage');
      if (trackStage) {
        trackStage.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-bet]');
          if (!btn || !trackStage.contains(btn)) return;
          const betKey = btn.getAttribute('data-bet');
          if (!betKey) return;
          const now = Date.now();
          if (betKey === lastZoneBetKey && now - lastZoneBetAt < 450) return;
          lastZoneBetAt = now;
          lastZoneBetKey = betKey;
          if (FRENCH[betKey]) placeFrenchDraft(betKey, selected);
          else placeInsideDraft(betKey, selected);
        });
      }
      document.getElementById('btnTrackIco').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (app.classList.contains('is-track')) closeTrack();
        else openTrack();
      });
      document.getElementById('btnUndo').addEventListener('click', undoBet);
      document.getElementById('btnCancel').addEventListener('click', cancelDraft);
      document.getElementById('btnConfirm').addEventListener('click', confirmBet);
      document.getElementById('btnBack').addEventListener('click', () => {
        if (app.classList.contains('is-track')) { closeTrack(); return; }
        location.href = 'lobby.html';
      });
      document.getElementById('btnMenu').addEventListener('click', () => { location.href = 'lobby.html'; });
      document.getElementById('btnLimit').addEventListener('click', () => {
        toast('限红 20 - 5,000');
      });

      buildBoard();
      buildTrackBoard();
      /* 电脑同款：悬停/按住预览黄（主盘号 ↔ 弯道号 / 法式） */
      function bindHoverLit(root, filterFn) {
        if (!root) return;
        root.querySelectorAll('[data-bet]').forEach((zone) => {
          if (filterFn && !filterFn(zone)) return;
          const key = zone.dataset.bet;
          if (!key) return;
          zone.addEventListener('pointerenter', () => { hoverMarket = key; paintLit(); });
          zone.addEventListener('pointerdown', () => { hoverMarket = key; paintLit(); });
          zone.addEventListener('pointerleave', () => {
            if (hoverMarket === key) hoverMarket = null;
            paintLit();
          });
          zone.addEventListener('pointerup', () => {
            if (hoverMarket === key) hoverMarket = null;
            paintLit();
          });
        });
      }
      bindHoverLit(boardGrid, (z) => z.classList.contains('n') || z.classList.contains('zero'));
      bindHoverLit(document.getElementById('trackStage'), null);
      paintHistory();
      paintMeta();
      paintTimer();
      layoutPcFrame();
      window.addEventListener('resize', layoutPcFrame);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', layoutPcFrame);

      wallet.hydrate().then((n) => {
        if (n != null && Number.isFinite(Number(n))) balance = Math.max(0, Math.round(Number(n)));
        paintMeta();
      }).catch(() => {});

      runRound();
    })();
  </script>
</body>
</html>
