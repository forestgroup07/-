<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Forest Group · 联系客服</title>
  <style>
    :root {
      --gold: #d4b06a;
      --ink: #1a1d24;
      --line: #d8d8d8;
      --muted: #666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #f3f3f3;
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 1.2rem 1rem 2rem;
    }
    .box {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 1.1rem 1.2rem 1.4rem;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #333;
      margin-bottom: .55rem;
    }
    .lead {
      font-size: .9rem;
      color: #444;
      line-height: 1.55;
      margin-bottom: .85rem;
      padding-bottom: .75rem;
      border-bottom: 1px dashed #ccc;
    }
    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: .9rem;
      font-weight: 700;
      margin-bottom: .35rem;
    }
    .field label .req { color: #d33; margin-right: .15rem; }
    .field .hint {
      font-size: .78rem;
      color: var(--muted);
      font-weight: 400;
      margin-left: .35rem;
    }
    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid #bbb;
      border-radius: 2px;
      padding: .45rem .55rem;
      font-size: .92rem;
      font-family: inherit;
      background: #fff;
    }
    .field textarea {
      min-height: 160px;
      resize: vertical;
      line-height: 1.45;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: .4rem;
    }
    .btn-submit {
      border: 1px solid #999;
      background: linear-gradient(180deg, #f7f7f7, #e4e4e4);
      color: #222;
      font-size: .95rem;
      font-weight: 700;
      padding: .45rem 1.2rem;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-submit:disabled { opacity: .55; cursor: default; }
    .btn-back {
      border: 0;
      background: transparent;
      color: #2a6ebd;
      font-size: .88rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .req-note { color: #d33; font-size: .82rem; margin-left: auto; }
    .err {
      margin-top: .75rem;
      color: #c0392b;
      font-size: .88rem;
      min-height: 1.2em;
    }
    .ok {
      margin-top: .75rem;
      color: #1a7f37;
      font-size: .9rem;
      display: none;
    }
    .ok.show { display: block; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Forest Group</h1>
    <p class="lead">准备与服务人员连线，为了加快处理作业，请先输入以下资料：</p>
    <form id="csForm">
      <div class="field">
        <label><span class="req">*</span>用户名</label>
        <input id="csUser" name="user" type="text" maxlength="32" required autocomplete="username" />
      </div>
      <div class="field">
        <label><span class="req">*</span>WhatsApp</label>
        <input id="csWa" name="whatsapp" type="tel" maxlength="20" placeholder="如 +62812…" required />
      </div>
      <div class="field">
        <label>
          <span class="req">*</span>问题与需求
          <span class="hint" id="csCount">字数限制 300 个字以内，目前已经输入 0</span>
        </label>
        <textarea id="csBody" name="body" maxlength="300" required></textarea>
      </div>
      <div class="actions">
        <button class="btn-submit" id="csSubmit" type="submit">送出资料</button>
        <button class="btn-back" id="csBack" type="button">返回游戏</button>
        <span class="req-note">*为必填项目</span>
      </div>
      <p class="err" id="csErr"></p>
      <p class="ok" id="csOk">已送出，客服将尽快通过 WhatsApp 联系您。</p>
    </form>
  </div>
  <script>
  (function () {
    const V = 'v1.0.40';
    const API = 'api/sicbo-cs.php';
    const userEl = document.getElementById('csUser');
    const waEl = document.getElementById('csWa');
    const bodyEl = document.getElementById('csBody');
    const countEl = document.getElementById('csCount');
    const errEl = document.getElementById('csErr');
    const okEl = document.getElementById('csOk');
    const btn = document.getElementById('csSubmit');

    try {
      const u = (sessionStorage.getItem('fg_sicbo_user') || localStorage.getItem('fg_sicbo_last_user') || '').trim();
      if (u) userEl.value = u;
      const raw = sessionStorage.getItem('fg_sicbo_profile');
      if (raw) {
        const p = JSON.parse(raw);
        if (p && p.whatsapp) waEl.value = p.whatsapp;
        else if (p && p.contact && p.contactType === 'whatsapp') waEl.value = p.contact;
      }
    } catch (_) {}

    function paintCount() {
      const n = (bodyEl.value || '').length;
      countEl.textContent = '字数限制 300 个字以内，目前已经输入 ' + n;
    }
    bodyEl.addEventListener('input', paintCount);
    paintCount();

    document.getElementById('csBack').addEventListener('click', () => {
      if (history.length > 1) history.back();
      else location.href = 'game.html?v=' + V;
    });

    document.getElementById('csForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      okEl.classList.remove('show');
      const payload = {
        user: (userEl.value || '').trim(),
        whatsapp: (waEl.value || '').trim(),
        body: (bodyEl.value || '').trim(),
      };
      if (!payload.user) { errEl.textContent = '请填写用户名'; return; }
      if (!payload.whatsapp) { errEl.textContent = '请填写 WhatsApp'; return; }
      if (!payload.body) { errEl.textContent = '请填写问题与需求'; return; }
      btn.disabled = true;
      btn.textContent = '送出中…';
      try {
        const r = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const j = await r.json();
        if (!j || !j.ok) {
          errEl.textContent = (j && j.error) || '送出失败，请稍后重试';
          return;
        }
        okEl.classList.add('show');
        bodyEl.value = '';
        paintCount();
      } catch (_) {
        errEl.textContent = '网络异常，请稍后重试';
      } finally {
        btn.disabled = false;
        btn.textContent = '送出资料';
      }
    });
  })();
  </script>
</body>
</html>
